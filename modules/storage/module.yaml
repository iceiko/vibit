  nakama_aligned_feature_request_workflow_pilot_check_rule: runtime.nakama_aligned_feature_request_workflow_pilot
  realtime_messaging_owned_by_storage: false
  rule: Storage remains outside realtime protocol and WebSocket outbound delivery ownership.

