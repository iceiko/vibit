schema_version: 0.1
module: storage
category: domain
status: draft
summary: Owns player-owned small JSON storage object repository vocabulary, storage-neutral value types, completed PostgreSQL adapter handoff, application-owned runtime behavior, own-player storage object protocol routes, and the local alpha route proof while large object/blob storage, S3-compatible storage, production memory storage behavior, and direct Nakama/Pitaya API compatibility remain deferred.

decisions:
  - ADR-0109
  - ADR-0110
  - ADR-0111
  - ADR-0112
  - ADR-0113
  - ADR-0114
  - ADR-0115
  - ADR-0116
  - ADR-0117
  - ADR-0118
  - ADR-0119
  - ADR-0120

owns:
  entities:
    - storage_object
  data:
    - player_owned_small_json_storage_objects
    - planned_storage_objects_table
  permissions: []
  does_not_own:
    entities:
      - player_account
      - authentication_credential
      - runtime_session
      - websocket_connection
      - inventory
      - large_blob_object
      - s3_object
    data:
      - player_accounts
      - authentication_credentials
      - runtime_sessions
      - websocket_connection_state
      - inventory_records
      - large_object_blob_storage
      - s3_compatible_object_storage

public_api:
  status: storage_repository_interface_postgresql_adapter_runtime_behavior_protocol_route_implementation_and_local_proof_completed
  commands:
    - PutOwnStorageObject
    - DeleteOwnStorageObject
  queries:
    - GetOwnStorageObject
    - ListOwnStorageObjects
  repository_interface:
    owner: runtime/internal/modules/storage
    interface: runtime/internal/modules/storage.Repository
    source: runtime/internal/modules/storage/repository.go
    tests: runtime/internal/modules/storage/repository_test.go
    capabilities:
      - CreateStorageObject
      - GetStorageObject
      - ListStorageObjects
      - UpdateStorageObject
      - DeleteStorageObject
  vocabulary:
    owner_kind:
      - player
    status:
      - active
      - deleted
    conflict_classes:
      - object_already_exists
      - object_not_found
      - version_mismatch
      - invalid_expected_version
      - owner_scope_mismatch
      - deleted_object
      - storage_unavailable

events:
  publishes: []
  subscribes: []

errors:
  owns:
    - storage_object_repository_errors
  schemas:
    status: not_ratified
    rule: Repository errors are storage-neutral Go vocabulary only until public storage object runtime contracts are ratified.

permission_schemas:
  status: not_ratified
  rule: Route-scoped permissions remain deferred until storage objects runtime behavior and protocol routes are separately authorized.

dependencies:
  allowed: []
  forbidden:
    - direct_websocket_library
    - direct_protobuf_runtime
    - direct_postgresql_driver
    - direct_s3_sdk
    - direct_minio_client
    - authentication
    - session
    - inventory
  external_reference_boundaries:
    player_id:
      owner: player
      standard: docs/storage-objects-behavior-gate.md
      decision: ADR-0109
      rule: Storage object owner_id may identify a player owner, but this module does not authenticate, validate, create, or own player accounts or runtime sessions.

invariants:
  - storage_object_owner_kind_first_posture_is_player
  - storage_object_identity_is_owner_collection_key
  - storage_object_value_must_be_top_level_json_object
  - storage_object_version_must_be_positive
  - storage_object_errors_must_be_redacted
  - storage_object_repository_interface_must_remain_storage_neutral
  - storage_object_module_must_not_own_large_blob_or_s3_storage
  - storage_object_protocol_routes_must_use_validated_request_identity
  - storage_object_protocol_routes_must_not_accept_client_supplied_owner_id

generated:
  files: []
  directories: []
  planned_outputs:
    go_typed_contracts: []
    protobuf_message_shapes: []
    websocket_dispatch_shapes: []
    test_fixtures: []
  immutable_to_non_system_agents: true
  override_permission: generated_file_override

realtime_boundary:
      repository_next_work_item: W-0225
      repository_next_work_item_scope: define_local_alpha_example_client_path_gate
  agent_native_feature_request_test_workflow_standard: docs/agent-native-feature-request-test-workflow.md
