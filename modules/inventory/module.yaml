schema_version: 0.1
module: inventory
category: domain
status: draft
summary: Owns player inventory state, item grants, inventory reads, capacity rules, and inventory item invariants.

decisions:
  - ADR-0001
  - ADR-0008
  - ADR-0004
  - ADR-0005
  - ADR-0006
  - ADR-0007
  - ADR-0009
  - ADR-0011
  - ADR-0020

owns:
  entities:
    - inventory
    - inventory_item
  data:
    - inventory_records
    - inventory_items
  permissions:
    - inventory_grant_item
    - inventory_read
  does_not_own:
    entities:
      - player_account
      - item_catalog
      - currency_balance
      - reward_claim
      - match_session
    data:
      - player_accounts
      - item_catalog_entries
      - currency_balances
      - reward_claims
      - match_sessions

public_api:
  commands:
    - GrantItem
  queries:
    - GetInventory
  command_schemas:
    status: declared
    required_before_implementation:
      - GrantItem
    sources:
      GrantItem: contracts/inventory/commands/GrantItem.yaml
  query_schemas:
    status: declared
    required_before_implementation:
      - GetInventory
    sources:
      GetInventory: contracts/inventory/queries/GetInventory.yaml

events:
  publishes:
    - ItemGranted
  subscribes: []
  event_schemas:
    status: declared
    required_before_implementation:
      - ItemGranted
    sources:
      ItemGranted: contracts/inventory/events/ItemGranted.yaml

errors:
  owns:
    - INVENTORY_CAPACITY_EXCEEDED
    - INVALID_ITEM_QUANTITY
    - INVENTORY_PERMISSION_DENIED
  schemas:
    status: declared
    source: contracts/inventory/errors/inventory_errors.yaml

permission_schemas:
  status: declared
  source: contracts/inventory/permissions/inventory_permissions.yaml

dependencies:
  allowed: []
  forbidden:
    - player
    - currency
    - reward
    - quest
    - match
    - direct_postgresql_driver
    - direct_s3_sdk
    - direct_minio_client
  external_references:
    - player_id
    - item_id
    - reason

invariants:
  - item_quantity_must_be_positive
  - inventory_capacity_must_not_be_exceeded
  - grant_item_must_emit_item_granted_once
  - get_inventory_must_not_mutate_state
  - inventory_item_identity_must_be_stable

generated:
  files: []
  directories: []
  planned_outputs:
    go_typed_contracts:
      - GrantItem
      - GetInventory
      - ItemGranted
    protobuf_message_shapes:
      - GrantItemRequest
      - GrantItemResponse
      - GetInventoryRequest
      - GetInventoryResponse
      - ItemGranted
    websocket_dispatch_shapes:
      - inventory_command_dispatch
      - inventory_query_dispatch
    test_fixtures:
      - grant_item_fixture
      - get_inventory_fixture
  immutable_to_non_system_agents: true
  override_permission: generated_file_override

contracts:
  registry: .arch/contracts.yaml
  semantic_source_format: vibit_manifest_yaml
  wire_schema_format: protobuf
  wire_schema_status: first_inventory_proto_generated
  commands:
    GrantItem: contracts/inventory/commands/GrantItem.yaml
  queries:
    GetInventory: contracts/inventory/queries/GetInventory.yaml
  events:
    ItemGranted: contracts/inventory/events/ItemGranted.yaml
  errors: contracts/inventory/errors/inventory_errors.yaml
  permissions: contracts/inventory/permissions/inventory_permissions.yaml

handwritten:
  extension_points:
    command_handlers:
      - GrantItem
    query_handlers:
      - GetInventory
    policies:
      - inventory_capacity_policy
      - inventory_permission_policy
    repositories:
      - inventory_repository
    test_suites:
      - grant_item_command_tests
      - get_inventory_query_tests
      - item_granted_event_tests
      - inventory_invariant_tests

proof_slice:
  status: runtime_request_loop_complete_explicit_postgresql_composition_created_live_verification_pending
  goal: Prove requirement -> spec -> contract -> generated shape -> handwritten logic -> tests -> verification -> docs for one inventory capability.
  first_command: GrantItem
  first_query: GetInventory
  first_event: ItemGranted
  persistence_assumption: postgresql_is_first_authoritative_store_when_runtime_persistence_begins
  object_storage_required_for_first_slice: false
  runtime_implementation: repository_policy_handler_protocol_bridge_websocket_process_wiring_request_loop_fixture_postgresql_adapter_and_explicit_postgresql_composition_created
  persistence_boundary:
    standard: docs/postgresql-persistence-boundary.md
    decision: ADR-0020
    first_authoritative_store: PostgreSQL
    repository_interface_owner: runtime/internal/modules/inventory
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    migration_source_owner: runtime/migrations/postgres
    transaction_boundary_owner: runtime/internal/platform/tx
    mutation_lock:
      aggregate: inventory_account
      key: player_id
      interface: LockInventoryForMutation
      locked_view: MutationLock
      applies_to:
        - GrantItem
      required_sequence:
        - validate_request
        - check_permission
        - lock_inventory_for_mutation
        - read_current_inventory_through_lock
        - enforce_capacity_policy
        - grant_item_through_lock
        - release_lock_without_committing_transaction
      reason: Inventory capacity depends on the current player item set, so persistent grants require a command-safe aggregate lock before mutation.
    planned_tables:
      - inventory_accounts
      - inventory_items
      - inventory_item_grants
    migration_source: runtime/migrations/postgres/000001_create_inventory_state.sql
    migration_status: source_created_apply_status_runner_created_opt_in_live_test_created_skipped_without_dsn
    verification_environment: docs/postgresql-verification-environment.md
    postgres_adapter:
      package: runtime/internal/platform/persistence/postgres
      file: runtime/internal/platform/persistence/postgres/inventory_repository.go
      tests: runtime/internal/platform/persistence/postgres/inventory_repository_test.go
      construction: NewInventoryRepositoryForUnitOfWork
      status: wired_in_explicit_postgres_runtime_path
      binding_rule: Adapter receives an injected pgx-shaped executor from the application-owned unit of work and does not open hidden write transactions.
      grant_recording: GrantItemMutation carries event_id, occurred_at, and reason so inventory_item_grants rows can be recorded with the quantity mutation.
      live_integration_status: opt_in_test_created_live_execution_skipped_without_dsn
    runtime_composition:
      store_selector: VIBIT_RUNTIME_STORE
      default_store: memory
      postgres_store: postgres
      process_file: runtime/cmd/vibit-server/main.go
      application_bootstrap_files:
        - runtime/internal/app/bootstrap/inventory.go
        - runtime/internal/app/bootstrap/postgres_inventory.go
      command_repository_source: postgres.UnitOfWork.NewInventoryRepository
      query_repository_source: postgres.NewInventoryRepositoryForUnitOfWork(pool)
      startup_migrations: not_applied_automatically
      live_end_to_end_status: opt_in_test_created_live_execution_skipped_without_dsn
      live_end_to_end_test: runtime/internal/platform/protocol/protobuf/postgres_request_loop_integration_test.go
    status: postgresql_adapter_wired_in_explicit_runtime_path_opt_in_live_test_created_skipped_without_dsn
  protocol_bridge:
    owner: runtime/internal/platform/protocol/protobuf
    file: runtime/internal/platform/protocol/protobuf/inventory_bridge.go
    tests: runtime/internal/platform/protocol/protobuf/inventory_bridge_test.go
  first_runtime_language: Go
  first_client_protocol: WebSocket
  first_wire_format: Protobuf
  non_goals:
    - full_item_catalog
    - player_account_lifecycle
    - currency_transactions
    - reward_claim_flow
    - match_session_inventory_sync

tests:
  required:
    - unit_tests
    - command_tests
    - query_tests
    - event_tests
    - contract_tests
    - invariant_tests
    - architecture_tests
  not_available_until_runtime:
    - event_tests
  available:
    - runtime_command_tests
    - runtime_query_tests
    - runtime_permission_tests
    - runtime_capacity_tests
    - runtime_dispatcher_integration_tests
