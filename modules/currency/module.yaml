schema_version: 0.1
module: currency
category: domain
status: draft
summary: Owns storage-neutral currency wallet repository vocabulary, value types, normalizers, idempotency handoff, conflict classes, redacted repository errors, application-owned wallet runtime behavior, and the protected currency wallet protocol route while rewards, purchases, inventory integration, SDKs, hosted deployments, distributed runtime, and direct Nakama/Pitaya API compatibility remain deferred.

decisions:
  - ADR-0199
  - ADR-0200
  - ADR-0201
  - ADR-0202
  - ADR-0203
  - ADR-0204
  - ADR-0205
  - ADR-0206
  - ADR-0207
  - ADR-0208
  - ADR-0209
  - ADR-0210

owns:
  entities:
    - currency_wallet
    - currency_wallet_balance
    - currency_wallet_transaction
  data:
    - currency_wallets_logical_table
    - currency_wallet_balances_logical_table
    - currency_wallet_transactions_logical_table
    - currency_wallet_repository_interface_vocabulary
  permissions: []
  does_not_own:
    entities:
      - player_account
      - authentication_credential
      - runtime_session
      - websocket_connection
      - inventory_item
      - reward_definition
      - purchase_catalog
      - payment_provider_payload
      - match_session
    data:
      - player_accounts
      - authentication_credentials
      - runtime_sessions
      - websocket_connection_state
      - inventory_records
      - reward_execution_state
      - purchase_catalog_tables
      - payment_provider_payloads
      - match_runtime_state
      - currency_catalog
      - currency_wallet_events

public_api:
  status: protocol_route_implemented
  commands:
    - currency.EnsurePlayerWallet
    - currency.GrantCurrency
    - currency.SpendCurrency
  queries:
    - currency.GetOwnWallet
    - currency.ListOwnWalletBalances
    - currency.ListOwnWalletTransactions
  repository_interface:
    owner: runtime/internal/modules/currency
    interface: runtime/internal/modules/currency.Repository
    source: runtime/internal/modules/currency/repository.go
    tests: runtime/internal/modules/currency/repository_test.go
    capabilities:
      - CreateCurrencyWallet
      - GetCurrencyWallet
      - GetCurrencyWalletForOwner
      - ListCurrencyWalletBalances
      - RecordCurrencyGrant
      - RecordCurrencySpend
      - ListCurrencyWalletTransactions
  vocabulary:
    owner_kind:
      - player
    lifecycle_state:
      - active
      - suspended
      - closed
    transaction_kind:
      - grant
      - spend
    actor_kind:
      - system
      - player
      - operation
    conflict_classes:
      - wallet_not_found
      - wallet_already_exists
      - wallet_owner_mismatch
      - wallet_not_active
      - currency_balance_not_found
      - invalid_currency_code
      - invalid_currency_amount
      - insufficient_balance
      - duplicate_transaction
      - conflicting_duplicate_transaction
      - invalid_idempotency_key
      - invalid_transaction_kind
      - version_mismatch
      - stale_wallet_version
      - stale_balance_version
      - storage_unavailable

events:
  publishes: []
  subscribes: []

errors:
  owns:
    - currency_wallet_repository_errors
  schemas:
    status: not_ratified
    rule: Repository errors are storage-neutral Go vocabulary only until public currency wallet runtime contracts are ratified.

permission_schemas:
  status: not_ratified
  rule: Route-scoped currency permissions remain deferred until runtime behavior and protocol routes are separately authorized.

dependencies:
  allowed: []
  forbidden:
    - direct_websocket_library
    - direct_protobuf_runtime
    - direct_postgresql_driver
    - authentication
    - session
    - storage
    - friends
    - inventory
    - rewards
    - purchases
    - payments
    - matchmaking
    - match_runtime
    - distributed_runtime
  external_reference_boundaries:
    player_id:
      owner: player
      standard: docs/currency-wallet-repository-boundary.md
      decision: ADR-0203
      rule: Currency wallet owner_id may identify a player owner, but this module does not authenticate, validate, create, or own player accounts or runtime sessions.
    request_identity:
      owner: runtime/internal/app
      standard: docs/currency-wallet-repository-boundary.md
      decision: ADR-0203
      rule: Future runtime behavior must derive owner and actor identity from validated request identity or service-authoritative context before calling this repository interface.

invariants:
  - currency_wallet_owner_kind_first_posture_is_player
  - currency_wallet_lifecycle_state_vocabulary_must_remain_closed
  - currency_wallet_transaction_kind_vocabulary_must_remain_grant_or_spend
  - currency_wallet_actor_kind_vocabulary_must_remain_closed
  - currency_amounts_must_use_integer_minor_units
  - balance_amount_and_balance_after_must_be_non_negative
  - grant_amounts_must_be_positive
  - spend_amounts_must_be_positive_inputs_and_negative_transaction_deltas
  - idempotency_key_and_scope_are_required_for_mutation_inputs
  - private_wallet_state_must_not_be_log_safe_by_default
  - repository_errors_must_be_redacted
  - repository_interface_must_remain_storage_neutral
  - repository_interface_must_not_authenticate_or_validate_sessions
  - postgresql_adapter_behavior_must_remain_deferred_until_adapter_gate
  - runtime_behavior_and_protocol_routes_must_remain_deferred
  - direct_nakama_pitaya_api_compatibility_must_remain_false

generated:
  files: []
  directories: []
  planned_outputs:
    go_typed_contracts: []
    protobuf_message_shapes: []
    websocket_dispatch_shapes: []
    test_fixtures: []
  immutable_to_non_system_agents: true
  override_permission: generated_file_override

