schema_version: 0.1
kind: command
module: runtime
family: authentication
name: AuthenticateWithDeviceCredential
status: draft
owner: runtime/internal/app
decision_refs:
  - ADR-0023
  - ADR-0024
  - ADR-0025
  - ADR-0026
  - ADR-0027

standard_refs:
  - docs/authentication-contract-error-permission-surfaces.md
  - docs/first-login-method-set.md
  - docs/first-token-format-proof-carrier-posture.md
  - docs/token-lifecycle-storage-implications.md

summary: Authenticate a player with the selected high-entropy device credential login method and issue an opaque access token.

intent: >
  Define the future semantic login command for the ratified first login method.
  The command may validate a high-entropy installation credential, apply account
  lookup or creation policy, and issue an opaque access token only after future
  credential and token verifier schema gates exist. This contract does not add
  runtime handlers, WebSocket routes, Protobuf wire messages, credential tables,
  token tables, session tables, migrations, or token generation behavior.

permission: authentication_device_credential_login

input:
  type: object
  required:
    - credential_proof
  properties:
    credential_proof:
      type: string
      minLength: 1
      secret: true
      description: High-entropy installation credential proof material. It is not a raw operating-system device ID or metadata-only value.
    requested_player_id:
      type: string
      description: Optional account-selection hint after future policy ratification. It is not proof.
    client_instance_id:
      type: string
      description: Optional non-secret client installation label for future abuse and audit correlation.
    account_creation_intent:
      type: string
      enum:
        - allow_create
        - authenticate_existing_only
      default: allow_create

output:
  type: object
  required:
    - authentication_status
    - actor_kind
    - player_id
    - access_token
    - token_type
    - expires_at
  properties:
    authentication_status:
      type: string
      enum:
        - authentication_proven
    actor_kind:
      type: string
      const: player
    player_id:
      type: string
      minLength: 1
    access_token:
      type: string
      secret: true
      description: Opaque high-entropy bearer token presented once to the client.
    token_type:
      type: string
      const: bearer
    expires_at:
      type: string
      format: date-time
    issued_at:
      type: string
      format: date-time
    token_record_id:
      type: string
      description: Audit-safe token record identifier, not derived from raw token text.

emits:
  - AuthenticationSucceeded
  - TokenIssued

errors:
  - AUTHENTICATION_PROOF_MISSING
  - AUTHENTICATION_PROOF_MALFORMED
  - AUTHENTICATION_CREDENTIAL_INVALID
  - AUTHENTICATION_ACCOUNT_DISABLED
  - AUTHENTICATION_RATE_LIMITED
  - AUTHENTICATION_CREDENTIAL_STORE_UNAVAILABLE
  - AUTHENTICATION_TOKEN_STORE_UNAVAILABLE
  - AUTHENTICATION_NOT_IMPLEMENTED

invariants:
  - device_credential_login_must_use_secret_proof_material
  - raw_credential_must_be_redacted
  - raw_access_token_must_be_redacted_after_client_presentation
  - player_account_lifecycle_tables_must_not_store_credentials_or_tokens
  - websocket_transport_must_not_parse_credentials
  - protobuf_envelope_must_not_carry_token_by_current_metadata_fields
  - generated_files_must_not_be_hand_edited

authorization:
  requires_permission: authentication_device_credential_login
  permission_basis: unauthenticated_login_entrypoint
  metadata_only_identity_sufficient: false

implementation:
  handwritten_extension_point: runtime/internal/app/AuthService
  generated_outputs: []
  runtime_status: semantic_contract_only
  blocked_until:
    - credential_schema_gate_defined
    - token_verifier_schema_gate_defined
    - credential_repository_boundary_defined
    - token_verifier_repository_boundary_defined
    - redaction_tests_defined
    - runtime_authentication_implementation_milestone_selected
