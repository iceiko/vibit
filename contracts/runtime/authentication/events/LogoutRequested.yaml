schema_version: 0.1
kind: event
module: runtime
family: authentication
name: LogoutRequested
status: draft
owner: runtime/internal/app
decision_refs:
  - ADR-0026
  - ADR-0027

standard_refs:
  - docs/authentication-contract-error-permission-surfaces.md
  - docs/token-lifecycle-storage-implications.md

summary: Audit-oriented fact that logout was requested for the presented access token.

description: >
  A future logout command requested revocation of the presented access token.
  This event does not imply all-session logout, WebSocket close behavior, or
  account-wide revocation.

payload:
  type: object
  required:
    - logout_scope
    - occurred_at
  properties:
    logout_scope:
      type: string
      const: presented_access_token
    token_record_id:
      type: string
    occurred_at:
      type: string
      format: date-time

forbidden_payload_fields:
  - raw_token
  - token_prefix
  - token_verifier_hash
  - raw_credential

visibility:
  client_visible: false
  audit_visible: true

implementation:
  generated_outputs: []
  runtime_status: semantic_contract_only
