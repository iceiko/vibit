schema_version: 0.1
kind: event
module: runtime
family: authentication
name: TokenValidationFailed
status: draft
owner: runtime/internal/app
decision_refs:
  - ADR-0023
  - ADR-0026
  - ADR-0027

standard_refs:
  - docs/authentication-contract-error-permission-surfaces.md
  - docs/authentication-proof-token-session-contract-dimensions.md

summary: Audit-oriented fact that access-token validation failed before domain dispatch.

description: >
  A future token validator rejected or could not evaluate explicit access-token
  proof. The event must not include the raw token or enough token prefix to be
  useful for brute force.

payload:
  type: object
  required:
    - failure_class
    - occurred_at
  properties:
    failure_class:
      type: string
      enum:
        - missing_proof
        - malformed_proof
        - invalid_proof
        - expired_proof
        - revoked_proof
        - validator_unavailable
        - not_implemented
    token_record_id:
      type: string
      description: Audit-safe token record identifier when known.
    route_module:
      type: string
    route_name:
      type: string
    occurred_at:
      type: string
      format: date-time

forbidden_payload_fields:
  - raw_token
  - token_prefix
  - token_verifier_hash
  - raw_credential

visibility:
  client_visible: false
  audit_visible: true

implementation:
  generated_outputs: []
  runtime_status: semantic_contract_only
