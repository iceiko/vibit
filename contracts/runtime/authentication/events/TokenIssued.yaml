schema_version: 0.1
kind: event
module: runtime
family: authentication
name: TokenIssued
status: draft
owner: runtime/internal/app
decision_refs:
  - ADR-0026
  - ADR-0027

standard_refs:
  - docs/authentication-contract-error-permission-surfaces.md
  - docs/token-lifecycle-storage-implications.md

summary: Audit-oriented fact that an opaque access token verifier record was issued.

description: >
  A future authentication boundary issued an opaque access token and created or
  updated non-plaintext verifier state. The raw access token must never appear
  in this event.

payload:
  type: object
  required:
    - token_record_id
    - actor_kind
    - player_id
    - issued_at
    - expires_at
  properties:
    token_record_id:
      type: string
    actor_kind:
      type: string
      const: player
    player_id:
      type: string
    issued_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time

forbidden_payload_fields:
  - raw_token
  - token_prefix
  - token_verifier_hash
  - raw_credential

visibility:
  client_visible: false
  audit_visible: true

implementation:
  generated_outputs: []
  runtime_status: semantic_contract_only
