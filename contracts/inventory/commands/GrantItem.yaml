schema_version: 0.1
kind: command
module: inventory
name: GrantItem
status: draft
decision_refs:
  - ADR-0005
  - ADR-0006
  - ADR-0007
  - ADR-0009

summary: Grant an item quantity to a player's inventory.

intent: >
  Add a positive quantity of an item to an inventory owned by a player,
  subject to permission and capacity checks.

permission: inventory_grant_item

input:
  type: object
  required:
    - player_id
    - item_id
    - quantity
    - reason
    - requested_by
  properties:
    player_id:
      type: string
      minLength: 1
      description: Stable external player identifier. The inventory module references it but does not own player accounts.
    item_id:
      type: string
      minLength: 1
      description: Stable external item identifier. The inventory module references it but does not own the item catalog.
    quantity:
      type: integer
      minimum: 1
      description: Positive quantity to grant.
    reason:
      type: string
      minLength: 1
      description: Public audit reason for the grant.
    requested_by:
      type: string
      minLength: 1
      description: Actor requesting the grant.

output:
  type: object
  required:
    - player_id
    - item_id
    - quantity
    - new_quantity
    - event
  properties:
    player_id:
      type: string
    item_id:
      type: string
    quantity:
      type: integer
      minimum: 1
    new_quantity:
      type: integer
      minimum: 1
    event:
      const: ItemGranted

emits:
  - ItemGranted

errors:
  - INVALID_ITEM_QUANTITY
  - INVENTORY_CAPACITY_EXCEEDED
  - INVENTORY_PERMISSION_DENIED

invariants:
  - item_quantity_must_be_positive
  - inventory_capacity_must_not_be_exceeded
  - grant_item_must_emit_item_granted_once
  - inventory_item_identity_must_be_stable

idempotency:
  required: false
  note: The first proof slice does not define an idempotency key. Add one before external retries are supported.

authorization:
  requires_permission: inventory_grant_item

implementation:
  handwritten_extension_point: runtime/internal/modules/inventory/commands/GrantItem
  generated_outputs:
    - go_typed_contract
    - protobuf_message_shape
    - websocket_command_dispatch_shape
    - test_fixture
  runtime_status: not_started
