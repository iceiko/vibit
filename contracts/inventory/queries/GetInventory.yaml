schema_version: 0.1
kind: query
module: inventory
name: GetInventory
status: draft
decision_refs:
  - ADR-0005
  - ADR-0006
  - ADR-0007
  - ADR-0009

summary: Read a player's inventory without mutating state.

intent: >
  Return the current inventory items for a player. The query must not change
  inventory state, emit events, or perform writes.

permission: inventory_read

input:
  type: object
  required:
    - player_id
    - requested_by
  properties:
    player_id:
      type: string
      minLength: 1
      description: Stable external player identifier.
    requested_by:
      type: string
      minLength: 1
      description: Actor requesting the inventory read.

output:
  type: object
  required:
    - player_id
    - items
  properties:
    player_id:
      type: string
    items:
      type: array
      items:
        type: object
        required:
          - item_id
          - quantity
        properties:
          item_id:
            type: string
          quantity:
            type: integer
            minimum: 1

emits: []

errors:
  - INVENTORY_PERMISSION_DENIED

invariants:
  - get_inventory_must_not_mutate_state
  - inventory_item_identity_must_be_stable

authorization:
  requires_permission: inventory_read

implementation:
  handwritten_extension_point: runtime/internal/modules/inventory/queries/GetInventory
  generated_outputs:
    - go_typed_contract
    - protobuf_message_shape
    - websocket_query_dispatch_shape
    - test_fixture
  runtime_status: not_started
