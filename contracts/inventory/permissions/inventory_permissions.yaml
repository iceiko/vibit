schema_version: 0.1
kind: permission_catalog
module: inventory
status: draft
decision_refs:
  - ADR-0005
  - ADR-0006
  - ADR-0007

summary: Permission catalog for the first inventory proof slice.

permissions:
  - id: inventory_grant_item
    description: Allows an actor to grant item quantities to a player's inventory.
    grants_access_to:
      commands:
        - GrantItem
      queries: []
  - id: inventory_read
    description: Allows an actor to read a player's inventory.
    grants_access_to:
      commands: []
      queries:
        - GetInventory

implementation:
  generated_outputs:
    - typed_permissions
    - permission_test_fixtures
  runtime_status: not_started
