syntax = "proto3";

package vibit.storage.v1;

option go_package = "github.com/iceiko/vibit/runtime/internal/generated/proto/vibit/storage/v1;storagev1";

// @source docs/storage-objects-protocol-route-gate.md
// @source decisions/ADR-0118-storage-objects-protocol-route-gate.md
