acceptance_criteria:
  - The gate defines allowed route handler pipeline vocabulary.
  - The gate maps current protocol adapter, route request, application dispatch, transactional dispatch, protocol bridge, and outbound message surfaces to future route handler pipeline vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0260 as a narrow source-first route handler pipeline map work item.
  - The gate does not add route handler implementation, handler routing behavior, handler pipeline behavior, pipeline middleware behavior, serializer behavior, message forwarding behavior, backend route targeting, runtime behavior, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

