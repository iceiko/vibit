lifecycle_invariants:
  - self_targeting_forbidden
  - duplicate_request_forbidden_or_explicit_idempotency_required_before_implementation
  - accept_only_incoming_pending_request
  - reject_only_incoming_pending_request
  - remove_only_existing_friendship_not_block
  - block_overrides_pending_or_friend_relationship
  - unblock_does_not_restore_prior_friendship
  - public_status_actor_relative
  - private_social_graph_not_log_safe_by_default
  - public_failures_do_not_leak_hidden_relationship_details_where_privacy_requires_collapse

acceptance_criteria:
  - The gate defines future friend request, accept, reject, remove, block, unblock, list, and relationship-status semantics.
  - The gate records future command, query, event, error, permission, actor-relative state, invariant, redaction, and test vocabulary.
  - The gate requires validated player identity and rejects metadata-only `player_id` or `session_id` as proof.
  - The gate maps the capability to Nakama `friends_groups_and_parties` while keeping Pitaya deferred.
  - The gate opens W-0232 as `Define friends relationship persistence schema gate`.
  - The gate adds no runtime behavior, protocol route, Protobuf source, generated output, migration, repository interface, PostgreSQL adapter, dependency, startup wiring, broader social feature, hosted surface, distributed runtime, or direct compatibility scope.

test_plan:
  positive_behavior:
    - Future tests must cover sending a friend request.
    - Future tests must cover accepting an incoming friend request.
    - Future tests must cover rejecting an incoming friend request.
    - Future tests must cover removing an existing friend relationship.
    - Future tests must cover blocking a target player.
    - Future tests must cover unblocking a previously blocked player.
    - Future tests must cover listing actor-relative relationships.
    - Future tests must cover reading actor-relative relationship status.
  negative_behavior:
    - Future tests must cover self-targeting.
    - Future tests must cover duplicate request or explicitly selected idempotency behavior.
    - Future tests must cover invalid transition.
    - Future tests must cover blocked relationship interaction.
    - Future tests must cover missing or unknown target.
    - Future tests must cover missing relationship.
    - Future tests must cover metadata-only identity.
  permission_and_authentication:
    - Future tests must require validated player identity for every command/query.
    - Future tests must reject or ignore client-supplied actor id.
    - Future tests must reject metadata-only `player_id` and `session_id` as proof.
  persistence_and_transactions:
    - Future schema and repository tests must be defined after W-0232 and before migration, adapter, or runtime implementation.
    - Future command transitions must be transactional.
    - Future emitted events and state changes must remain consistent within the unit-of-work boundary.
  protocol_mapping:
    - Protocol routes and Protobuf payloads are deferred until semantic and persistence gates are stable.
  failure_paths_and_redaction:
    - Future public errors must avoid leaking private relationship graph details where privacy requires collapse.
    - Future logs must not expose raw credentials, tokens, verifier keys, digests, transport metadata, or private social graph internals.
  concurrency_or_ordering:
    - Future tests must define simultaneous request, accept, reject, remove, block, and unblock conflict behavior before runtime implementation.
  integration_or_e2e:
    - Local alpha E2E proof is deferred until route and runtime implementation slices are authorized.
  repository_checks:
    - node tools/vibit check change define-friends-relationship-lifecycle-gate --json

