user_requirement: "Define a Nakama-first friends relationship lifecycle gate for vibit so a future player social graph can support sending friend requests, accepting, rejecting, removing, blocking, unblocking, listing relationships, and reading relationship status through server-authoritative rules before runtime behavior, protocol routes, persistence, generated output, or broader social features are implemented."
user_visible_outcome: A completed gate standard records future friends relationship lifecycle semantics, acceptance criteria, tests, identity rules, invariants, redaction, deferrals, and opens the persistence schema gate before implementation.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Friend relationship lifecycle is a core social graph primitive in Nakama-class backends and should precede richer social surfaces such as groups, parties, chat targeting, invites, matchmaking filters, and match social context.
  adopted:
    - Friend request, accept, reject, remove, block, unblock, list, and relationship status are treated as first-class future social graph semantics.
    - Server-authoritative state transitions, validated player identity, explicit errors, events, permissions, redaction, and tests must be defined before behavior is implemented.
  adapted:
    - vibit uses its own contract-first lifecycle vocabulary rather than direct external API compatibility.
    - Public relationship status is actor-relative even if a future persisted canonical state is pair-oriented.
    - The next step is a persistence schema gate, not runtime behavior.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - groups, parties, chat, matchmaking, match runtime, SDKs, hosted surfaces, distributed runtime, and broad social module expansion in this gate
  pitaya_status: deferred_future_architecture_reference

