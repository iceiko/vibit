acceptance_criteria:
  - The gate defines allowed acceptor and connection lifecycle vocabulary.
  - The gate maps current WebSocket acceptor, connection id/epoch, first-message binding, active connection registry, close handoff, and presence lifecycle surfaces to future acceptor/connection lifecycle vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0266 as a narrow source-first acceptor and connection lifecycle map work item.
  - The gate does not add acceptor behavior, TCP acceptors, WebSocket behavior changes, connection lifecycle behavior changes, session binding behavior, kick/disconnect behavior, runtime behavior, protocol shape, generated output, persistence, dependencies, metrics/tracing behavior, hosted surfaces, SDKs, or direct compatibility.

