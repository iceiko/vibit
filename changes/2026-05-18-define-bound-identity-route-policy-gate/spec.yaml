data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Future route policy remains application-owned under runtime/internal/app.
    - Authentication service remains proof/token/session-creation composition and does not own route policy.
    - WebSocket transport remains credential-neutral.
    - Protobuf adapter remains carrier/adapter only and does not decide policy.

