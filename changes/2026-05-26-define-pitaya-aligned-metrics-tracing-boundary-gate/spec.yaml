acceptance_criteria:
  - The gate defines allowed metrics and tracing vocabulary.
  - The gate maps current runtime observability, operations, health/readiness, route inventory, repository verification, redaction posture, and deferred telemetry surfaces to future metrics/tracing vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0275 as a narrow source-first metrics and tracing map work item.
  - The gate does not add runtime endpoint behavior, metrics endpoints, tracing pipelines, observability pipelines, dashboards, admin console behavior, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, release artifacts, distributed runtime behavior, or direct compatibility.

