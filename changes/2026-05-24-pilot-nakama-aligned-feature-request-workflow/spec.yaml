user_requirement: Prove self-presence/status through the authenticated local alpha flow, including online after connection binding and offline after close or invalidation.
nakama_capability_family: presence_status_and_notifications

nakama_capability_mapping:
  family: presence_status_and_notifications
  product_intent: Presence/status lets developers observe whether a player is online through server-owned connection state before broader realtime, social, or multiplayer features depend on it.
  existing_foundation:
    - runtime/internal/app/presence/presence.go
    - runtime/internal/app/connection/registry.go
    - proto/vibit/presence/v1/presence.proto
    - runtime/internal/platform/protocol/protobuf/presence_bridge.go
    - runtime/internal/platform/protocol/protobuf/authenticated_gameplay_e2e_test.go
  deferred:
    - presence subscriptions
    - status broadcast fanout
    - friends/groups/parties
    - chat
    - matchmaking
    - match runtime
    - durable or distributed presence
    - direct Nakama/Pitaya API compatibility

workflow_phases:
  user_requirement:
    recorded: true
    artifact: request.md
  requirement_spec:
    recorded: true
    artifact: spec.yaml
  nakama_capability_mapping:
    recorded: true
    family: presence_status_and_notifications
  acceptance_criteria:
    recorded: true
  test_plan:
    recorded: true
  tests:
    pilot_slice_tests_applicable: false
    rationale: This pilot selects and scopes the follow-up slice; W-0222 will add or strengthen runtime tests.
  implementation_boundaries:
    recorded: true
  verification_phase:
    recorded: true
  durable_memory:
    recorded: true

acceptance_criteria:
  - The pilot applies the workflow from docs/agent-native-feature-request-test-workflow.md to one concrete user-facing capability request.
  - The selected request maps to Nakama-style presence/status, not to direct API compatibility.
  - The pilot identifies existing implementation surfaces and test surfaces relevant to the follow-up slice.
  - The pilot opens W-0222 as a bounded runtime proof-hardening slice.
  - The pilot does not add runtime behavior, protocol routes, Protobuf source, generated output, migrations, dependencies, persistence, subscriptions, broadcasts, broad social/multiplayer modules, distributed runtime, or direct compatibility.

test_plan:
  pilot_slice:
    - Repository check for W-0221 completion and W-0222 next-ready state.
    - Runtime check for ADR-0129, change artifacts, Nakama mapping, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  follow_up_w_0222:
    - Go tests for online presence from active bound connections.
    - Go tests for offline presence after transport close and policy invalidation.
    - Local alpha request-flow proof using existing authenticated presence query where feasible.
    - Redaction and compatibility checks to ensure raw tokens, credentials, and direct Nakama/Pitaya API shapes are not exposed.

