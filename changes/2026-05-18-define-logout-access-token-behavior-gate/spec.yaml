schema_version: 0.1
change_id: define-logout-access-token-behavior-gate
date: 2026-05-18
type: standard
status: verified

summary: Define the gate-only boundary for future presented opaque access-token logout behavior.

affected_modules:
  - runtime
  - authentication

decisions:
  added:
    - ADR-0072
  referenced:
    - ADR-0019
    - ADR-0052
    - ADR-0056
    - ADR-0066
    - ADR-0068
    - ADR-0069
    - ADR-0070
    - ADR-0071

contracts:
  commands:
    added: []
    changed: []
    removed: []
  queries:
    added: []
    changed: []
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added: []
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Future logout behavior remains application-owned under runtime/internal/app/authentication.
    - Authentication repository remains storage-neutral and does not parse raw access tokens or decide logout proof validity.
    - Runtime sessions and active WebSocket connections remain separate future lifecycle decisions.

