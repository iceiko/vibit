user_requirement: "Define the storage-neutral friends relationship repository boundary after the friend_relationships migration source, preserving Nakama-first planning and deferring implementation."
user_visible_outcome: A future implementation agent can inspect a precise friends relationship repository boundary and then continue to W-0235 without guessing ownership, value types, conflict classes, identity handoff, redaction, or adapter expectations.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Friends relationship repository vocabulary is a prerequisite for Nakama-class social graph behavior before runtime request, accept, reject, remove, block, unblock, list, or status behavior can be implemented safely.
  adopted:
    - Friends relationships are durable social graph state.
    - Friend request, accept, reject, remove, block, unblock, list, and status behavior require repository-ready boundaries.
    - Private social graph data must have explicit redaction posture.
  adapted:
    - vibit uses a storage-neutral module repository boundary before PostgreSQL adapter behavior.
    - Public actor-relative status is computed later rather than stored as canonical database state.
    - The protocol and schema remain vibit-native and do not copy external APIs.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - adapter, protocol, runtime, group, party, chat, matchmaking, match runtime, SDK, hosted, or distributed runtime scope in this slice
  pitaya_status: deferred_future_architecture_reference

