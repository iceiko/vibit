  negative_behavior:
    - Static checks reject forbidden repository implementation, adapter, runtime, protocol, generated output, migration, dependency, event/audit, distributed runtime, and direct compatibility scope.
  permission_and_authentication:
    - Not applicable; this boundary records that actor identity must be derived from validated request identity later.
  persistence_and_transactions:
    - Static checks confirm the existing W-0233 migration source remains the source and no new migration is added.
  protocol_mapping:
    - Static checks confirm no friends Protobuf or protocol route is added.
  failure_paths_and_redaction:
    - Boundary records private social graph redaction and typed conflict expectations.
  concurrency_or_ordering:
    - Boundary records server-owned relationship_version and typed version conflict posture.
  integration_or_e2e:
    - Not applicable; no runtime or protocol behavior is added.
