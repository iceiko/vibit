acceptance_criteria:
  - The selected next capability family is `agent_native_requirement_test_implementation_workflow`.
  - The selected next direction is `define_agent_native_feature_request_scaffolding_gate`.
  - The selection records why the feature request scaffolding gate should precede chat, groups, matchmaking, match runtime, operations/admin behavior, SDK publication, hosted surfaces, distributed runtime, or direct compatibility.
  - The selection opens W-0228 as a bounded gate before implementation.
  - The selection does not add runtime behavior, protocol routes, Protobuf source, generated output, migrations, dependencies, persistence, startup wiring, SDKs, hosted deployments, release artifacts, broad product modules, Pitaya-style distributed architecture, or direct compatibility.

test_plan:
  selection_slice:
    - Repository check for W-0227 completion and W-0228 next-ready state.
    - Runtime check for ADR-0135, change artifacts, Nakama capability mapping, selected follow-up direction, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  follow_up_w_0228:
    - Define accepted scaffolding artifacts and ownership.
    - Define whether future implementation should add `tools/vibit` commands, templates, docs, or checks.
    - Define required redaction behavior for user requests, secrets, DSNs, tokens, credentials, transport metadata, and local env values.
    - Preserve no runtime behavior, protocol route, Protobuf source, generated output, migration, dependency, hosted demo, SDK publication, or direct compatibility scope.

