user_requirement: Make the AI-native path from user requirement to spec, acceptance criteria, tests, implementation boundaries, verification, and durable memory more executable before broadening Nakama-style modules.
nakama_capability_family: agent_native_requirement_test_implementation_workflow

nakama_capability_mapping:
  family: agent_native_requirement_test_implementation_workflow
  product_intent: Nakama-class frameworks are useful because they cover common game backend services. vibit's differentiator is that these services should be added through an AI-native requirement-to-test-to-implementation workflow that users and agents can run repeatably.
  adopted:
    - Nakama-first product capability coverage remains the reference for future feature families.
    - Developer-facing feature intake and verification must be explicit before broad module expansion.
  adapted:
    - The next slice is a vibit-native scaffolding gate, not a Nakama API or SDK surface.
    - The future gate should define templates, command posture, check coverage, and stop conditions before implementation.
  rejected:
    - direct Nakama API compatibility
    - public SDK publication
    - broad chat, groups, matchmaking, match runtime, operations/admin, or hosted-demo work in this selection
  pitaya_status: deferred_future_architecture_reference

decision_rationale:
  selected:
    direction: define_agent_native_feature_request_scaffolding_gate
    reason: The local alpha example path now makes existing backend capability readable. The next highest-leverage prototype-ready gap is making the product promise operational: a user opens a new backend requirement and AI can reliably scaffold the spec, acceptance criteria, test plan, implementation boundary, verification record, and durable memory before coding.
  deferred_candidates:
    define_minimal_operations_inspection_surface: Important before production-candidate work, but less central than the requirement-to-test product loop for the current user direction.
    define_notifications_or_realtime_delivery_flow_proof: Useful, but should follow a stronger feature intake and test scaffolding path.
    define_chat_or_group_messaging_gate: Product-useful but broadens social scope before the AI-native feature workflow is executable enough.
    define_matchmaking_gate: Product-class capability, but depends on a stronger feature request and test workflow.
    define_public_client_package_boundary: Useful later, but the current example path is enough for source-first alpha evaluation and SDK publication remains deferred.
    reactivate_pitaya_distributed_architecture_review: Explicitly deferred by the Nakama-first direction.

