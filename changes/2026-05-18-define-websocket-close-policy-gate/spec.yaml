schema_version: 0.1
change_id: define-websocket-close-policy-gate
date: 2026-05-18
type: standard
status: verified

summary: Define the gate-only boundary for future WebSocket close policy behavior.

affected_modules:
  - runtime
  - authentication

decisions:
  added:
    - ADR-0076
  referenced:
    - ADR-0019
    - ADR-0056
    - ADR-0057
    - ADR-0058
    - ADR-0066
    - ADR-0068
    - ADR-0069
    - ADR-0070
    - ADR-0071
