  events:
    added: []
    changed: []
    removed: []
  errors:
    added: []
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Future WebSocket close policy is application-owned under runtime/internal/app.
    - Future concrete transport close handoff may live under runtime/internal/platform/transport/ws after a later implementation gate.
    - Active connection registry remains target state under runtime/internal/app/connection and does not own close policy.
    - Authentication remains token lifecycle owner but does not own socket close policy.

