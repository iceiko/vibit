schema_candidate:
  selected_store: postgres
  future_migration_source_candidate: runtime/migrations/postgres/000008_create_currency_wallets.sql
  logical_tables:
    - currency_wallets
    - currency_wallet_balances
    - currency_wallet_transactions
  deferred_tables:
    - currency_catalog
    - currency_wallet_events
  wallet_table:
    logical_table: currency_wallets
    primary_key_candidate:
      - wallet_id
    logical_owner_identity:
      - owner_kind
      - owner_id
    required_columns:
      - wallet_id
      - owner_kind
      - owner_id
      - lifecycle_state
      - wallet_version
      - created_at
      - updated_at
      - state_changed_at
    nullable_columns:
      - suspended_at
      - closed_at
    owner_kind_first_value: player
    owner_player_fk_candidate: player_accounts(player_id)
    allowed_lifecycle_states:
      - active
      - suspended
      - closed
  balance_table:
    logical_table: currency_wallet_balances
    primary_key_candidate:
      - wallet_id
      - currency_code
    required_columns:
      - wallet_id
      - currency_code
      - balance_amount
      - balance_version
      - created_at
      - updated_at
    amount_type_candidate: BIGINT
    negative_balance_allowed_by_default: false
  transaction_table:
    logical_table: currency_wallet_transactions
    primary_key_candidate:
      - transaction_id
    required_columns:
      - transaction_id
      - wallet_id
      - currency_code
      - transaction_kind
      - amount_delta
      - balance_after
      - idempotency_key
      - idempotency_scope
      - actor_kind
      - created_at
    nullable_columns:
      - actor_id
      - reason_code
      - external_reference
      - metadata_json
    transaction_kinds:
      - grant
      - spend
  idempotency:
    owner: currency_wallet_transactions
    unique_candidate:
      - wallet_id
      - idempotency_scope
      - idempotency_key
    duplicate_application_allowed: false

acceptance_criteria:
  - The gate defines future currency wallet, balance, and transaction table candidates before SQL.
  - The gate records future wallet identity, balance identity, transaction/ledger, idempotency, catalog deferral, indexes, uniqueness, timestamps, and redaction expectations.
  - The gate records future migration source candidate, repository owner, PostgreSQL adapter owner, transaction posture, test expectations, and stop conditions.
  - The gate maps the capability to Nakama/Hiro economy coverage while keeping Pitaya deferred.
  - The gate opens W-0294 as `Add currency wallet migration source`.
  - The gate adds no migration source, wallet table, balance table, transaction table, repository interface, adapter implementation, runtime behavior, protocol route, Protobuf source, generated output, dependency, hosted surface, SDK, distributed runtime, or direct compatibility scope.

test_plan:
  positive_behavior:
    - Not applicable in this gate; no runtime behavior is added.
  negative_behavior:
    - Not applicable in this gate; no runtime behavior is added.
  permission_and_authentication:
    - Future behavior must require validated player identity for player-owned reads and spends; this gate records persistence posture only.
  persistence_and_transactions:
    - Future migration-source checks must cover table names, required columns, owner identity checks, wallet lifecycle state checks, balance amount non-negativity, positive version checks, timestamp checks, transaction kind checks, idempotency uniqueness, wallet owner uniqueness, balance uniqueness, and lookup indexes.
    - Future repository and adapter tests must be defined after migration source and repository/adapter gates.
  protocol_mapping:
    - Protocol routes and Protobuf payloads are deferred until semantic, persistence, migration, repository, adapter, and runtime behavior gates are stable.
  failure_paths_and_redaction:
    - Future checks must reject forbidden secret, digest, transport, payment, Nakama, or Pitaya compatibility columns.
    - Future logs and errors must treat private wallet ids, player ids, detailed balances, idempotency keys, and transaction metadata as not log-safe by default.
  concurrency_or_ordering:
    - Future tests must define simultaneous grant, spend, idempotency, insufficient balance, and suspended/closed wallet conflict behavior before runtime implementation.
  integration_or_e2e:
    - Local alpha E2E proof is deferred until route and runtime implementation slices are authorized.
  repository_checks:
    - node tools/vibit check change define-currency-wallet-persistence-schema-gate --json
    - node tools/vibit inspect rule runtime.currency_wallet_persistence_schema_gate
    - node tools/vibit check runtime --json
    - node tools/vibit check all --json

