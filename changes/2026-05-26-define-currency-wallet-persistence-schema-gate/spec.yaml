user_requirement: "Define a currency wallet persistence schema gate before SQL migration source, repositories, adapters, runtime behavior, protocol routes, generated output, or broader economy features are implemented."
user_visible_outcome: A completed gate standard records future currency wallet table candidates, wallet identity, balance identity, transaction or ledger posture, idempotency uniqueness, catalog deferral, indexes, timestamps, redaction, repository and adapter boundaries, stop conditions, and opens the migration source follow-up.
capability_family: economy_inventory_rewards_currencies_and_progression

capability_mapping:
  family: economy_inventory_rewards_currencies_and_progression
  product_intent: Durable wallet, balance, transaction, and idempotency posture is required for Nakama/Hiro-class economy behavior before runtime grant, spend, read, reward, purchase, or inventory integration behavior can be implemented safely.
  adopted:
    - Currency wallet state is treated as durable player economy state.
    - Wallet identity, balance row identity, transaction facts, idempotency uniqueness, redaction, and future test expectations are explicit before SQL.
  adapted:
    - vibit uses a player-owned wallet plus balance plus transaction table candidate rather than direct external API compatibility.
    - Currency catalog tables, reward integration, purchase behavior, and inventory pricing remain deferred to later bounded gates.
    - The next step is migration source only, not runtime behavior.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - external economy services, payment provider dependencies, rewards, purchases, inventory pricing, reservations, settlement, refunds, transfers, SDKs, hosted surfaces, and broad economy expansion in this gate
  pitaya_status: deferred_future_architecture_reference

