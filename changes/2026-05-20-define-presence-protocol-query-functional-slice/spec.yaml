    - ADR-0087
  referenced:
    - ADR-0086
    - ADR-0085
    - ADR-0084
    - ADR-0082
    - ADR-0078
    - ADR-0053
    - ADR-0018

contracts:
  commands:
    added: []
    changed: []
    removed: []
  queries:
    added:
      - runtime.presence.GetPlayerPresence
    changed: []
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added:
      - PRESENCE_QUERY_FORBIDDEN
      - PRESENCE_QUERY_UNAVAILABLE
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

protocol:
  routes_added:
    - runtime.presence.GetPlayerPresence
  route_kind: query
  route_protection_posture: request_token_required
  proof_carrier_posture: existing_authenticated_request_wrapper
  protobuf_sources_changed:
    - proto/vibit/presence/v1/presence.proto
  generated_outputs_changed:
    - runtime/internal/generated/proto/vibit/presence/v1/presence.pb.go
  existing_envelope_changed: false
  presence_subscription_added: false
  presence_broadcast_added: false
  room_presence_added: false
  party_presence_added: false
  match_presence_added: false

data:
  migrations_required: false
  migration_sources: []
  durable_presence_store_added: false
  ownership_changes:
    - Application-owned presence query handler reads the existing active connection registry snapshot.
    - Protobuf protocol adapter owns wire/domain payload mapping for the presence query.
    - PostgreSQL startup composition registers the query route where the presence lifecycle registry exists.
    - WebSocket transport remains credential-neutral and does not own presence semantics.

