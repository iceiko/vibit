user_requirement: Implement a clearer source-first local alpha example client path for the existing local alpha gameplay flow.
nakama_capability_family: client_sdks_examples_and_developer_experience

nakama_capability_mapping:
  family: client_sdks_examples_and_developer_experience
  product_intent: Make the existing local alpha backend loop easier for developers and AI agents to understand before broader product expansion.
  adopted:
    - clear example/evaluation path pressure
    - developer experience priority before broader product modules
  adapted:
    - source-first repository-local example instead of public SDK
    - internal runtime proof reuse until public client package boundaries exist
    - redacted shell entrypoint over existing Go E2E proof
  rejected:
    - direct Nakama API compatibility
    - Nakama public route names or client SDK shapes
    - public SDK or generated client package in this slice
  pitaya_status: deferred_future_architecture_reference

acceptance_criteria:
  - `examples/local-alpha-client/README.md` and `examples/local-alpha-client/README.zh-CN.md` describe the source-first local alpha example client path.
  - `examples/local-alpha-example-client.sh` runs the focused local alpha flow proof using existing runtime and protocol tests.
  - `examples/local-alpha-request-loop.sh` remains available as a compatibility wrapper.
  - The example path demonstrates local onboarding, device credential login, connection binding, protected inventory, protected presence, own-player storage object put/get/list/delete, logout, rejected post-logout protected request, and selected failure-path redaction checks.
  - The example path output remains redacted and must not print raw credentials, raw access tokens, digests, verifier keys, DSNs, or transport metadata.
  - The slice opens W-0227 as a next Nakama-first capability selection follow-up.
  - The slice does not add SDKs, generated clients, runtime behavior, protocol routes, Protobuf source, generated output, migrations, dependencies, persistence, startup wiring, hosted surfaces, release artifacts, Pitaya-style distributed architecture, or direct compatibility.

test_plan:
  focused_go_tests:
    - examples/local-alpha-example-client.sh
    - examples/local-alpha-request-loop.sh
    - cd runtime && go test ./internal/platform/protocol/protobuf -run 'TestAuthenticatedGameplayE2EUsesExistingOnboardingLoginBindingInventoryPresenceAndLogout|TestStorageObjectsProtocolRouteLocalAlphaFlow|TestPresenceStatusLocalAlphaFlowReportsOfflineAfterCloseAndInvalidation|TestAuthenticatedGameplayFailurePathsLocalAlphaFlow' -v
  repository_checks:
    - Repository check for W-0226 completion and W-0227 next-ready state.
    - Runtime check for ADR-0134, example docs, example script, reused tests, redaction markers, accepted existing routes, deferrals, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  go_tests:
    - `cd runtime && go test ./...` is optional because this slice does not change Go source, but focused Go E2E proof is required through the example script.

