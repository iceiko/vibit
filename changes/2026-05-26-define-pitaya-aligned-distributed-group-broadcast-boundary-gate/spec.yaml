user_requirement: Continue toward Pitaya by defining future distributed group and broadcast vocabulary while preserving current single-process target-scope metadata and server-push intent boundaries.
nakama_capability_family: distributed_runtime_frontend_backend_rpc_and_service_discovery

reference_mapping:
  primary_product_reference: Nakama
  pitaya_reference_status: distributed_group_broadcast_vocabulary_boundary_defined_for_future_architecture_planning
  adopted:
    - distributed_group vocabulary
    - room_broadcast vocabulary
    - broadcast_target vocabulary
    - group_membership vocabulary
    - broadcast_fanout vocabulary
    - target-scope metadata to deferred broadcast target mapping
    - server-push intent to deferred room broadcast mapping
  adapted:
    - group and broadcast vocabulary only before implementation
    - source-first mapping before fanout or membership state
    - vibit module contracts remain authoritative
  rejected:
    - direct Pitaya API compatibility
    - direct Nakama API compatibility
    - Pitaya or Nakama package, method, group, room, stream, or route naming compatibility
    - distributed group implementation in this slice
    - room broadcast fanout in this slice
    - delivery guarantees, retries, ordering, durable offsets, queueing, or backpressure in this slice
    - stream subscription, group membership, group, party, chat, matchmaking, or match runtime behavior in this slice
    - service discovery, RPC, remote call, frontend/backend role, distributed runtime, or cluster routing behavior in this slice

acceptance_criteria:
  - The gate defines allowed distributed group and broadcast vocabulary.
  - The gate maps current target-scope metadata and server-push intent to future distributed group and broadcast vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0255 as a narrow source-first distributed group and broadcast map work item.
  - The gate does not add distributed group implementation, room broadcast fanout, delivery guarantees, stream subscriptions, service discovery implementation, RPC implementation, remote calls, frontend/backend role implementation, distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

