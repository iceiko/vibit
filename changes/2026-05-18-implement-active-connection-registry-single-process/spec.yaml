schema_version: 0.1
change_id: implement-active-connection-registry-single-process
date: 2026-05-18
type: feature
status: verified

summary: Implement the first application-owned single-process in-memory active connection registry.

affected_modules:
  - runtime
  - authentication

decisions:
  added:
    - ADR-0075
  referenced:
    - ADR-0019
    - ADR-0057
    - ADR-0058
    - ADR-0066
    - ADR-0068
    - ADR-0070
    - ADR-0071
    - ADR-0072
    - ADR-0073
    - ADR-0074

contracts:
  commands:
    added: []
    changed: []
    removed: []
  queries:
    added: []
    changed: []
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added: []
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Active connection registry behavior is application-owned under runtime/internal/app/connection.
    - WebSocket transport remains credential-neutral and does not own authenticated identity state.
    - Authentication remains token lifecycle owner but does not own active connection registry policy.

