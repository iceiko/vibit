user_requirement: Continue toward Pitaya by defining future service discovery vocabulary while preserving current single-process static composition boundaries.
nakama_capability_family: distributed_runtime_frontend_backend_rpc_and_service_discovery

reference_mapping:
  primary_product_reference: Nakama
  pitaya_reference_status: service_discovery_vocabulary_boundary_defined_for_future_architecture_planning
  adopted:
    - service_discovery vocabulary
    - service_registry vocabulary
    - service_instance vocabulary
    - service_selector vocabulary
    - static startup composition to deferred discovery mapping
    - route and module handler mapping to future discoverable backend ownership
  adapted:
    - service discovery vocabulary only before implementation
    - source-first mapping before runtime topology
    - vibit module contracts remain authoritative
  rejected:
    - direct Pitaya API compatibility
    - Pitaya package, method, registry, or route naming compatibility
    - service discovery implementation in this slice
    - service registry or selector behavior in this slice
    - node identity, heartbeat, membership, or topology behavior in this slice
    - server-to-server RPC or remote call behavior in this slice
    - distributed runtime implementation in this slice

acceptance_criteria:
  - The gate defines allowed service discovery vocabulary.
  - The gate maps current static single-process vibit composition to future service discovery vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0253 as a narrow source-first service discovery map work item.
  - The gate does not add service discovery implementation, registries, selectors, node identity, RPC implementation, remote calls, frontend/backend role implementation, distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

test_plan:
  repository_checks:
