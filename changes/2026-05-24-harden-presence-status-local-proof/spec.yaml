user_requirement: Prove self-presence/status through the authenticated local alpha flow, including online after connection binding and offline after close or invalidation.
nakama_capability_family: presence_status_and_notifications

nakama_capability_mapping:
  family: presence_status_and_notifications
  product_intent: Presence/status lets developers observe whether a player is online through server-owned connection state before broader realtime, social, or multiplayer features depend on it.
  hardened_foundation:
    - runtime/internal/app/presence/presence_test.go
    - runtime/internal/platform/protocol/protobuf/authenticated_gameplay_e2e_test.go
  reused_surfaces:
    - runtime/internal/app/presence/presence.go
    - runtime/internal/app/connection/registry.go
    - runtime/internal/app/connection/close_policy.go
    - proto/vibit/presence/v1/presence.proto
    - runtime/internal/platform/protocol/protobuf/presence_bridge.go
  deferred:
    - presence subscriptions
    - status broadcast fanout
    - friends/groups/parties
    - chat
    - matchmaking
    - match runtime
    - durable or distributed presence
    - direct Nakama/Pitaya API compatibility

acceptance_criteria:
  - The application presence service proves online self-presence from an active bound connection.
  - The application presence service proves offline self-presence after transport close.
  - The application presence service proves offline self-presence after policy invalidation.
  - The authenticated local alpha Protobuf request flow proves online, close/offline, and invalidation/offline behavior through existing route and wire surfaces.
  - The slice does not add new protocol routes, Protobuf messages, generated output, migrations, dependencies, persistence, startup wiring, subscriptions, broadcast fanout, broad social/multiplayer modules, distributed runtime, or direct compatibility.

test_plan:
  focused_go_tests:
    - go test ./internal/app/presence ./internal/platform/protocol/protobuf
    - go test ./...
  repository_checks:
    - Repository check for W-0222 completion and W-0223 next-ready state.
    - Runtime check for ADR-0130, change artifacts, hardened test names, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.

