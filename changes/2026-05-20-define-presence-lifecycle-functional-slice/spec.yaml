  direct_nakama_pitaya_api_compatibility_added: false
  boundary:
    allowed:
      - Derive online/offline player presence from active bound registry records.
      - Notify a credential-neutral transport lifecycle observer when WebSocket connections open and close.
      - Wire PostgreSQL startup composition so transport lifecycle and successful first-message binding update the registry.
      - Keep presence single-process and non-durable in this first slice.
    forbidden:
      - Add Protobuf presence messages, generated output, protocol routes, subscriptions, broadcasts, chat, friends, groups, parties, matchmaking, match runtime, operations/admin behavior, reconnect/resume tokens, logout-triggered socket close, runtime session revocation, durable/distributed presence, dependencies, or direct Nakama/Pitaya API compatibility.

