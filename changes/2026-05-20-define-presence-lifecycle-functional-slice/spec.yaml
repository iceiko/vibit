  ownership_changes:
    - Active connection registry owns server-observed single-process presence snapshot state.
    - WebSocket transport owns credential-neutral connection lifecycle observation.
    - Process startup composes transport lifecycle and connection binding into the registry.
    - Authentication service remains token lifecycle service logic and does not own presence.

