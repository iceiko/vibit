user_requirement: "Add the currency wallet migration source after the persistence schema gate while preserving runtime, protocol, generated, repository, adapter, dependency, hosted, SDK, distributed, and direct compatibility deferrals."
user_visible_outcome: A completed migration-source-only slice adds the currency wallet SQL migration source and opens the repository boundary follow-up.
capability_family: economy_inventory_rewards_currencies_and_progression

capability_mapping:
  family: economy_inventory_rewards_currencies_and_progression
  product_intent: Durable wallet, balance, transaction, and idempotency SQL source is required for Nakama/Hiro-class economy behavior before runtime grant, spend, read, reward, purchase, or inventory integration behavior can be implemented safely.
  adopted:
    - PostgreSQL is the first durable currency wallet store.
    - Wallet, balance, and transaction table source exists before repository and adapter work.
    - Transaction rows own durable idempotency uniqueness for future grant/spend behavior.
  adapted:
    - vibit records local schema source without direct external API compatibility.
    - Currency catalog, reward integration, purchase behavior, and inventory pricing remain deferred.
    - The next step is repository boundary definition, not repository implementation.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - external economy services, payment provider dependencies, rewards, purchases, inventory pricing, reservations, settlement, refunds, transfers, SDKs, hosted surfaces, and broad economy expansion in this slice
  pitaya_status: deferred_future_architecture_reference

