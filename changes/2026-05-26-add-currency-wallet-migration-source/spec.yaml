schema:
  selected_store: postgres
  migration_source: runtime/migrations/postgres/000008_create_currency_wallets.sql
  logical_tables:
    - currency_wallets
    - currency_wallet_balances
    - currency_wallet_transactions
  deferred_tables:
    - currency_catalog
    - currency_wallet_events
  wallet_table:
    logical_table: currency_wallets
    primary_key:
      - wallet_id
    logical_owner_identity:
      - owner_kind
      - owner_id
    owner_kind_first_value: player
    owner_player_fk: player_accounts(player_id)
    allowed_lifecycle_states:
      - active
      - suspended
      - closed
  balance_table:
    logical_table: currency_wallet_balances
    primary_key:
      - wallet_id
      - currency_code
    amount_type: BIGINT
    negative_balance_allowed_by_default: false
  transaction_table:
    logical_table: currency_wallet_transactions
    primary_key:
      - transaction_id
    transaction_kinds:
      - grant
      - spend
    idempotency_unique_identity:
      - wallet_id
      - idempotency_scope
      - idempotency_key

