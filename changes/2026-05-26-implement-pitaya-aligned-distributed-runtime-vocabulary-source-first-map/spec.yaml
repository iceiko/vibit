acceptance_criteria:
  - The repository exposes `node tools/vibit inspect pitaya-vocabulary --json`.
  - The inspection output includes allowed vocabulary, current single-process mapping, source surfaces, deferrals, and redaction flags.
  - Repository checks verify the W-0247 map and W-0248 next-ready state.
  - The slice does not add distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

test_plan:
