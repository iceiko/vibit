user_requirement: Define the minimum source-first operations inspection surface needed for prototype authors to understand and troubleshoot local alpha server state before broader capability expansion.
nakama_capability_family: admin_console_metrics_observability_and_operations

nakama_capability_mapping:
  family: admin_console_metrics_observability_and_operations
  product_intent: Nakama-class frameworks become practical when operators and developers can inspect server health, version, configuration posture, active state, and runtime behavior without guessing from logs alone. vibit needs an agent-native, source-first gate for that minimum operations inspection posture before broadening into more social, realtime, competitive, or match runtime features.
  existing_foundation:
    - /healthz
    - /readyz
    - /version
    - /configz
    - docs/runtime-runbook.md
    - docs/alpha-developer-flow.md
    - examples/local-alpha-example-client.sh
    - examples/local-alpha-request-loop.sh
    - runtime/cmd/vibit-server
    - tools/vibit
  deferred:
    - admin console implementation
    - metrics endpoint implementation
    - observability pipeline implementation
    - live operations dashboard
    - player/session/token/friends inspection endpoints
    - WebSocket inspection routes
    - hosted operations surface
    - SDK publication
    - generated client libraries
    - chat
    - groups
    - parties
    - matchmaking
    - match runtime
    - distributed runtime
    - direct Nakama/Pitaya API compatibility

decision_rationale:
  selected:
    direction: define_minimum_operations_inspection_surface_gate
    reason: The local alpha now proves authenticated gameplay, storage, realtime outbound delivery, example-client flow, feature-request scaffolding, and friends relationship routes. Before adding more product breadth, prototype authors need a bounded operations inspection posture that explains what state can be inspected, what must remain redacted, and which surfaces are source-first versus future hosted/admin work.
  deferred_candidates:
    define_groups_relationship_lifecycle_gate: Product-useful after friends, but it expands social scope before the operations inspection posture is defined.
    define_parties_lifecycle_gate: Useful realtime-social scope, but should wait until inspection expectations for sessions, connections, and routes are clearer.
    define_chat_streams_gate: Useful, but stream and message visibility create redaction and observability questions that should be gated first.
    define_leaderboards_or_tournaments_gate: Product-class capability, but less urgent than understanding the current prototype state.
    define_matchmaking_gate: Important Nakama-class capability, but it depends on clearer operational visibility for sessions, connections, and queues.
    define_authoritative_match_runtime_gate: Too broad before minimum operations inspection and additional realtime policy gates.
    publish_sdk_or_generated_client_library: Premature while the source-first alpha is still changing quickly.
    reactivate_pitaya_distributed_architecture_review: Explicitly deferred by the Nakama-first direction.

