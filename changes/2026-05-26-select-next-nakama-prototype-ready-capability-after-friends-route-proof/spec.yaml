acceptance_criteria:
  - The selected next capability family is `admin_console_metrics_observability_and_operations`.
  - The selected next direction is `define_minimum_operations_inspection_surface_gate`.
  - The selection records why minimum operations inspection should precede groups, parties, chat, leaderboards, matchmaking, match runtime, SDK publication, or distributed runtime.
  - The selection opens W-0244 as a bounded gate before implementation.
  - The selection does not add runtime behavior, operations/admin endpoints, protocol routes, Protobuf source, generated output, migrations, dependencies, persistence, startup wiring, SDKs, hosted deployments, release artifacts, broad product modules, Pitaya-style distributed architecture, or direct compatibility.

test_plan:
  selection_slice:
    - Repository check for W-0243 completion and W-0244 next-ready state.
    - Runtime check for ADR-0151, change artifacts, Nakama capability mapping, selected follow-up direction, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  follow_up_w_0244:
    - Define accepted operations inspection surfaces before implementation.
    - Define redaction tests for raw credentials, access tokens, keys, digests, DSNs, player/session/token identifiers, transport metadata, and configuration values.
    - Define whether future implementation tests run as focused Go tests, scripts, repository checks, or documentation checks.
    - Preserve no new protocol route, Protobuf, generated output, dependency, hosted admin console, SDK publication, or direct compatibility scope unless a later bounded item authorizes it.

