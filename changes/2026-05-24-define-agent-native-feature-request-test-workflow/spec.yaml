user_requirement: Continue toward the Nakama target by defining the AI-native feature request and test workflow.
nakama_capability_family: agent_native_requirement_test_implementation_workflow

workflow_phases:
  - user_requirement
  - requirement_spec
  - nakama_capability_mapping
  - acceptance_criteria
  - test_plan
  - tests
  - implementation_boundaries
  - verification
  - durable_memory

required_artifacts:
  - request.md
  - spec.yaml
  - impact.md
  - plan.md
  - checklist.md
  - verification.md

required_spec_fields:
  - user_requirement
  - nakama_capability_family
  - acceptance_criteria
  - test_plan
  - implementation_boundaries
  - verification
  - memory_updates

acceptance_criteria:
  - The workflow standard is created in English and Simplified Chinese.
  - ADR-0128 records the decision.
  - Change records capture the request, impact, plan, checklist, and verification.
  - Manifests and guides record W-0220 completion and W-0221 next-ready state.
  - Repository checks register and enforce runtime.agent_native_feature_request_test_workflow.
  - The standard requires Nakama capability mapping for major features and keeps Pitaya deferred.
  - The standard requires tests for non-trivial behavior or explicit not-applicable rationale.

test_plan:
  - Repository check for the workflow standard and required markers.
  - Change check for this change spec directory.
  - Work queue check for W-0220 completed and W-0221 next-ready.
  - Runtime check for manifest, docs, ADR, rule catalog, and deferral markers.
  - Memory/schema/all checks for repository-wide consistency.

implementation_boundaries:
  allowed:
    - docs/agent-native-feature-request-test-workflow.md
    - docs/agent-native-feature-request-test-workflow.zh-CN.md
