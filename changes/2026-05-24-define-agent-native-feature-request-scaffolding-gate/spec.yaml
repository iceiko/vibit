user_requirement: Make the AI-native path from user requirement to spec, acceptance criteria, tests, implementation boundaries, verification, and durable memory scaffoldable before broadening Nakama-style modules.
nakama_capability_family: agent_native_requirement_test_implementation_workflow

nakama_capability_mapping:
  family: agent_native_requirement_test_implementation_workflow
  product_intent: Nakama-class frameworks are useful because they cover common game backend services. vibit's differentiator is that these services should be added through an AI-native requirement-to-test-to-implementation workflow that users and agents can run repeatably.
  adopted:
    - Nakama remains the primary product capability reference.
    - Every future major feature should start from bounded request, acceptance criteria, and test plan artifacts.
    - Developer-facing feature intake and verification should become executable through source-first scaffolding.
  adapted:
    - The first scaffold posture is vibit-native change artifact scaffolding, not a Nakama API, SDK, or hosted surface.
    - Pitaya remains a future distributed architecture reference and is not used to shape this near-term scaffold.
  rejected:
    - direct Nakama API compatibility
    - direct Pitaya API compatibility
    - runtime, protocol, generated, migration, dependency, SDK, hosted, or distributed architecture scope in this gate
  pitaya_status: deferred_future_architecture_reference

workflow_phases:
  user_requirement:
    recorded: true
    artifact: request.md
  requirement_spec:
    recorded: true
    artifact: spec.yaml
  nakama_capability_mapping:
    recorded: true
    family: agent_native_requirement_test_implementation_workflow
  acceptance_criteria:
    recorded: true
  test_plan:
    recorded: true
  tests:
    gate_slice_tests_applicable: false
    rationale: This slice defines the future scaffolding gate only. W-0229 will define or add focused tests/checks for scaffold output or template shape.
  implementation_boundaries:
    recorded: true
  verification_phase:
    recorded: true
  durable_memory:
    recorded: true

acceptance_criteria:
  - The gate records `source_first_change_artifact_scaffolding` as the future scaffolding posture.
  - The gate records `tools/vibit scaffold feature` as a future command candidate.
  - The gate records `changes/_template/feature-request/` as a future template directory candidate.
  - The gate requires future scaffold artifacts: `request.md`, `spec.yaml`, `impact.md`, `plan.md`, `checklist.md`, and `verification.md`.
  - The gate opens W-0229 as a bounded implementation follow-up.
  - The gate preserves Nakama as the primary product reference and Pitaya as deferred.
  - The gate does not implement scaffolding, add templates, add scaffold commands, add runtime behavior, add protocol routes, add Protobuf source, add generated output, add migrations, add dependencies, add hosted surfaces, publish SDKs, add distributed architecture, or add direct compatibility.

test_plan:
  gate_slice:
    - Repository check for W-0228 completion and W-0229 next-ready state.
    - Runtime check for ADR-0136, gate docs, change artifacts, Nakama capability mapping, required scaffold artifacts, future command/template candidates, redaction markers, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  follow_up_w_0229:
    - Add `changes/_template/feature-request/` only if the implementation remains source-first.
    - Add a narrow `tools/vibit scaffold feature` command only if it creates text artifacts and does not bypass the change-spec workflow.
    - Add focused checks or tests for template/scaffold output shape.
    - Preserve no runtime behavior, protocol route, Protobuf source, generated output, migration, dependency, hosted demo, SDK publication, distributed runtime, or direct compatibility scope.

