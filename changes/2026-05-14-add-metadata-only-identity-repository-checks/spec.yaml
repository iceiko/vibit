schema_version: 0.1
change_id: add-metadata-only-identity-repository-checks
date: 2026-05-14
type: feature
status: verified

summary: Add repository checks that protect the current metadata-only player/session boundary from transport, domain, authentication, token, credential, generated Protobuf, and premature player implementation regressions.

affected_modules:
  - runtime
  - player
  - inventory

decisions:
  added: []
  referenced:
    - ADR-0018
    - ADR-0021

standards:
  added: []
  changed:
    - docs/player-identity-session-boundary.md
    - docs/player-identity-session-boundary.zh-CN.md
    - .arch/runtime.yaml
    - rules/check-rules.json

contracts:
  commands:
    added: []
    changed: []
    removed: []
  queries:
    added: []
    changed: []
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added: []
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

runtime:
  checks:
    added:
      - runtime.identity_boundary
    changed:
      - node tools/vibit check runtime
  authentication_implemented: false
  token_parsing_implemented: false
  credential_lookup_implemented: false
  session_persistence_implemented: false
  player_account_lookup_implemented: false

data:
  migrations_required: false
  ownership_changes: []

compatibility:
  breaking_api: false
  breaking_events: false
  breaking_data: false
  protocol_envelope_changed: false
  websocket_handshake_changed: false

verification:
  required:
    - node -c tools/vibit
    - node -e "JSON.parse(require('fs').readFileSync('rules/check-rules.json','utf8'))"
    - node tools/vibit inspect rule runtime.identity_boundary
    - node tools/vibit check runtime --json
    - node tools/vibit check schemas --json
    - node tools/vibit check work --json
    - node tools/vibit check change add-metadata-only-identity-repository-checks --json
    - node tools/vibit check all --json
    - git diff --check
  status: Verified
