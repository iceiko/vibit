  actor_identity_source: validated_request_identity
  metadata_only_player_id_allowed_as_proof: false
  metadata_only_session_id_allowed_as_proof: false
  future_grant_permission_model: service_authoritative_deferred

lifecycle_invariants:
  - currency_codes_validated_by_future_catalog_before_mutation
  - grant_and_spend_amounts_must_be_positive
  - balance_reads_do_not_require_mutation_authority
  - negative_balance_forbidden_by_default
  - mutation_idempotency_required
  - mutations_transactional
  - durable_transaction_or_ledger_fact_required_before_behavior
  - grants_service_authoritative_not_client_authoritative
  - public_failures_collapse_private_wallet_balance_catalog_or_transaction_details_where_privacy_requires
  - wallet_player_transaction_balance_idempotency_and_ledger_details_not_log_safe_by_default

acceptance_criteria:
  - The gate defines future currency catalog read, wallet read, balance read, grant, spend, balance change recording, and transaction read semantics.
  - The gate records future command, query, event, error, permission, wallet lifecycle state, invariant, idempotency, redaction, and test vocabulary.
  - The gate requires validated player identity for player-owned wallet reads and player-initiated spends and rejects metadata-only `player_id` or `session_id` as proof.
  - The gate maps the capability to Nakama/Hiro economy capability coverage while keeping Pitaya deferred.
  - The gate opens W-0293 as `Define currency wallet persistence schema gate`.
  - The gate adds no runtime behavior, balance table, wallet transaction behavior, reward integration, protocol route, Protobuf source, generated output, migration, repository interface, PostgreSQL adapter, dependency, startup wiring, hosted surface, distributed runtime, or direct compatibility scope.

test_plan:
  positive_behavior:
    - Future tests must cover granting currency through a service-authoritative path.
    - Future tests must cover spending currency for a validated player wallet.
    - Future tests must cover reading a player-owned wallet.
    - Future tests must cover listing player-owned currency balances.
    - Future tests must cover reading a currency transaction by permitted owner.
    - Future tests must cover idempotency that rejects duplicate mutation application.
  negative_behavior:
    - Future tests must cover invalid currency code.
    - Future tests must cover zero or negative mutation amount.
    - Future tests must cover insufficient balance.
    - Future tests must cover missing wallet.
    - Future tests must cover suspended or closed wallet transition.
    - Future tests must cover duplicate transaction with conflicting payload.
    - Future tests must cover metadata-only identity.
  permission_and_authentication:
    - Future tests must require validated player identity for player-owned reads and spends.
    - Future tests must reject client-supplied actor id as proof.
    - Future tests must reject metadata-only `player_id` and `session_id` as proof.
    - Future tests must reject client-authoritative grants before mutation.
  persistence_and_transactions:
    - Future schema and repository tests must be defined after W-0293 and before migration, adapter, or runtime implementation.
    - Future mutation transitions must be transactional.
    - Future balance changes and transaction records must stay consistent inside the unit-of-work boundary.
    - Future duplicate idempotency keys must not double-apply mutations.
  failure_and_redaction:
    - Future public errors must not leak private wallet, balance, catalog, or transaction details where privacy requires collapse.
    - Future logs must not expose raw credentials, tokens, verifier keys, digests, transport metadata, wallet ids, player ids, detailed balances, idempotency keys, or ledger internals.

