user_requirement: "Define a currency wallet lifecycle gate for vibit so future currency catalog, wallet read, balance read, grant, spend, balance change recording, and transaction read behavior can be specified before runtime behavior, protocol routes, persistence, generated output, or broader economy features are implemented."
user_visible_outcome: A completed gate standard records future currency wallet lifecycle semantics, acceptance criteria, tests, identity rules, invariants, redaction, deferrals, and opens the persistence schema gate before implementation.
capability_family: economy_inventory_rewards_currencies_and_progression

capability_mapping:
  family: economy_inventory_rewards_currencies_and_progression
  product_intent: Currency wallets are a core economy primitive in Nakama-class and Hiro-class backends and should precede richer economy surfaces such as rewards, purchases, inventory pricing, progression, and live operations.
  adopted:
    - Currency catalog reads, wallet reads, balance reads, grants, spends, balance change recording, and transaction reads are treated as first-class future economy semantics.
    - Server-authoritative balance mutations, validated player identity, idempotency, explicit errors, events, permissions, redaction, and tests must be defined before behavior is implemented.
  adapted:
    - vibit uses its own contract-first lifecycle vocabulary rather than direct external API compatibility.
    - Grants are service-authoritative; player-initiated spends and reads require validated player identity.
    - The next step is a persistence schema gate, not runtime behavior.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - reward integration, inventory integration, purchase behavior, transfers, reservations, settlement, SDKs, hosted surfaces, distributed runtime, and broad economy expansion in this gate
  pitaya_status: deferred_future_architecture_reference

