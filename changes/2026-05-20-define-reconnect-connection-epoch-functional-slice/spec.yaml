schema_version: 0.1
change_id: define-reconnect-connection-epoch-functional-slice
date: 2026-05-20
type: feature
status: verified

summary: Implement the first bounded server-observed connection epoch progression behavior inside the application connection registry.

affected_modules:
  - runtime
  - reference

decisions:
  added:
    - ADR-0083
  referenced:
    - ADR-0082
    - ADR-0081
    - ADR-0080
    - ADR-0078

contracts:
  commands:
    added: []
    changed:
      - runtime connection registry RegisterOpenConnection rejects stale epochs and supersedes earlier active epochs for the same server-owned connection id.
    removed: []
  queries:
    added: []
    changed:
      - runtime connection registry FindConnectionByID can inspect superseded lifecycle records.
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added:
      - connection_epoch_stale
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

protocol:
  protobuf_sources_changed: []
  generated_outputs_changed: []
  existing_envelope_changed: false
  protocol_session_carrier_added: false
  reconnect_token_added: false
  resume_route_added: false

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Application-owned connection registry owns server-observed connection epoch progression.
    - WebSocket transport remains owner only of accepted socket metadata and concrete close handoff.
    - Authentication remains token lifecycle owner and does not own reconnect or epoch policy.

runtime:
  completed_work_item: W-0175
  completed_milestone: M-103
  next_milestone: M-104
  next_work_item: W-0176
  tier: tier_2_functional
  gate_density_strategy: ADR-0082
  reconnect_connection_epoch_functional_slice_completed: true
  reconnect_connection_epoch_functional_slice_decision: ADR-0083
  reconnect_connection_epoch_functional_slice_check_rule: runtime.reconnect_connection_epoch_functional_slice
  application_registry_owner: runtime/internal/app/connection
  changed_source: runtime/internal/app/connection/registry.go
  changed_tests: runtime/internal/app/connection/registry_test.go
  first_epoch_behavior: server_observed_newer_epoch_supersedes_earlier_active_epoch
  stale_epoch_rejection_added: true
  stale_epoch_error_code: connection_epoch_stale
  superseded_state_added: true
  superseded_record_fields:
    - superseded_at
    - superseded_by_epoch
  server_observed_target_required: true
  client_metadata_authority_allowed: false
  durable_reconnect_resume_added: false
  duplicate_replacement_close_added: false
  close_code_mapping_added: false
  close_reason_text_added: false
  logout_triggered_socket_close_added: false
  runtime_session_revocation_added: false
  protocol_session_carrier_added: false
  presence_lifecycle_added: false
  operations_admin_disconnect_added: false
  dependencies_added: false
  direct_nakama_pitaya_api_compatibility_added: false
  boundary:
    allowed:
      - Add application registry state for superseded connection epochs.
      - Reject stale or repeated epochs after a newer epoch is observed for the same connection id.
      - Keep lifecycle inspection of superseded records through FindConnectionByID.
      - Keep active player/session/token listings restricted to active bound records.
    forbidden:
      - Add reconnect tokens, resume tokens, or durable/distributed resume behavior.
      - Change Protobuf envelope or add protocol session carriers.
      - Make logout close sockets or revoke runtime sessions.
      - Select WebSocket close codes or reason text.
      - Add presence, operations/admin disconnect, dependencies, or direct Nakama/Pitaya API compatibility.

compatibility:
  breaking_api: false
  breaking_events: false
  breaking_data: false
  protobuf_envelope_changed: false
  protobuf_messages_added: false
  dependencies_added: false
  direct_nakama_pitaya_api_compatibility_added: false

verification:
  required:
    - cd runtime && go test ./internal/app/connection
    - cd runtime && go test ./...
    - node -c tools/vibit
    - node tools/vibit check change define-reconnect-connection-epoch-functional-slice --json
    - node tools/vibit inspect next
    - node tools/vibit check work --json
    - node tools/vibit check runtime --json
    - node tools/vibit check memory --json
    - node tools/vibit check schemas --json
    - node tools/vibit check all --json
    - git diff --check
  status: Verified
