acceptance_criteria:
  - The gate defines allowed server-to-server RPC and remote-call vocabulary.
  - The gate maps current single-process vibit concepts to future RPC vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0251 as a narrow source-first RPC map work item.
  - The gate does not add RPC implementation, remote calls, service discovery, frontend/backend role implementation, distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

