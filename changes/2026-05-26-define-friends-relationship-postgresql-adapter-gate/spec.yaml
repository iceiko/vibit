user_requirement: "Define the friends relationship PostgreSQL adapter gate after the storage-neutral friends repository interface, preserving Nakama-first planning and deferring adapter implementation, runtime, protocol, generated, event/audit, and direct compatibility scope."
user_visible_outcome: Future agents can inspect a PostgreSQL adapter gate, ADR, change spec, and checks before implementing the friends relationship adapter.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Friends relationship PostgreSQL adapter behavior is a prerequisite for durable Nakama-class social graph behavior before runtime request, accept, reject, remove, block, unblock, list, or status behavior can be implemented safely.
  adopted:
    - Friends relationships are durable social graph state.
    - Friend request, accept, reject, remove, block, unblock, and list behavior require a platform persistence adapter below module-owned repository vocabulary.
    - Private social graph data requires explicit redaction posture.
  adapted:
    - vibit defines the PostgreSQL adapter gate before implementation.
    - SQL mapping stays in the platform persistence package and returns friends module value types and errors.
    - The protocol and schema remain vibit-native and do not copy external APIs.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - adapter implementation, protocol, runtime, group, party, chat, matchmaking, match runtime, SDK, hosted, distributed runtime, or event/audit table scope in this slice
  pitaya_status: deferred_future_architecture_reference

verification:
  status: Verified
  required:
    - node -c tools/vibit
    - node tools/vibit inspect next --json
    - node tools/vibit inspect rule runtime.friends_relationship_postgresql_adapter_gate
    - node tools/vibit check change define-friends-relationship-postgresql-adapter-gate --json
    - node tools/vibit check module friends --json
    - node tools/vibit check work --json
    - node tools/vibit check runtime --json
    - node tools/vibit check memory --json
    - node tools/vibit check schemas --json
    - node tools/vibit check contracts --json
    - node tools/vibit check protocol --json
    - node tools/vibit check all --json
    - cd runtime && go test ./...
    - git diff --check
  live_postgresql_required: false
  notes:
    - No live PostgreSQL verification is required because this gate adds no adapter or SQL execution behavior.

