schema_version: 0.1
change_id: define-active-connection-registry-gate
date: 2026-05-18
type: standard
status: verified

summary: Define the gate-only boundary for future active WebSocket connection registry behavior.

affected_modules:
  - runtime
  - authentication

decisions:
  added:
    - ADR-0074
  referenced:
    - ADR-0019
    - ADR-0056
    - ADR-0057
    - ADR-0058
    - ADR-0069
    - ADR-0070
    - ADR-0071
    - ADR-0072
    - ADR-0073

contracts:
  commands:
    added: []
    changed: []
    removed: []
  queries:
    added: []
    changed: []
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added: []
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Future active connection registry behavior is application-owned under runtime/internal/app/connection.
    - WebSocket transport remains a lifecycle handoff owner only and does not own authentication state.
    - Authentication remains token lifecycle behavior and does not own active connection invalidation.

compatibility:
  breaking_api: false
  breaking_events: false
  breaking_data: false
  protobuf_envelope_changed: false
  protobuf_logout_route_added: false
