user_requirement: Implement source-first feature request scaffolding so AI agents can turn user backend requirements into bounded specs, acceptance criteria, test plans, implementation boundaries, verification records, and durable memory before coding.
user_visible_outcome: Agents can scaffold a feature-request change directory from a user requirement before coding.
nakama_capability_family: agent_native_requirement_test_implementation_workflow

nakama_capability_mapping:
  family: agent_native_requirement_test_implementation_workflow
  product_intent: Nakama-class capability growth should begin from bounded user requirements, acceptance criteria, tests, implementation boundaries, verification, and durable memory rather than ad hoc coding.
  adopted:
    - Nakama remains the primary product capability reference.
    - Future major features should begin with source-first scaffolded change artifacts.
    - Acceptance criteria and test planning are required before implementation.
  adapted:
    - The scaffold is vibit-native repository tooling, not a Nakama API, SDK, route, or hosted surface.
    - The first command only creates text change artifacts and refuses to overwrite existing directories.
  rejected:
    - direct Nakama API compatibility
    - direct Pitaya API compatibility
    - runtime, protocol, generated, migration, dependency, SDK, hosted, or distributed architecture scope in this implementation
  pitaya_status: deferred_future_architecture_reference

acceptance_criteria:
  - `changes/_template/feature-request/` contains `request.md`, `spec.yaml`, `impact.md`, `plan.md`, `checklist.md`, and `verification.md`.
  - `tools/vibit scaffold feature <change-id> --request <text>` creates the six required artifacts under `changes/YYYY-MM-DD-<change-id>/`.
  - The command supports `--summary`, `--date`, and `--dry-run`.
  - The command refuses to overwrite an existing change directory.
  - Template and scaffold content include Nakama mapping, Pitaya deferral, acceptance criteria, test plan, implementation boundaries, redaction, verification, and durable memory prompts.
  - The repository check rule validates the implementation shape.
  - No runtime behavior, protocol route, Protobuf source, generated output, migration, dependency, SDK, hosted, distributed runtime, or direct compatibility scope is added.

test_plan:
  tooling:
    - `node -c tools/vibit`
    - `node tools/vibit scaffold feature scaffold-smoke --date 2026-05-24 --request "Smoke test feature request scaffold." --summary "Smoke test feature request scaffold." --dry-run`
    - `node tools/vibit scaffold feature implement-agent-native-feature-request-scaffolding --date 2026-05-24 --request "<request>" --summary "Implement source-first feature request scaffolding."`
  repository_checks:
    - `node tools/vibit inspect rule runtime.agent_native_feature_request_scaffolding_implementation`
    - `node tools/vibit check change implement-agent-native-feature-request-scaffolding --json`
    - `node tools/vibit check work --json`
    - `node tools/vibit check runtime --json`
    - `node tools/vibit check memory --json`
    - `node tools/vibit check schemas --json`
    - `node tools/vibit check all --json`
    - `git diff --check`
  not_applicable:
    - Go runtime behavior tests are not required because this slice changes no Go runtime source.
    - Protocol/generated/migration checks remain covered by repository checks; this slice adds no protocol source, generated output, or migrations.

