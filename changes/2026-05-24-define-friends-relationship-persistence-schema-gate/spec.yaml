user_requirement: "Define a Nakama-first friends relationship persistence schema gate before SQL migration source, repositories, adapters, runtime behavior, protocol routes, generated output, or broader social features are implemented."
user_visible_outcome: A completed gate standard records future friends relationship table candidates, pair identity, lifecycle state, block representation, indexes, uniqueness, timestamps, event/audit posture, redaction, repository and adapter boundaries, stop conditions, and opens the migration source follow-up.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: A durable friends relationship schema is required for Nakama-class social graph behavior before runtime request, accept, reject, remove, block, unblock, list, or status behavior can be implemented safely.
  adopted:
    - Friendship relationship state is treated as durable social graph state.
    - Player-pair lookup, relationship state, block posture, uniqueness, redaction, and future test expectations are explicit before SQL.
  adapted:
    - vibit uses a pair-oriented current-state table candidate and actor-relative public status computation rather than direct external API compatibility.
    - Event/audit history remains deferred to a later bounded gate.
    - The next step is migration source only, not runtime behavior.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - graph database, distributed social graph routing, groups, parties, chat, matchmaking, match runtime, SDKs, hosted surfaces, and broad social module expansion in this gate
  pitaya_status: deferred_future_architecture_reference

