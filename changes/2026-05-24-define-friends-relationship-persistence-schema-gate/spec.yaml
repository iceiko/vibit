schema_candidate:
  logical_table: friend_relationships
  primary_key_candidate:
    - relationship_id
  logical_pair_identity:
    - player_low_id
    - player_high_id
  required_columns:
    - relationship_id
    - player_low_id
    - player_high_id
    - lifecycle_state
    - relationship_version
    - created_at
    - updated_at
    - state_changed_at
  nullable_columns:
    - requested_by_player_id
    - responded_by_player_id
    - removed_by_player_id
    - rejected_at
    - removed_at
    - blocked_by_low_at
    - blocked_by_high_at
  canonical_pair_ordering: player_low_id < player_high_id
  self_relationship_allowed: false
  player_fk_candidate: player_accounts(player_id)
  allowed_lifecycle_states:
    - pending
    - friends
    - rejected
    - removed
  actor_relative_public_status_stored: false
  block_representation: per_pair_member_timestamp
  relationship_version_type_candidate: BIGINT
  timestamp_type_candidate: TIMESTAMPTZ
  event_audit_table_added_by_this_gate: false

acceptance_criteria:
  - The gate defines future friends relationship table candidates, pair identity, state representation, block representation, indexes, uniqueness, timestamps, event/audit posture, and redaction expectations before SQL.
  - The gate records future migration source candidate, repository owner, PostgreSQL adapter owner, transaction posture, test expectations, and stop conditions.
  - The gate maps the capability to Nakama `friends_groups_and_parties` while keeping Pitaya deferred.
  - The gate opens W-0233 as `Add friends relationship migration source`.
  - The gate adds no migration source, relationship table, repository interface, adapter implementation, runtime behavior, protocol route, Protobuf source, generated output, dependency, hosted surface, SDK, distributed runtime, or direct compatibility scope.

test_plan:
  positive_behavior:
    - Not applicable in this gate; no runtime behavior is added.
  negative_behavior:
    - Not applicable in this gate; no runtime behavior is added.
  permission_and_authentication:
    - Future behavior must require validated player identity; this gate records persistence posture only.
  persistence_and_transactions:
    - Future migration-source checks must cover table name, required columns, pair ordering, self-target prevention, lifecycle state checks, block columns, version checks, timestamp checks, pair uniqueness, and lookup indexes.
    - Future repository and adapter tests must be defined after migration source and repository/adapter gates.
  protocol_mapping:
    - Protocol routes and Protobuf payloads are deferred until semantic, persistence, migration, repository, adapter, and runtime behavior gates are stable.
  failure_paths_and_redaction:
    - Future checks must reject forbidden secret, digest, transport, chat, group, party, match, Pitaya, or Nakama compatibility columns.
    - Future logs and errors must treat private social graph state as not log-safe by default.
  concurrency_or_ordering:
    - Future tests must define simultaneous request, accept, reject, remove, block, and unblock conflict behavior before runtime implementation.
  integration_or_e2e:
    - Local alpha E2E proof is deferred until route and runtime implementation slices are authorized.
  repository_checks:
    - node tools/vibit check change define-friends-relationship-persistence-schema-gate --json
    - node tools/vibit inspect rule runtime.friends_relationship_persistence_schema_gate
    - node tools/vibit check runtime --json
    - node tools/vibit check all --json

