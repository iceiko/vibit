user_requirement: "Implement the storage-neutral friends relationship repository interface after the friends relationship repository boundary, preserving Nakama-first planning and deferring PostgreSQL adapter, runtime, protocol, generated, event/audit, and direct compatibility scope."
user_visible_outcome: Future agents can inspect a typed friends relationship repository interface, module manifest, and tests before implementing the PostgreSQL adapter gate or runtime friendship behavior.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Friends relationship repository vocabulary is a prerequisite for Nakama-class social graph behavior before runtime request, accept, reject, remove, block, unblock, list, or status behavior can be implemented safely.
  adopted:
    - Friends relationships are durable social graph state.
    - Friend request, accept, reject, remove, block, unblock, list, and status behavior require typed repository vocabulary.
    - Private social graph data requires explicit redaction posture.
  adapted:
    - vibit implements a storage-neutral module repository interface before PostgreSQL adapter behavior.
    - Canonical pair and actor rules are normalized in repository value helpers.
    - The protocol and schema remain vibit-native and do not copy external APIs.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - adapter, protocol, runtime, group, party, chat, matchmaking, match runtime, SDK, hosted, distributed runtime, or event/audit table scope in this slice
  pitaya_status: deferred_future_architecture_reference

