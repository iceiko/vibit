user_requirement: Define a clearer source-first local alpha example client path before implementation.
nakama_capability_family: client_sdks_examples_and_developer_experience

nakama_capability_mapping:
  family: client_sdks_examples_and_developer_experience
  product_intent: Make the existing local alpha backend loop easier for developers and AI agents to understand before broad product expansion.
  adopted:
    - clear example/evaluation path pressure
    - developer experience priority before broader product modules
  adapted:
    - source-first repository-local example instead of public SDK
    - internal runtime proof reuse until public client package boundaries exist
  rejected:
    - direct Nakama API compatibility
    - Nakama public route names or client SDK shapes
  pitaya_status: deferred_future_architecture_reference

acceptance_criteria:
  - The gate defines the allowed source-first example client/app shape.
  - The gate records future file ownership, redaction requirements, accepted existing surfaces, verification commands, and stop conditions.
  - The gate opens W-0226 as a narrow implementation work item.
  - The gate does not implement example files or add SDK, runtime, protocol, generated, migration, dependency, startup, hosted, release, distributed runtime, or direct compatibility scope.

test_plan:
  repository_checks:
    - Repository check for W-0225 completion and W-0226 next-ready state.
    - Runtime check for ADR-0133, gate standard, translation, change artifacts, redaction markers, accepted existing routes, file candidates, deferrals, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  go_tests:
    - Not required for this gate because no runtime or Go behavior changes are added.

