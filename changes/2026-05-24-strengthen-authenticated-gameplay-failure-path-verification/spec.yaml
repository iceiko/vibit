user_requirement: Prove authenticated local alpha gameplay failure paths for protected requests, including missing, malformed, invalid, expired, revoked, and redacted error behavior.
nakama_capability_family: identity_authentication_sessions

nakama_capability_mapping:
  family: identity_authentication_sessions
  product_intent: Protected game-backend routes must reject unauthenticated or unusable proof before broader Nakama-style services depend on authenticated request identity.
  hardened_foundation:
    - runtime/internal/platform/protocol/protobuf/authenticated_gameplay_e2e_test.go
  reused_surfaces:
    - runtime/internal/app/authentication/service.go
    - runtime/internal/app/authentication/route_validator.go
