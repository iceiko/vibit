    - proto/vibit/authentication/v1/authentication.proto
    - proto/vibit/inventory/v1/inventory.proto
    - proto/vibit/presence/v1/presence.proto
  deferred:
    - new authentication routes
    - new Protobuf proof carriers
    - WebSocket handshake authentication changes
    - token refresh
    - cleanup jobs
    - session validation behavior changes
    - chat
    - groups
    - matchmaking
    - match runtime
    - direct Nakama/Pitaya API compatibility

acceptance_criteria:
  - The authenticated local alpha Protobuf request flow rejects a protected inventory request without an authenticated wrapper.
  - The authenticated local alpha Protobuf request flow rejects a protected inventory request with a malformed authenticated wrapper.
  - The authenticated local alpha Protobuf request flow rejects malformed access-token text as malformed proof.
  - The authenticated local alpha Protobuf request flow rejects unknown well-formed access-token text as invalid proof.
  - The authenticated local alpha Protobuf request flow rejects expired access-token records as invalid proof.
  - The authenticated local alpha Protobuf request flow rejects revoked access tokens after logout as invalid proof.
  - The authenticated local alpha Protobuf request flow rejects protected presence without authenticated proof.
  - Error envelopes do not leak raw access-token or one-time device credential material.
  - The slice does not add new protocol routes, Protobuf messages, generated output, migrations, dependencies, persistence, startup wiring, authentication/session behavior changes, token refresh, cleanup jobs, broad product modules, distributed runtime, or direct compatibility.

