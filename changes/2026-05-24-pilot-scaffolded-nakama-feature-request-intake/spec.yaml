user_requirement: "As a game developer building on vibit, I want a future player friendship relationship lifecycle so players can request, accept, reject, remove, and block social relationships through server-authoritative rules before broader groups, parties, chat, matchmaking, or match runtime features depend on social graph state."
user_visible_outcome: A completed scaffolded intake records the friendship lifecycle requirement, acceptance criteria, test plan, boundaries, verification, and durable memory, and opens W-0231 as a gate before implementation.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Friend relationship lifecycle is a core social graph primitive in Nakama-class backends and should precede richer social surfaces such as groups, parties, chat targeting, invites, matchmaking filters, and match social context.
  adopted:
    - Friend relationship lifecycle is treated as a first-class social graph capability.
    - Player identity, permissions, state transitions, events, errors, and redaction must be defined before behavior is implemented.
  adapted:
    - The next step is a vibit-native semantic gate, not a direct Nakama API surface.
    - Protocol routes, Protobuf messages, generated output, repository persistence, and startup wiring remain behind later gated work.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - broad groups, parties, chat, matchmaking, match runtime, or SDK work in this pilot
  pitaya_status: deferred_future_architecture_reference

acceptance_criteria:
  - The scaffolded pilot records a concrete Nakama-style friendship lifecycle request.
  - The pilot maps the request to `friends_groups_and_parties`.
  - The pilot records acceptance criteria and a future test plan before any implementation.
  - The pilot records implementation boundaries and all runtime/protocol/generated/migration/dependency deferrals.
  - The pilot opens W-0231 as `Define friends relationship lifecycle gate`.
  - The pilot adds no runtime behavior, protocol route, Protobuf source, generated output, migration, dependency, SDK, hosted, distributed runtime, or direct compatibility scope.

test_plan:
  pilot_slice:
    - Repository check for W-0230 completion and W-0231 next-ready state.
    - Runtime check for ADR-0138, scaffolded change artifacts, Nakama capability mapping, selected follow-up direction, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  follow_up_w_0231:
    positive_behavior:
      - Define tests for create friend request, accept request, reject request, remove friend, block player, unblock player, list relationships, and read relationship status.
    negative_behavior:
      - Define tests for self-targeting, duplicate requests, invalid state transitions, blocked-player interactions, missing target player, unknown player, and redacted internal failures.
    permission_and_authentication:
      - Define tests that actor ownership comes from validated player identity and metadata-only identity is rejected.
    persistence_and_transactions:
      - Define repository and migration test expectations before any table or adapter work.
    protocol_mapping:
      - Defer routes and Protobuf payloads until semantic contracts are stable.
    failure_paths_and_redaction:
      - Define public error classes that do not leak private relationship, token, credential, transport, or database details.
    concurrency_or_ordering:
      - Define state transition and idempotency expectations before implementation.
    integration_or_e2e:
      - Defer local alpha E2E proof until route and runtime implementation slices are authorized.

