user_requirement: Continue toward Pitaya by defining future distributed runtime vocabulary while preserving current single-process boundaries.
nakama_capability_family: distributed_runtime_frontend_backend_rpc_and_service_discovery

reference_mapping:
  primary_product_reference: Nakama
  pitaya_reference_status: vocabulary_reactivated_for_future_architecture_planning
  adopted:
    - acceptor vocabulary
    - session binding vocabulary
    - route handler vocabulary
    - frontend/backend role vocabulary
    - server-to-server RPC and remote call vocabulary
    - service discovery vocabulary
    - distributed group and broadcast vocabulary
    - cluster-safe session routing vocabulary
  adapted:
    - vocabulary only before implementation
    - source-first mapping before runtime behavior
    - vibit module contracts remain authoritative
  rejected:
    - direct Pitaya API compatibility
    - Pitaya package or route naming compatibility
    - distributed runtime implementation in this slice

acceptance_criteria:
  - The gate defines allowed Pitaya-aligned distributed runtime vocabulary.
  - The gate maps current single-process vibit concepts to future vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0247 as a narrow source-first vocabulary map work item.
  - The gate does not add distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

test_plan:
  repository_checks:
    - Repository check for ADR-0154, gate standard, translation, change artifacts, vocabulary markers, W-0246 completion, W-0247 next-ready state, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  go_tests:
    - Not required for this gate because no runtime or Go behavior changes are added.

