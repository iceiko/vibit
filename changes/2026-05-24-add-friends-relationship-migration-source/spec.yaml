acceptance_criteria:
  - runtime/migrations/postgres/000007_create_friend_relationships.sql exists.
  - The migration declares goose Up and Down markers.
  - The migration creates only friend_relationships.
  - The migration includes canonical pair identity, lifecycle state, block timestamps, relationship version, timestamps, uniqueness, indexes, and checks from ADR-0140.
  - The migration lacks forbidden secret, digest, transport, chat, group, party, match, Pitaya, and Nakama compatibility columns.
  - Static checks enforce the migration shape and deferrals.
  - W-0234 is opened as the next repository-boundary gate.

test_plan:
  - Repository check validates migration existence, required SQL fragments, forbidden columns, forbidden runtime/protocol/generated scopes, and next work item progression.
  - `node tools/vibit check migrations --json` validates SQL migration source hygiene.
  - `node tools/vibit check runtime --json` validates runtime boundaries and Go tests.
  - `node tools/vibit check all --json` validates the full repository rule set.

