schema:
  table: friend_relationships
  primary_key:
    - relationship_id
  required_columns:
    - relationship_id
    - player_low_id
    - player_high_id
    - lifecycle_state
    - relationship_version
    - created_at
    - updated_at
    - state_changed_at
  nullable_columns:
    - requested_by_player_id
    - responded_by_player_id
    - removed_by_player_id
    - rejected_at
    - removed_at
    - blocked_by_low_at
    - blocked_by_high_at
  foreign_keys:
    - player_low_id references player_accounts(player_id)
    - player_high_id references player_accounts(player_id)
    - requested_by_player_id references player_accounts(player_id)
    - responded_by_player_id references player_accounts(player_id)
    - removed_by_player_id references player_accounts(player_id)
  checks:
    - relationship_id is not blank
    - player_low_id is not blank
    - player_high_id is not blank
    - player_low_id < player_high_id
    - lifecycle_state in pending, friends, rejected, removed
    - requested_by_player_id is a pair member when present
    - responded_by_player_id is a pair member when present
    - removed_by_player_id is a pair member when present
    - relationship_version is positive
    - updated_at is not before created_at
    - state_changed_at is not before created_at
    - rejected_at is not before created_at
    - removed_at is not before created_at
    - blocked_by_low_at is not before created_at
    - blocked_by_high_at is not before created_at
  indexes:
    - friend_relationships_pair_uq
    - friend_relationships_player_low_state_idx
    - friend_relationships_player_high_state_idx
    - friend_relationships_updated_at_idx

