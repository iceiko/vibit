user_requirement: "Continue the Nakama-first friends relationship path by adding the migration source only, preserving AI-native spec, test, verification, and durable memory discipline."
user_visible_outcome: A concrete SQL migration source exists for future friends relationship current-state persistence, with static checks and project memory proving the slice stays migration-source-only.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Durable friends relationship current-state persistence is a prerequisite for Nakama-class social graph behavior before runtime request, accept, reject, remove, block, unblock, list, or status behavior can be implemented safely.
  adopted:
    - Friend relationship state is persisted as durable social graph current state.
    - Canonical player-pair identity, relationship lifecycle state, block posture, uniqueness, indexes, and timestamp checks are explicit in SQL source.
  adapted:
    - vibit uses its own pair-oriented PostgreSQL table and future actor-relative public status computation.
    - The migration source does not copy any external public API, route, runtime API, or schema compatibility surface.
    - Event/audit history remains deferred to a later bounded work item.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - repository, adapter, protocol, runtime, group, party, chat, matchmaking, match runtime, SDK, hosted, or distributed runtime scope in this slice
  pitaya_status: deferred_future_architecture_reference

