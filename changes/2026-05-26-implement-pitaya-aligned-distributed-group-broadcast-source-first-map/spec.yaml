acceptance_criteria:
  - The repository exposes `node tools/vibit inspect pitaya-groups --json`.
  - The inspection output includes allowed group and broadcast vocabulary, related vocabulary, current single-process group/broadcast mapping, source surfaces, deferrals, and redaction flags.
  - Repository checks verify the W-0255 map and W-0256 next-ready state.
  - The slice does not add distributed group implementation, group membership registries, room broadcast fanout, delivery guarantees, stream subscriptions, service discovery implementation, RPC implementation, remote calls, frontend/backend role implementation, distributed runtime implementation, cluster-safe session routing behavior, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

