acceptance_criteria:
  - The selected next capability family is `client_sdks_examples_and_developer_experience`.
  - The selected next direction is `define_local_alpha_example_client_path_gate`.
  - The selection records why an example client/app path should precede chat, groups, matchmaking, operations, SDK publication, or distributed runtime.
  - The selection opens W-0225 as a bounded gate before implementation.
  - The selection does not add runtime behavior, protocol routes, Protobuf source, generated output, migrations, dependencies, persistence, startup wiring, SDKs, hosted deployments, release artifacts, broad product modules, Pitaya-style distributed architecture, or direct compatibility.

test_plan:
  selection_slice:
    - Repository check for W-0224 completion and W-0225 next-ready state.
    - Runtime check for ADR-0132, change artifacts, Nakama capability mapping, selected follow-up direction, deferral markers, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  follow_up_w_0225:
    - Define accepted example-client boundaries before implementation.
    - Define redaction tests for raw credentials, access tokens, keys, digests, DSNs, and transport metadata.
    - Define whether future implementation tests run as focused Go tests, scripts, or documentation checks.
    - Preserve no new protocol route, Protobuf, generated output, dependency, hosted demo, SDK publication, or direct compatibility scope.

