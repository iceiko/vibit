user_requirement: Provide a clearer source-first example client or example app path for the existing local alpha gameplay flow without publishing an SDK or changing runtime behavior.
nakama_capability_family: client_sdks_examples_and_developer_experience

nakama_capability_mapping:
  family: client_sdks_examples_and_developer_experience
  product_intent: Nakama-class frameworks are useful because developers can quickly see how a client exercises authentication, sessions, storage, realtime surfaces, and logout. vibit should expose an agent-native, source-first version of that path before adding broader modules.
  existing_foundation:
    - examples/local-alpha-request-loop.sh
    - examples/README.md
    - docs/alpha-developer-flow.md
    - docs/prototype-ready-local-development-path-package.md
    - runtime/internal/platform/protocol/protobuf/authenticated_gameplay_e2e_test.go
    - runtime/internal/platform/transport/ws
    - proto/vibit/protocol/v1/envelope.proto
    - proto/vibit/authentication/v1/authentication.proto
    - proto/vibit/inventory/v1/inventory.proto
    - proto/vibit/presence/v1/presence.proto
    - proto/vibit/storage/v1/storage.proto
    - proto/vibit/realtime/v1/realtime.proto
  deferred:
    - published SDK
    - hosted demo
    - public package or registry artifact
    - new protocol routes
    - generated client libraries
    - broad tutorial app
    - chat
    - friends/groups/parties
    - matchmaking
    - match runtime
    - distributed runtime
    - direct Nakama/Pitaya API compatibility

decision_rationale:
  selected:
    direction: define_local_alpha_example_client_path_gate
    reason: The existing backend loop is stronger than the developer-facing example path. A gate can define a small, redacted, source-first client/app example that demonstrates current capabilities without changing protocol or runtime behavior.
  deferred_candidates:
    define_minimal_operations_inspection_surface: Important before production-candidate work, but current prototype developers first need to see the client-facing path across existing capabilities.
    define_notifications_or_realtime_delivery_flow_proof: Useful, but the realtime outbound foundation should be demonstrated through the example path before adding more delivery semantics.
    define_chat_or_group_messaging_gate: Product-useful but broadens social scope too early.
    define_matchmaking_gate: Product-class capability, but depends on a stronger client/developer path and more realtime semantics.
    reactivate_pitaya_distributed_architecture_review: Explicitly deferred by the Nakama-first direction.

