user_requirement: Define the minimum source-first operations inspection surface needed for prototype authors to understand and troubleshoot local alpha server state before broader capability expansion.
nakama_capability_family: admin_console_metrics_observability_and_operations

nakama_capability_mapping:
  family: admin_console_metrics_observability_and_operations
  product_intent: Nakama-class frameworks need operators and developers to inspect health, version, configuration posture, active capability state, and runtime behavior without guessing from logs alone. vibit adapts this to a source-first local operations inspection posture before building admin console, metrics, or hosted operations surfaces.
  adopted:
    - operations visibility pressure
    - health/version/configuration posture inspection
    - capability and verification posture inspection
  adapted:
    - source-first repository inspection before runtime admin endpoints
    - redacted local alpha categories before live state inspectors
  rejected:
    - direct Nakama API compatibility
    - Nakama console routes or dashboard behavior
    - production metrics naming or hosted operations promises
  pitaya_status: deferred_future_architecture_reference

acceptance_criteria:
  - The gate defines the minimum source-first operations inspection posture.
  - The gate records accepted existing runtime and source surfaces.
  - The gate records minimum inspectable state categories.
  - The gate records redaction requirements, ownership, future implementation candidates, verification commands, and stop conditions.
  - The gate opens W-0245 as a narrow source-first implementation work item.
  - The gate does not add operations/admin implementation, runtime behavior, protocol shape, generated output, persistence, migrations, dependencies, hosted surfaces, SDKs, distributed runtime, or direct compatibility scope.

test_plan:
  repository_checks:
    - Repository check for W-0244 completion and W-0245 next-ready state.
    - Runtime check for ADR-0152, gate standard, translation, change artifacts, redaction markers, accepted existing surfaces, file candidates, deferrals, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  go_tests:
    - Not required for this gate because no runtime or Go behavior changes are added.

