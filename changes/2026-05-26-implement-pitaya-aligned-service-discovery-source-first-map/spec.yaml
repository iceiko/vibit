    - service_instance vocabulary inspection
    - service_selector vocabulary inspection
    - static startup composition to deferred discovery mapping
    - route and module handler mapping to future discoverable backend ownership
  adapted:
    - source-first repository inspection before service discovery implementation
    - explicit deferral flags before runtime topology
    - vibit module contracts remain authoritative
  rejected:
