    - distributed group or room broadcast behavior in this slice

acceptance_criteria:
  - The repository exposes `node tools/vibit inspect pitaya-discovery --json`.
  - The inspection output includes allowed service discovery vocabulary, related vocabulary, current single-process service discovery mapping, source surfaces, deferrals, and redaction flags.
  - Repository checks verify the W-0253 map and W-0254 next-ready state.
  - The slice does not add service discovery implementation, registries, selectors, node identity, RPC implementation, remote calls, frontend/backend role implementation, distributed runtime implementation, distributed groups, room broadcast fanout, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

