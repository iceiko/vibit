schema_version: 0.1
change_id: implement-logout-access-token-behavior
date: 2026-05-18
type: feature
status: verified

summary: Implement application-owned presented opaque access-token logout behavior.

affected_modules:
  - runtime
  - authentication

decisions:
  added:
    - ADR-0073
  referenced:
    - ADR-0019
    - ADR-0052
    - ADR-0066
    - ADR-0068
    - ADR-0069
    - ADR-0070
    - ADR-0071
    - ADR-0072

contracts:
  commands:
    added: []
    changed:
      - contracts/runtime/authentication/commands/LogoutAccessToken.yaml
    removed: []
  queries:
    added: []
    changed: []
    removed: []
  events:
    added: []
    changed: []
    removed: []
  errors:
    added: []
    changed: []
    removed: []
  permissions:
    added: []
    changed: []
    removed: []

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Logout execution is application-owned under runtime/internal/app/authentication.
    - Authentication repository remains storage-neutral and receives only digest-derived lookup and revocation mutation data.
    - Runtime sessions and active WebSocket connections remain separate future lifecycle decisions.

compatibility:
  breaking_api: false
  breaking_events: false
  breaking_data: false
  protobuf_envelope_changed: false
  protobuf_logout_route_added: false
  websocket_handshake_changed: false
  direct_nakama_pitaya_api_compatibility_added: false

runtime:
  go_code_added: true
  generated_code_added: false
  completed_work_item: W-0158
  completed_milestone: M-086
  logout_access_token_behavior_implemented: true
  logout_access_token_behavior_implementation_decision: ADR-0073
  logout_access_token_behavior_implementation_check_rule: runtime.logout_access_token_behavior_implementation
  first_logout_scope: presented_access_token_only
  proof_carrier_status: already_decoded_service_request_only
  token_lookup_before_revocation_required: true
  token_verifier_comparison_before_revocation_required: true
  token_status_must_be_active_before_revocation: true
  already_revoked_token_public_behavior: invalid_token
  expired_token_public_behavior: invalid_token
  logout_execution_added: true
  token_revocation_execution_added: true
  runtime_session_revocation_added: false
  active_connection_invalidation_added: false
