schema_version: 0.1
change_id: define-logout-revocation-active-connection-gate
date: 2026-05-18
type: standard
status: verified

summary: Define the gate-only boundary for future logout, token/session revocation, and active WebSocket connection invalidation behavior.

affected_modules:
  - runtime
  - authentication

decisions:
  added:
    - ADR-0071
  referenced:
    - ADR-0019
    - ADR-0053
    - ADR-0056
    - ADR-0057
    - ADR-0058
    - ADR-0065
