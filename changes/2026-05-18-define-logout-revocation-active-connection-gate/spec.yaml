    removed: []
  permissions:
    added: []
    changed: []
    removed: []

data:
  migrations_required: false
  migration_sources: []
  ownership_changes:
    - Future logout/revocation policy remains application-owned under runtime/internal/app.
    - Future token revocation execution remains under runtime/internal/app/authentication after a later gate.
    - Runtime session repository remains storage-neutral and does not own active connection invalidation.
    - WebSocket transport remains credential-neutral and does not own authentication state.

