acceptance_criteria:
  - The gate defines allowed cluster-safe session routing vocabulary.
  - The gate maps current connection/session binding surfaces to future cluster-safe session routing vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0257 as a narrow source-first cluster-safe session routing map work item.
  - The gate does not add cluster-safe session routing behavior, registries, handoff, reconnect routing, service discovery implementation, RPC implementation, remote calls, frontend/backend role implementation, distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

