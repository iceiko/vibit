user_requirement: Continue toward Pitaya by defining future frontend/backend role vocabulary while preserving current single-process boundaries.
nakama_capability_family: distributed_runtime_frontend_backend_rpc_and_service_discovery

reference_mapping:
  primary_product_reference: Nakama
  pitaya_reference_status: frontend_backend_role_vocabulary_boundary_defined_for_future_architecture_planning
  adopted:
    - frontend_server role vocabulary
    - backend_server role vocabulary
    - acceptor to future frontend role mapping
    - session binding to future frontend role mapping
    - route handler to future backend role mapping
  adapted:
    - role vocabulary only before implementation
    - source-first mapping before runtime topology
    - vibit module contracts remain authoritative
  rejected:
    - direct Pitaya API compatibility
    - Pitaya package or route naming compatibility
    - frontend/backend process split in this slice
    - distributed runtime implementation in this slice

acceptance_criteria:
  - The gate defines allowed frontend/backend role vocabulary.
  - The gate maps current single-process vibit concepts to future role vocabulary.
  - The gate records ownership, future implementation candidate, verification commands, and stop conditions.
  - The gate opens W-0249 as a narrow source-first role map work item.
  - The gate does not add frontend/backend role implementation, distributed runtime implementation, protocol shape, generated output, persistence, dependencies, hosted surfaces, SDKs, or direct compatibility.

test_plan:
  repository_checks:
    - Repository check for ADR-0156, gate standard, translation, change artifacts, role vocabulary markers, W-0248 completion, W-0249 next-ready state, and rule registration.
    - Memory/schema/work/all checks for repository consistency.
  go_tests:
    - Not required for this gate because no runtime or Go behavior changes are added.

