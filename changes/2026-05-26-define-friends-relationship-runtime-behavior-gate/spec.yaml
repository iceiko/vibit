user_requirement: "Define the friends relationship runtime behavior gate after the PostgreSQL friends adapter, preserving Nakama-first planning and deferring runtime implementation, protocol, generated, event/audit, broad social feature, and direct compatibility scope."
user_visible_outcome: Future agents can inspect a friends relationship runtime behavior gate, ADR, change spec, and checks before implementing the application service.
nakama_capability_family: friends_groups_and_parties

nakama_capability_mapping:
  family: friends_groups_and_parties
  product_intent: Friends relationship runtime behavior is a prerequisite for player-facing Nakama-class social graph operations before protocol routes, generated payloads, or broader social modules can be implemented safely.
  adopted:
    - Friends relationships are player-to-player social graph state.
    - Friend request, accept, reject, remove, block, unblock, list, and status behavior require validated player identity.
    - Public relationship status must be actor-relative.
    - Private social graph data requires explicit redaction posture.
  adapted:
    - vibit defines the runtime behavior gate before implementation.
    - Application behavior stays under `runtime/internal/app` and calls storage-neutral repository interfaces through unit-of-work boundaries.
    - The protocol and schema remain vibit-native and do not copy external APIs.
  rejected:
    - direct Nakama API compatibility unless a later ADR explicitly authorizes it
    - direct Pitaya API compatibility unless a later ADR explicitly authorizes it
    - runtime behavior implementation, protocol, group, party, chat, matchmaking, match runtime, SDK, hosted, distributed runtime, or event/audit table scope in this slice
  pitaya_status: deferred_future_architecture_reference

