rules:
  - id: contracts_before_implementation
    level: required
    description: Public commands, queries, events, errors, and permissions must be declared before handwritten runtime behavior uses them.
  - id: contract_source_is_not_generated
    level: required
    description: Contract manifest files are semantic source artifacts and must not be treated as generated output.
  - id: generated_output_traces_to_contract
    level: required
    description: Generated types, validators, dispatch shapes, clients, and fixtures must trace back to contract source files.
  - id: protobuf_aligns_with_semantic_contract
    level: required_when_proto_exists
    description: Protobuf wire messages must align with registered commands, queries, events, errors, permissions, and module ownership.

