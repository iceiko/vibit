  session_validation:
    status: semantic_contracts_and_dimensions_ratified_metadata_only_runtime_hook_no_authentication
    owner: runtime/internal/app
    standard: docs/player-account-session-contracts.md
    dimensions_standard: docs/authentication-proof-token-session-contract-dimensions.md
    decisions:
      - ADR-0018
      - ADR-0021
      - ADR-0023
    contract_dimensions:
      actor_kinds:
        - unknown
        - anonymous
        - player
        - service
        - admin
      validation_statuses:
        - unknown
        - anonymous
        - metadata_only
        - authentication_proven
        - session_validated
        - service_validated
        - rejected
      proof_statuses:
        - not_present
        - present_unverified
        - proven
        - rejected
        - expired
        - revoked
        - unsupported
