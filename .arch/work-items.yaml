schema_version: 0.1
project: vibit
status: draft
standard: docs/workflow.md
current_milestone: M-011

continuation_semantics:
  default_step_unit: work_item
  one_step_request:
    phrases:
      - continue
      - 继续
    meaning: Advance one next_ready work item unless blocked or confirmation is required.
  multi_step_request:
    pattern: continue <n> steps
    meaning: Advance up to n next_ready work items in dependency order, stopping early if blocked or confirmation is required.
  stop_conditions:
    - no_next_ready_work_item
    - work_item_blocked
    - ask_first_boundary_reached
    - verification_failure
    - maintainer_redirect

milestones:
  - id: M-000
    title: Constitutional And Operating Foundation
    status: completed
    goal: Establish the constitution, bilingual documentation rule, change specs, ADRs, architecture manifests, conversation memory, and baseline verification tooling.
    completion_summary: The repository has a constitution, AGENTS guides, change spec workflow, ADRs, conversation logs, architecture checks, and initial runtime direction.

  - id: M-001
    title: First Go Runtime Request Loop
    status: completed
    goal: Build the first bounded WebSocket Protobuf application request loop without persistence.
    completion_criteria:
      - WebSocket transport accepts binary frames without owning protocol or domain behavior.
      - Protobuf adapter decodes envelopes and bridges inventory payloads.
      - Application dispatch routes command and query requests.
      - Composition connects WebSocket frames to Protobuf envelopes and application dispatch.
      - The loop is covered by Go tests and repository checks.
    non_goals:
      - PostgreSQL persistence
      - authentication
      - session validation
      - generated route registration
      - distributed runtime
    completion_summary: The first bounded WebSocket Protobuf request loop is implemented with transport, protocol, application dispatch, inventory runtime behavior, process wiring, request-loop test support, and repository checks.

  - id: M-002
    title: Durable Inventory Runtime
    status: completed
    goal: Add PostgreSQL-backed inventory persistence and transaction boundaries after the in-process request loop is proven.
    completion_criteria:
      - PostgreSQL runtime configuration and a pgx-backed transaction runner exist behind declared platform boundaries.
      - Migration apply and status tooling can execute SQL-first migration sources explicitly.
      - A disposable PostgreSQL verification environment is defined before live integration checks become mandatory.
      - Persistent inventory runtime composition can serve the existing WebSocket Protobuf request loop without moving persistence details into domain, protocol, or transport packages.
      - Durable inventory behavior is verified end to end or any unavailable external verification is explicitly recorded.
    non_goals:
      - object storage
      - cluster runtime
      - multi-module economy behavior
    completion_summary: The durable inventory runtime is implemented with PostgreSQL configuration, transaction runner, migration tooling, PostgreSQL repository adapter, explicit runtime composition, and live end-to-end PostgreSQL verification on Termux PostgreSQL 18.2.

  - id: M-003
    title: Player Identity And Session Boundary
    status: completed
    goal: Define the player identity, authentication boundary, and WebSocket session lifecycle before inventory, permissions, or future modules rely on ad hoc player context.
    completion_criteria:
      - Player identity, account ownership, authentication, and runtime session responsibilities are separated in manifests and standards.
      - The protocol session model is grounded in explicit player/session ownership without changing the existing envelope shape prematurely.
      - The first implementation work queue for player/session behavior is planned in bounded, verifiable steps.
      - Inventory permission policy has a documented path away from bootstrap static allow behavior.
      - No authentication provider, token format, or credential storage model is implemented before the boundary is ratified.
    non_goals:
      - external identity providers
      - production login security
      - token signing or cryptography dependencies
      - player database migrations
      - matchmaking or presence
    completion_summary: The player identity and session boundary is complete as a durable boundary milestone. Player identity, account lifecycle, authentication, runtime session validation, transport metadata, envelope session metadata, and request identity context are separated in standards and manifests; the application request identity and session validation hook exists; inventory permission handoff receives request identity without owning authentication or player accounts; metadata-only identity is guarded; and runtime.identity_boundary checks prevent common regressions. No authentication provider, token format, credential storage, player account persistence, Protobuf envelope change, or WebSocket handshake change was implemented.

  - id: M-004
    title: Next Direction Confirmation Gate
    status: completed
    goal: Hold the work queue at an explicit maintainer confirmation point before choosing the next major product or architecture direction.
    completion_criteria:
      - The maintainer chooses the next milestone direction.
      - The chosen direction is recorded as a bounded milestone with at least one next_ready work item.
      - Ask-first boundaries are preserved for authentication, token, credential, player account schema, session persistence, Protobuf envelope, WebSocket handshake, major external framework dependency, and production permission decisions.
    non_goals:
      - implementing authentication before ratification
      - choosing token or credential design implicitly
      - adding player account migrations without schema decision
      - changing Protobuf envelope or WebSocket handshake without confirmation
      - declaring metadata-only identity sufficient for production permissions
    completion_summary: The maintainer selected ratify_player_account_and_session_contracts as the next direction, with Nakama and Pitaya remaining active references for capability coverage and server framework vocabulary. M-005 was created as the active contract-first milestone, and no authentication, token, credential, player account schema, session persistence, Protobuf envelope, WebSocket handshake, major dependency, or production permission decision was made.

