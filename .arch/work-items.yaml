      - Pitaya session binding, route handler, frontend/backend, and realtime server vocabulary is reviewed and either adopted, adapted, deferred, or rejected in vibit terms.
      - The first implementation queue after ratification remains bounded, verifiable, and does not rely on metadata-only identity as authenticated proof.
    non_goals:
      - implementing production authentication
      - choosing token signing, refresh, or expiration behavior
      - choosing credential storage or password hashing behavior
      - adding player account database migrations
      - adding session persistence
      - changing Protobuf envelope shape
      - changing WebSocket handshake authentication behavior
      - copying Nakama or Pitaya public APIs directly
      - adding a major external framework dependency
    completion_summary: M-005 completed the contract-first player account and runtime session validation milestone. The repository now has a player account/session contract standard with Nakama and Pitaya reference mapping, ratified player account semantic contracts, player account Protobuf wire shape and generated Go output, ratified runtime session validation semantic contracts, runtime-owned contract inspection support, and explicit guards that metadata-only identity is not authenticated proof. No authentication scheme, token behavior, credential storage, player account persistence, session persistence, Protobuf envelope change, WebSocket handshake authentication change, runtime player handler, WebSocket route, direct external API compatibility, or major external dependency was added.

