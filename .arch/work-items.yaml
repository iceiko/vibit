schema_version: 0.1
project: vibit
status: draft
standard: docs/workflow.md
current_milestone: M-002

continuation_semantics:
  default_step_unit: work_item
  one_step_request:
    phrases:
      - continue
      - 继续
    meaning: Advance one next_ready work item unless blocked or confirmation is required.
  multi_step_request:
    pattern: continue <n> steps
    meaning: Advance up to n next_ready work items in dependency order, stopping early if blocked or confirmation is required.
  stop_conditions:
    - no_next_ready_work_item
    - work_item_blocked
    - ask_first_boundary_reached
    - verification_failure
    - maintainer_redirect

milestones:
  - id: M-000
    title: Constitutional And Operating Foundation
    status: completed
    goal: Establish the constitution, bilingual documentation rule, change specs, ADRs, architecture manifests, conversation memory, and baseline verification tooling.
    completion_summary: The repository has a constitution, AGENTS guides, change spec workflow, ADRs, conversation logs, architecture checks, and initial runtime direction.

  - id: M-001
    title: First Go Runtime Request Loop
    status: completed
    goal: Build the first bounded WebSocket Protobuf application request loop without persistence.
    completion_criteria:
      - WebSocket transport accepts binary frames without owning protocol or domain behavior.
      - Protobuf adapter decodes envelopes and bridges inventory payloads.
      - Application dispatch routes command and query requests.
      - Composition connects WebSocket frames to Protobuf envelopes and application dispatch.
      - The loop is covered by Go tests and repository checks.
    non_goals:
      - PostgreSQL persistence
      - authentication
      - session validation
      - generated route registration
      - distributed runtime
    completion_summary: The first bounded WebSocket Protobuf request loop is implemented with transport, protocol, application dispatch, inventory runtime behavior, process wiring, request-loop test support, and repository checks.

  - id: M-002
    title: Durable Inventory Runtime
    status: active
    goal: Add PostgreSQL-backed inventory persistence and transaction boundaries after the in-process request loop is proven.
    completion_criteria:
      - PostgreSQL runtime configuration and a pgx-backed transaction runner exist behind declared platform boundaries.
      - Migration apply and status tooling can execute SQL-first migration sources explicitly.
      - A disposable PostgreSQL verification environment is defined before live integration checks become mandatory.
      - Persistent inventory runtime composition can serve the existing WebSocket Protobuf request loop without moving persistence details into domain, protocol, or transport packages.
      - Durable inventory behavior is verified end to end or any unavailable external verification is explicitly recorded.
    non_goals:
      - object storage
      - cluster runtime
      - multi-module economy behavior

