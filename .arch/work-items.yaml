  - id: W-0007
    milestone: M-001
    title: Add WebSocket Protobuf application composition adapter
    status: completed
    change: changes/2026-05-13-add-websocket-protobuf-application-composition
    commits:
      - 450a7a5
    depends_on:
      - W-0002
      - W-0004
      - W-0005
      - W-0006
    related_decisions:
      - ADR-0018
    completion:
      - Decode binary WebSocket frame payloads as Protobuf envelopes outside the WebSocket transport package.
      - Convert command and query envelopes to application route requests.
      - Dispatch through app.Dispatcher.
      - Encode application payload results and application errors back to Protobuf envelopes.
      - Preserve transport, protocol, application, domain, and generated output boundaries.
      - Cover the composition with Go tests.
    ask_first:
      - Changing the protocol envelope shape.
      - Moving generated Protobuf imports into application or domain packages.
      - Adding authentication or session validation.

