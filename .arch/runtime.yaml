schema_version: 0.1
project: vibit
status: draft
purpose: >
  Runtime readiness manifest for the first reference implementation.
  This file records the minimum runtime decisions that agents should read
  before creating server implementation code.

  canonical_decisions:
  superseded_language_decision: ADR-0003
  language_and_package_layout: ADR-0008
  server_instance_model: ADR-0004
  contract_and_generation_boundary: ADR-0005
  first_runtime_proof_slice: ADR-0006
  client_protocol_and_wire_format: ADR-0009
  dependency_adoption: ADR-0010
  persistence_direction: ADR-0011
  technical_decision_authority: ADR-0012
  first_go_runtime_dependencies: ADR-0013
  go_runtime_layout_and_boundaries: ADR-0014
  game_protocol_framework: ADR-0015
  protobuf_envelope_and_generation: ADR-0016
  generated_output_standard: ADR-0017
  runtime_protocol_adapter_boundary: ADR-0018
  postgresql_persistence_boundary: ADR-0020

architecture_scope:
  framework_standard: agent_native_language_portable
  first_reference_implementation: go
  current_phase: durable_inventory_runtime
  implementation_code_status: websocket_endpoint_mounted_with_protobuf_composition_dispatch_inventory_runtime_protocol_bridge_inventory_mutation_lock_boundary_postgresql_adapter_transaction_runner_and_migration_runner
  previous_experimental_runtime_slice: removed_from_mainline

first_reference_runtime:
  language: Go
  platform: Go runtime
  package_manager: go_modules
  dependency_policy: explicit_adoption_record_for_foundational_dependencies
  accepted_foundational_dependencies:
    websocket_server: github.com/coder/websocket
    protobuf_runtime: google.golang.org/protobuf
    protobuf_generator: google.golang.org/protobuf/cmd/protoc-gen-go
    protobuf_orchestrator: buf.build CLI
    postgresql_driver: github.com/jackc/pgx/v5
    migration_tooling: github.com/pressly/goose/v3
    test_framework: Go standard library testing first
  deferred_foundational_dependencies:
    - s3_client
    - minio_server
    - observability
    - external_go_test_framework
  current_scripts: {}
  planned_verification:
    format: gofmt
    vet: go vet ./...
    tests: go test ./...
    repository_check: node tools/vibit check all
  rationale:
    - Go is a strong long-term server implementation language for concurrent network services.
    - Go has a stable standard toolchain, simple deployment shape, and readable explicit error handling.
    - Go aligns well with WebSocket servers, Protobuf message handling, and production operations.
    - The choice is the ratified first server runtime direction, while vibit's architecture standard remains portable at the manifest and contract level.

tooling_runtime:
  current_cli:
    language: JavaScript
    platform: Node.js
    dependency_policy: standard_library_only
    role: architecture_checks_generators_and_inspection
    not_server_runtime: true

package_layout:
  decision: ADR-0014
  intended_roots:
    runtime: runtime
    runtime_go_module: runtime
    runtime_command: runtime/cmd/vibit-server
    runtime_app: runtime/internal/app
    runtime_platform: runtime/internal/platform
    runtime_modules: runtime/internal/modules
    runtime_generated: runtime/internal/generated
    runtime_migrations: runtime/migrations/postgres
    packages: packages
    modules: modules
    contracts: contracts
    proto_sources: proto
    tests: tests
  go_module:
    path: github.com/iceiko/vibit/runtime
    location: runtime/go.mod
    status: created
  package_owners:
    runtime/cmd/vibit-server: process_startup_configuration_and_lifecycle
    runtime/internal/app: command_query_dispatch_application_composition_and_transaction_orchestration
    runtime/internal/platform/transport/ws: websocket_transport_adapter
    runtime/internal/platform/protocol/protobuf: protobuf_framing_and_wire_conversion
    runtime/internal/platform/persistence/postgres: postgresql_persistence_adapter
    runtime/internal/platform/migrations: migration_tool_invocation_and_validation
    runtime/internal/platform/events: event_recording_and_publication_mechanisms
    runtime/internal/platform/tx: transaction_boundary_and_unit_of_work
    runtime/internal/modules: handwritten_domain_module_runtime_logic
    runtime/internal/generated/contracts: generated_go_contract_shapes
    runtime/internal/generated/proto: generated_go_protobuf_files
    runtime/migrations/postgres: sql_first_postgresql_migration_sources
    proto: protobuf_source_files
  rules:
    - Public contracts are declared before handwritten behavior.
    - Generated files must be traceable to schemas or manifests.
    - Handwritten module logic lives in explicit extension points.
    - Runtime packages must not hide domain behavior in transport handlers.
    - Third-party transport, protocol, persistence, and migration dependencies stay inside platform or generated owner packages.
    - Domain modules under runtime/internal/modules depend on vibit-owned interfaces and generated contracts, not platform dependencies.
    - Generated Go Protobuf files under runtime/internal/generated/proto must trace to .proto sources and must not contain handwritten runtime logic.
    - Runtime protocol handoff must preserve the transport, protocol, application, domain, and generated output boundaries defined by docs/runtime-protocol-adapter.md.

server_instance_model:
  first_model: modular_monolith_single_process
  network_surface:
    gameplay_client_protocol: websocket
    wire_message_format: protobuf
    http_api: later_health_admin_or_dev_tooling_only
    internal_commands: planned
  protocol_rules:
    - WebSocket is the first client gameplay protocol.
    - Protobuf is the first wire message format for client/server messages.
    - The first game protocol framework is a WebSocket-framed Protobuf envelope.
    - Protocol routing uses explicit kind, module, and name fields.
    - Client-to-server commands, queries, and future inputs are requests, not facts.
    - Server-pushed domain events are authoritative facts.
    - Game target metadata reserves global, player, party, room, match, stream, and system scopes.
    - The first inventory protocol slice uses player scope.
    - The first WebSocket platform adapter uses github.com/coder/websocket.
    - Protobuf generation uses the official Go Protobuf runtime and protoc-gen-go, orchestrated by Buf.
    - The first envelope source is proto/vibit/protocol/v1/envelope.proto.
    - Buf Schema Registry is not required by the first runtime dependency decision.
    - HTTP must not become the first gameplay API without a superseding decision.
    - WebSocket transport adapters pass opaque frame bytes to protocol and application composition.
    - Domain modules do not own WebSocket connections, Protobuf framing, or third-party network library details.
  boundary_to_contract_model:
    protobuf_role: wire_schema
    manifest_role: business_semantics_source
    consistency_requirement: tooling_must_check_manifest_proto_alignment_before_protocol_surface_grows
  protocol_alignment:
    check_command: node tools/vibit check protocol
    status: active_for_planned_and_existing_proto_sources
    missing_proto_files_allowed_until_generation_starts: true
  protocol_framework:
    manifest: .arch/protocol.yaml
    standard: docs/game-protocol.md
    decision: ADR-0015
    envelope_model: websocket_framed_protobuf_envelope
    first_endpoint: /v1/ws
    endpoint_status: mounted_in_first_runtime_process
    routing_fields:
      - kind
      - module
      - name
    active_message_kinds_for_first_inventory_slice:
      - command
      - query
      - event
      - error
      - system
    reserved_message_kinds:
      - ack
      - heartbeat
      - input
      - state
    target_scopes:
      - global
      - player
      - party
      - room
      - match
      - stream
      - system
    first_slice_scope: player
    authority_model: server_authoritative
  runtime_protocol_adapter:
    standard: docs/runtime-protocol-adapter.md
    decision: ADR-0018
    check_command: node tools/vibit check runtime
    status: websocket_endpoint_transport_protobuf_composition_inventory_bridge_and_application_error_envelopes_created
    first_request_flow:
      - websocket_frame
      - transport_frame
      - protocol_envelope
      - route_request
      - application_dispatch
      - domain_command_or_query_handler
      - application_result
      - protocol_envelope
      - websocket_frame
    first_server_push_flow:
      - domain_event
      - application_publication_decision
      - protocol_envelope
      - transport_send
    handoff_concepts:
      - TransportFrame
      - ProtocolEnvelope
      - RouteRequest
      - ApplicationResult
      - OutboundMessage
    layer_owners:
      process: runtime/cmd/vibit-server
      application_bootstrap: runtime/internal/app/bootstrap
      transport: runtime/internal/platform/transport/ws
      protocol: runtime/internal/platform/protocol/protobuf
      application_dispatch: runtime/internal/app
      domain_modules: runtime/internal/modules/<module>
      generated_contracts: runtime/internal/generated/contracts
      generated_proto: runtime/internal/generated/proto
    process_wiring:
      owner: runtime/cmd/vibit-server
      status: first_endpoint_mounted
      command: runtime/cmd/vibit-server/main.go
      tests: runtime/cmd/vibit-server/main_test.go
      runbook: docs/runtime-runbook.md
      default_listen_address: :8080
      environment:
        listen_address: VIBIT_ADDR
      mounted_endpoints:
        - /v1/ws
      responsibilities:
        - read_process_configuration
        - assemble_bootstrap_dispatcher
        - compose_protobuf_frame_handler_with_websocket_transport
        - mount_v1_ws_endpoint
        - start_http_server
      non_goals:
        - domain_business_logic
        - authentication_or_session_validation
        - persistence_wiring
        - generated_route_registration
    application_bootstrap:
      owner: runtime/internal/app/bootstrap
      status: first_in_memory_inventory_dispatcher_created
      adapter: runtime/internal/app/bootstrap/inventory.go
      responsibilities:
        - create_application_dispatcher
        - register_inventory_runtime_handlers
        - choose_bootstrap_in_memory_inventory_dependencies
      non_goals:
        - durable_persistence
        - authentication_policy
        - production_permission_model
    websocket_transport:
      owner: runtime/internal/platform/transport/ws
      status: first_adapter_created
      dependency: github.com/coder/websocket
      adapter: runtime/internal/platform/transport/ws/server.go
      tests: runtime/internal/platform/transport/ws/server_test.go
      route_mounting: deferred_to_runtime_process_wiring
      responsibilities:
        - accept_websocket_connections
        - read_binary_frames
        - copy_frame_payloads_before_handler_handoff
        - delegate_opaque_frame_bytes_to_injected_handler
        - write_handler_responses_as_binary_frames
        - reject_non_binary_messages
      non_goals:
        - protobuf_envelope_decoding
        - application_dispatch
        - domain_behavior
        - session_authentication
        - process_startup_wiring
    frame_composition:
      owner: runtime/internal/platform/protocol/protobuf
      status: first_adapter_created
      adapter: runtime/internal/platform/protocol/protobuf/frame_handler.go
      tests: runtime/internal/platform/protocol/protobuf/frame_handler_test.go
      test_fixture: runtime/internal/platform/protocol/protobuf/request_loop_fixture_test.go
      route_mounting: deferred_to_runtime_process_wiring
      responsibilities:
        - decode_frame_payload_bytes_as_protobuf_envelopes
        - map_envelopes_to_application_route_requests
        - dispatch_command_and_query_requests_through_app_dispatcher
        - map_application_success_results_to_protobuf_envelopes
        - map_application_errors_to_protobuf_error_envelopes
        - return_encoded_protobuf_envelope_bytes_for_transport_write
        - keep_request_loop_test_setup_repeatable_without_transport_dependencies
      non_goals:
        - open_websocket_connections
        - own_websocket_lifecycle
        - change_protocol_envelope_shape
        - authenticate_or_validate_sessions
        - perform_domain_permission_or_invariant_checks
    current_bridges:
      application_errors:
        mapper: runtime/internal/platform/protocol/protobuf/error_envelope.go
        tests: runtime/internal/platform/protocol/protobuf/error_envelope_test.go
        maps_results:
          - app.ApplicationError -> protocolv1.Error
        message_kind: error
        retryability: non_retryable_by_default_until_catalog_driven_mapping_exists
      inventory:
        request_mapper: runtime/internal/platform/protocol/protobuf/inventory_bridge.go
        tests: runtime/internal/platform/protocol/protobuf/inventory_bridge_test.go
        test_fixture: runtime/internal/platform/protocol/protobuf/request_loop_fixture_test.go
        maps_requests:
          - GrantItemRequest -> inventory.GrantItemRequest
          - GetInventoryRequest -> inventory.GetInventoryRequest
        maps_results:
          - inventory.GrantItemResponse -> GrantItemResponse
          - inventory.GetInventoryResponse -> GetInventoryResponse
        maps_events:
          - inventory.ItemGrantedEvent -> ItemGranted
        boundary_rule: Domain and application packages must not import generated Protobuf packages.
  application_dispatch:
    owner: runtime/internal/app
    status: skeleton_created
    route_registration: explicit_handwritten_until_generator_exists
    dispatchable_message_kinds:
      - command
      - query
    non_dispatchable_message_kinds:
      - event
      - error
      - system
      - ack
      - heartbeat
      - input
      - state
    current_errors:
      - INVALID_ROUTE
      - UNSUPPORTED_MESSAGE_KIND
      - ROUTE_ALREADY_REGISTERED
      - ROUTE_NOT_FOUND
      - NIL_HANDLER
    current_boundaries:
      - Application dispatch must not import WebSocket transport dependencies.
      - Application dispatch must not import Protobuf runtime dependencies or generated Protobuf packages.
      - Application dispatch may import the platform transaction boundary package but not other platform adapters.
      - Application dispatch calls vibit-owned handler interfaces.
      - Domain business logic remains outside application dispatch.
      - TransactionalDispatcher opens a unit of work for command routes and passes query routes through by default.
    check_rule: runtime.layer_boundary
    tests:
      - runtime/internal/app/dispatch_test.go
      - runtime/internal/app/transactional_dispatch_test.go
  protobuf_layout:
    source_root: proto
    envelope_source: proto/vibit/protocol/v1/envelope.proto
    module_source_pattern: proto/vibit/<module>/v1
    buf_config: buf.yaml
    buf_generation_config: buf.gen.yaml
    generated_go_output: runtime/internal/generated/proto
    generated_go_output_status: generated_proto_created
    generated_output_standard: docs/generated-output.md
    generated_output_decision: ADR-0017
    generated_output_check: node tools/vibit check generated
    generated_file_suffix: .pb.go
    generated_marker: Code generated by protoc-gen-go. DO NOT EDIT.
    source_trace_pattern: // source: <path>.proto
    source_root_status: envelope_and_first_inventory_sources_created
    registry_required_before_broad_generation: true
  boundaries:
    - Modules communicate through commands, queries, events, public module APIs, or generated clients.
    - Transport handlers do not adapt requests into commands or queries directly.
    - Protocol and application composition convert decoded envelopes into commands or queries.
    - Domain modules own state and invariants.
    - Platform code owns runtime concerns such as transport, storage adapters, event dispatch, and verification hooks.
  deferred:
    - distributed_actor_runtime
    - multi_process_cluster
    - service_mesh_deployment
    - cloud_orchestration

persistence_model:
  decision: ADR-0011
  boundary_decision: ADR-0020
  standard: docs/postgresql-persistence-boundary.md
  status: explicit_postgresql_inventory_runtime_composition_created_live_verification_pending
  authoritative_store:
    engine: PostgreSQL
    accepted_driver: github.com/jackc/pgx/v5
    role: first_authoritative_durable_relational_store
    scope:
      - module_owned_state
      - transactional_state_changes
      - invariants_requiring_consistency
      - outbox_or_event_log_when_needed
    implementation_status: config_pool_builder_transaction_runner_adapter_and_explicit_process_wiring_created_migration_runner_explicit_only_live_verification_pending
    runtime_store_selection:
      environment: VIBIT_RUNTIME_STORE
      default: memory
      postgres_value: postgres
      memory_path: runtime/internal/app/bootstrap.NewInMemoryInventoryDispatcher
      postgres_path: runtime/cmd/vibit-server newPostgresHTTPHandler
      postgres_required_environment:
        - VIBIT_POSTGRES_DSN
      startup_migrations: not_applied_automatically
    config:
      owner: runtime/internal/platform/persistence/postgres
      file: runtime/internal/platform/persistence/postgres/config.go
      tests: runtime/internal/platform/persistence/postgres/config_test.go
      environment:
        dsn: VIBIT_POSTGRES_DSN
        max_connections: VIBIT_POSTGRES_MAX_CONNS
        min_connections: VIBIT_POSTGRES_MIN_CONNS
      secret_rule: Connection secrets are read from environment or explicit process input and must not be stored in tracked files.
  first_durable_module:
    module: inventory
    ownership_manifest: modules/inventory/module.yaml
    repository_interface_owner: runtime/internal/modules/inventory
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    migration_source_owner: runtime/migrations/postgres
    transaction_boundary_owner: runtime/internal/platform/tx
    transaction_orchestrator: runtime/internal/app
    status: postgresql_config_transaction_runner_and_adapter_wired_in_explicit_runtime_path_migration_runner_explicit_only
    runtime_composition:
      store_selector: VIBIT_RUNTIME_STORE
      default_store: memory
      postgres_store: postgres
      process_file: runtime/cmd/vibit-server/main.go
      application_bootstrap_files:
        - runtime/internal/app/bootstrap/inventory.go
        - runtime/internal/app/bootstrap/postgres_inventory.go
      transaction_wrapper: runtime/internal/app.TransactionalDispatcher
      command_repository_source: postgres.UnitOfWork.NewInventoryRepository
      query_repository_source: postgres.NewInventoryRepositoryForUnitOfWork(pool)
      tests:
        - runtime/cmd/vibit-server/main_test.go
        - runtime/internal/app/bootstrap/inventory_test.go
      startup_migrations: not_applied_automatically
      live_end_to_end_status: opt_in_environment_standard_defined_live_execution_pending
    postgres_adapter:
      package: runtime/internal/platform/persistence/postgres
      file: runtime/internal/platform/persistence/postgres/inventory_repository.go
      tests: runtime/internal/platform/persistence/postgres/inventory_repository_test.go
      construction: NewInventoryRepositoryForUnitOfWork
      binding_rule: Adapter receives an injected pgx-shaped executor from the application-owned unit of work and does not open hidden write transactions.
      implements:
        - inventory.Repository.GetInventory
        - inventory.Repository.LockInventoryForMutation
        - inventory.MutationLock.GetInventory
        - inventory.MutationLock.GrantItem
      grant_recording: Quantity mutation and inventory_item_grants insert use the same injected executor.
      runtime_wiring_status: wired_in_explicit_postgres_runtime_path
      live_integration_status: opt_in_environment_standard_defined_live_execution_pending
    postgres_transaction_runner:
      package: runtime/internal/platform/persistence/postgres
      file: runtime/internal/platform/persistence/postgres/runner.go
      tests: runtime/internal/platform/persistence/postgres/runner_test.go
      config_file: runtime/internal/platform/persistence/postgres/config.go
      implements: runtime/internal/platform/tx.Runner
      begins_with: pgx.Begin
      commit_rule: Commit when the application callback succeeds.
      rollback_rule: Roll back when the application callback fails and attempt rollback after commit failure.
      unit_of_work_type: runtime/internal/platform/persistence/postgres.UnitOfWork
      inventory_repository_factory: UnitOfWork.NewInventoryRepository
      boundary_rule: The runner owns pgx handles inside the PostgreSQL platform package; application and domain code continue to depend on vibit-owned transaction and repository interfaces.
      live_integration_status: opt_in_environment_standard_defined_live_execution_pending
    postgres_migration_runner:
      package: runtime/internal/platform/migrations
      file: runtime/internal/platform/migrations/postgres.go
      tests: runtime/internal/platform/migrations/postgres_test.go
      dependency: github.com/pressly/goose/v3
      construction: NewPostgresRunner
      directory_construction: NewPostgresRunnerFromDir
      owns:
        - goose_provider_configuration
        - postgresql_migration_source_listing
        - structured_migration_status
        - explicit_pending_migration_apply
      rules:
        - Accept caller-supplied database/sql handles and migration source filesystems or directories.
        - Disable the global Go migration registry.
        - Return vibit-owned status and result shapes instead of exposing goose result types.
        - Do not apply migrations during normal server startup.
        - Do not close caller-owned database handles.
      live_integration_status: opt_in_environment_standard_defined_live_execution_pending
  verification_environment:
    standard: docs/postgresql-verification-environment.md
    translation: docs/postgresql-verification-environment.zh-CN.md
    check_command: node tools/vibit check postgres-env
    status: opt_in_environment_standard_defined
    live_execution_status: commands_pending
    required_environment:
      test_dsn: VIBIT_POSTGRES_TEST_DSN
    optional_environment:
      test_database: VIBIT_POSTGRES_TEST_DATABASE
      cleanup: VIBIT_POSTGRES_TEST_CLEANUP
      allow_destructive: VIBIT_POSTGRES_TEST_ALLOW_DESTRUCTIVE
    cleanup_modes:
      - drop_schema
      - truncate
      - keep
    default_cleanup: drop_schema
    default_behavior_when_dsn_missing: skip_and_record_not_verified
    mandatory_service_manager: none
    docker_required: false
    podman_required: false
    cloud_postgresql_assumption: false
    default_repository_checks_open_database_connections: false
    mutation_lock:
      aggregate: inventory_account
      key: player_id
      interface: inventory.Repository.LockInventoryForMutation
      locked_view: inventory.MutationLock
      rule: GrantItem must lock the inventory account row before reading current inventory and applying capacity-sensitive item grants.
      sequence:
        - validate_request
        - check_permission
        - lock_inventory_for_mutation
        - read_current_inventory_through_lock
        - enforce_capacity_policy
        - grant_item_through_lock
        - release_lock_without_committing_transaction
    first_tables_planned:
      - inventory_accounts
      - inventory_items
      - inventory_item_grants
  object_storage:
    interface: s3_compatible
    role: planned_large_object_storage_abstraction
    preferred_local_self_hosted_candidate: MinIO
    candidate_status: requires_dependency_adoption_before_required_runtime_dependency
    suitable_for:
      - replay_archives
      - snapshots
      - exports
      - binary_assets
      - large_audit_or_diagnostic_artifacts
    not_suitable_for:
      - authoritative_transactional_domain_state
      - module_invariant_enforcement
  domain_rules:
    - Domain modules must depend on vibit-owned repository or object-store interfaces, not PostgreSQL drivers or S3 SDKs directly.
    - PostgreSQL schema, migrations, repository interfaces, and transaction boundaries must be declared before runtime persistence implementation.
    - The first migration tool is github.com/pressly/goose/v3 with SQL-first migration files.
    - Migration apply/status tooling must be invoked explicitly and must not run during normal server startup without a later change spec.
    - Go migrations require a change spec explaining why SQL is insufficient and must not hide domain business logic.
    - S3-compatible object storage must remain optional until a concrete module or platform capability requires it.
    - MinIO must not become a mandatory runtime dependency without an adoption record covering license, maintenance, operations, and replacement path.
    - Inventory GrantItemMutation carries event_id, occurred_at, and reason so durable adapters can record grant rows in the same unit of work as quantity changes.
  deferred:
    - outbox_or_event_log_storage_standard
    - first_s3_client_or_sdk
    - live_postgresql_integration_commands
  migration_layout:
    source_root: runtime/migrations/postgres
    default_style: sql_first
    naming_pattern: 000001_create_inventory_state.sql
    check_command: node tools/vibit check migrations
    required_markers:
      - "-- +goose Up"
      - "-- +goose Down"
    go_migrations_allowed: only_with_change_spec
    status: first_inventory_migration_source_created_apply_status_runner_created_live_apply_verification_pending
    first_migration:
      file: runtime/migrations/postgres/000001_create_inventory_state.sql
      module: inventory
      creates:
        - inventory_accounts
        - inventory_items
        - inventory_item_grants
      verification_status: source_check_available_apply_status_api_created_live_apply_or_rollback_pending
  transaction_boundary:
    decision: ADR-0014
    boundary_decision: ADR-0020
    owner: runtime/internal/platform/tx
    orchestrator: runtime/internal/app
    skeleton_status: driver_neutral_boundary_created_with_postgresql_runner_adapter
    runner_interface: runtime/internal/platform/tx.Runner
    unit_of_work_interface: runtime/internal/platform/tx.UnitOfWork
    application_wrapper: runtime/internal/app.TransactionalDispatcher
    postgresql_runner_adapter: runtime/internal/platform/persistence/postgres.Runner
    postgresql_unit_of_work_adapter: runtime/internal/platform/persistence/postgres.UnitOfWork
    postgresql_runner_tests: runtime/internal/platform/persistence/postgres/runner_test.go
    tests:
      - runtime/internal/platform/tx/uow_test.go
      - runtime/internal/app/transactional_dispatch_test.go
      - runtime/internal/platform/persistence/postgres/runner_test.go
    command_rule: State-changing commands run inside an application-owned unit of work.
    query_rule: Queries do not mutate state and do not require a write transaction by default.
    event_rule: Domain events produced by commands are recorded inside the same unit of work.
    publication_rule: Publication outside the transaction is deferred until an event delivery or outbox decision is made.
    outbox_status: deferred_until_cross_boundary_durable_event_delivery
    hidden_transaction_rule: Repositories must not silently open independent write transactions for command flows.

contract_model:
  source_format: vibit_manifest_yaml
  wire_schema_format: protobuf
  source_of_truth:
    business_semantics: vibit_manifests_and_contract_sources
    wire_messages: protobuf_files
    required_alignment: checked_by_tooling
  public_contract_types:
    - commands
    - queries
    - events
    - errors
    - permissions
  generated_outputs:
    - go_typed_contracts
    - protobuf_message_shapes
    - websocket_dispatch_shapes
    - clients_or_call_helpers
    - test_fixtures
  handwritten_outputs:
    - domain_policies
    - command_handlers
    - query_handlers
    - repositories
    - invariant_tests
  generated_file_policy:
    standard: docs/generated-output.md
    decision: ADR-0017
    immutable_to_non_system_agents: true
    override_permission: generated_file_override

first_runtime_proof_slice:
