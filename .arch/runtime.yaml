    credential_external_identity_boundaries_translation: docs/credential-storage-external-identity-linking-boundaries.zh-CN.md
    session_persistence_websocket_handshake_decision_gates_standard: docs/session-persistence-websocket-handshake-decision-gates.md
    session_persistence_websocket_handshake_decision_gates_translation: docs/session-persistence-websocket-handshake-decision-gates.zh-CN.md
    design_decision: ADR-0023
