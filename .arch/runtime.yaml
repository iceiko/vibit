schema_version: 0.1
project: vibit
status: draft
purpose: >
  Runtime readiness manifest for the first reference implementation.
  This file records the minimum runtime decisions that agents should read
  before creating server implementation code.

canonical_decisions:
  superseded_language_decision: ADR-0003
  language_and_package_layout: ADR-0008
  server_instance_model: ADR-0004
  contract_and_generation_boundary: ADR-0005
  first_runtime_proof_slice: ADR-0006
  client_protocol_and_wire_format: ADR-0009
  dependency_adoption: ADR-0010
  persistence_direction: ADR-0011
  technical_decision_authority: ADR-0012
  first_go_runtime_dependencies: ADR-0013
  go_runtime_layout_and_boundaries: ADR-0014

architecture_scope:
  framework_standard: agent_native_language_portable
  first_reference_implementation: go
  current_phase: runtime_skeleton
  implementation_code_status: skeleton_created_no_business_logic
  previous_experimental_runtime_slice: removed_from_mainline

first_reference_runtime:
  language: Go
  platform: Go runtime
  package_manager: go_modules
  dependency_policy: explicit_adoption_record_for_foundational_dependencies
  accepted_foundational_dependencies:
    websocket_server: github.com/coder/websocket
    protobuf_runtime: google.golang.org/protobuf
    protobuf_generator: google.golang.org/protobuf/cmd/protoc-gen-go
    protobuf_orchestrator: buf.build CLI
    postgresql_driver: github.com/jackc/pgx/v5
    migration_tooling: github.com/pressly/goose/v3
    test_framework: Go standard library testing first
  deferred_foundational_dependencies:
    - s3_client
    - minio_server
    - observability
    - external_go_test_framework
  current_scripts: {}
  planned_verification:
    format: gofmt
    vet: go vet ./...
    tests: go test ./...
    repository_check: node tools/vibit check all
  rationale:
    - Go is a strong long-term server implementation language for concurrent network services.
    - Go has a stable standard toolchain, simple deployment shape, and readable explicit error handling.
    - Go aligns well with WebSocket servers, Protobuf message handling, and production operations.
    - The choice is the ratified first server runtime direction, while vibit's architecture standard remains portable at the manifest and contract level.

tooling_runtime:
  current_cli:
    language: JavaScript
    platform: Node.js
    dependency_policy: standard_library_only
    role: architecture_checks_generators_and_inspection
    not_server_runtime: true

package_layout:
  decision: ADR-0014
  intended_roots:
    runtime: runtime
    runtime_go_module: runtime
    runtime_command: runtime/cmd/vibit-server
    runtime_app: runtime/internal/app
    runtime_platform: runtime/internal/platform
    runtime_modules: runtime/internal/modules
    runtime_generated: runtime/internal/generated
    runtime_migrations: runtime/migrations/postgres
    packages: packages
    modules: modules
    contracts: contracts
    proto_sources: proto
    tests: tests
  go_module:
    path: github.com/iceiko/vibit/runtime
    location: runtime/go.mod
    status: created
  package_owners:
    runtime/cmd/vibit-server: process_startup_configuration_and_lifecycle
    runtime/internal/app: command_query_dispatch_application_composition_and_transaction_orchestration
    runtime/internal/platform/transport/ws: websocket_transport_adapter
    runtime/internal/platform/protocol/protobuf: protobuf_framing_and_wire_conversion
    runtime/internal/platform/persistence/postgres: postgresql_persistence_adapter
    runtime/internal/platform/migrations: migration_tool_invocation_and_validation
    runtime/internal/platform/events: event_recording_and_publication_mechanisms
    runtime/internal/platform/tx: transaction_boundary_and_unit_of_work
    runtime/internal/modules: handwritten_domain_module_runtime_logic
    runtime/internal/generated/contracts: generated_go_contract_shapes
    runtime/internal/generated/proto: generated_go_protobuf_files
    runtime/migrations/postgres: sql_first_postgresql_migration_sources
    proto: protobuf_source_files
  rules:
    - Public contracts are declared before handwritten behavior.
    - Generated files must be traceable to schemas or manifests.
    - Handwritten module logic lives in explicit extension points.
    - Runtime packages must not hide domain behavior in transport handlers.
    - Third-party transport, protocol, persistence, and migration dependencies stay inside platform or generated owner packages.
    - Domain modules under runtime/internal/modules depend on vibit-owned interfaces and generated contracts, not platform dependencies.

server_instance_model:
  first_model: modular_monolith_single_process
  network_surface:
    gameplay_client_protocol: websocket
    wire_message_format: protobuf
    http_api: later_health_admin_or_dev_tooling_only
    internal_commands: planned
  protocol_rules:
    - WebSocket is the first client gameplay protocol.
    - Protobuf is the first wire message format for client/server messages.
    - The first WebSocket platform adapter uses github.com/coder/websocket.
    - Protobuf generation uses the official Go Protobuf runtime and protoc-gen-go, orchestrated by Buf.
    - Buf Schema Registry is not required by the first runtime dependency decision.
    - HTTP must not become the first gameplay API without a superseding decision.
    - Transport adapters convert wire messages into commands and queries.
    - Domain modules do not own WebSocket connections, Protobuf framing, or third-party network library details.
  boundary_to_contract_model:
    protobuf_role: wire_schema
    manifest_role: business_semantics_source
    consistency_requirement: tooling_must_check_manifest_proto_alignment_before_protocol_surface_grows
  protocol_alignment:
    check_command: node tools/vibit check protocol
    status: active_for_planned_and_existing_proto_sources
    missing_proto_files_allowed_until_generation_starts: true
  protobuf_layout:
    source_root: proto
    module_source_pattern: proto/vibit/<module>/v1
    buf_config: buf.yaml
    buf_generation_config: buf.gen.yaml
    generated_go_output: runtime/internal/generated/proto
    generated_go_output_status: planned_not_created
    source_root_status: skeleton_created
    registry_required_before_broad_generation: true
  boundaries:
    - Modules communicate through commands, queries, events, public module APIs, or generated clients.
    - Transport handlers adapt requests into commands or queries.
    - Domain modules own state and invariants.
    - Platform code owns runtime concerns such as transport, storage adapters, event dispatch, and verification hooks.
  deferred:
    - distributed_actor_runtime
    - multi_process_cluster
    - service_mesh_deployment
    - cloud_orchestration

persistence_model:
  decision: ADR-0011
  status: runtime_readiness_decision
  authoritative_store:
    engine: PostgreSQL
    accepted_driver: github.com/jackc/pgx/v5
    role: first_authoritative_durable_relational_store
    scope:
      - module_owned_state
      - transactional_state_changes
      - invariants_requiring_consistency
      - outbox_or_event_log_when_needed
    not_started: true
  object_storage:
    interface: s3_compatible
    role: planned_large_object_storage_abstraction
    preferred_local_self_hosted_candidate: MinIO
    candidate_status: requires_dependency_adoption_before_required_runtime_dependency
    suitable_for:
      - replay_archives
      - snapshots
      - exports
      - binary_assets
      - large_audit_or_diagnostic_artifacts
    not_suitable_for:
      - authoritative_transactional_domain_state
      - module_invariant_enforcement
  domain_rules:
    - Domain modules must depend on vibit-owned repository or object-store interfaces, not PostgreSQL drivers or S3 SDKs directly.
    - PostgreSQL schema, migrations, repository interfaces, and transaction boundaries must be declared before runtime persistence implementation.
    - The first migration tool is github.com/pressly/goose/v3 with SQL-first migration files.
    - Go migrations require a change spec explaining why SQL is insufficient and must not hide domain business logic.
    - S3-compatible object storage must remain optional until a concrete module or platform capability requires it.
    - MinIO must not become a mandatory runtime dependency without an adoption record covering license, maintenance, operations, and replacement path.
  deferred:
    - outbox_or_event_log_storage_standard
    - first_s3_client_or_sdk
  migration_layout:
    source_root: runtime/migrations/postgres
    default_style: sql_first
    go_migrations_allowed: only_with_change_spec
    status: skeleton_created_no_migrations
  transaction_boundary:
    decision: ADR-0014
    owner: runtime/internal/platform/tx
    orchestrator: runtime/internal/app
    command_rule: State-changing commands run inside an application-owned unit of work.
    query_rule: Queries do not mutate state and do not require a write transaction by default.
    event_rule: Domain events produced by commands are recorded inside the same unit of work.
    publication_rule: Publication outside the transaction is deferred until an event delivery or outbox decision is made.
    outbox_status: deferred_until_cross_boundary_durable_event_delivery

contract_model:
  source_format: vibit_manifest_yaml
  wire_schema_format: protobuf
  source_of_truth:
    business_semantics: vibit_manifests_and_contract_sources
    wire_messages: protobuf_files
    required_alignment: checked_by_tooling
  public_contract_types:
    - commands
    - queries
    - events
    - errors
    - permissions
  generated_outputs:
    - go_typed_contracts
    - protobuf_message_shapes
    - websocket_dispatch_shapes
    - clients_or_call_helpers
    - test_fixtures
  handwritten_outputs:
    - domain_policies
    - command_handlers
    - query_handlers
    - repositories
    - invariant_tests
  generated_file_policy:
    immutable_to_non_system_agents: true
    override_permission: generated_file_override

first_runtime_proof_slice:
  preferred_module: inventory
  planned_runtime_path: runtime/internal/modules/inventory
  planned_generated_contract_path: runtime/internal/generated/contracts/inventory
  planned_proto_source_path: proto/vibit/inventory/v1
  planned_generated_proto_path: runtime/internal/generated/proto
  skeleton_status: created_no_business_logic
  proof_unit: requirement -> spec -> contract -> generated shape -> handwritten logic -> tests -> verification -> docs
  minimum_capabilities:
    - Declare one command, one query, one event, one error, and one permission.
    - Generate the repeatable shape from contracts and manifests.
    - Implement handwritten logic only in declared extension points.
    - Test command behavior, query behavior, emitted events, and invariants.
    - Run architecture, schema, module, and runtime tests from one default verification command.
  non_goals:
    - Build a full game backend.
    - Add AI gameplay features.
    - Optimize distributed performance.
    - Choose an S3 SDK or required object storage deployment.

open_questions:
  - Decide whether the first repository implementation starts with a fake, PostgreSQL, or both.
  - Decide whether outbox storage is required before the first durable cross-boundary event delivery.
  - Decide when the first S3-compatible object storage use case is concrete enough to adopt a client SDK.
