      route_mounting: deferred_to_runtime_process_wiring
      responsibilities:
        - decode_frame_payload_bytes_as_protobuf_envelopes
        - map_envelopes_to_application_route_requests
        - dispatch_command_and_query_requests_through_app_dispatcher
        - map_application_success_results_to_protobuf_envelopes
        - map_application_errors_to_protobuf_error_envelopes
        - return_encoded_protobuf_envelope_bytes_for_transport_write
        - keep_request_loop_test_setup_repeatable_without_transport_dependencies
      non_goals:
        - open_websocket_connections
        - own_websocket_lifecycle
        - change_protocol_envelope_shape
        - authenticate_or_validate_sessions
        - perform_domain_permission_or_invariant_checks
    current_bridges:
      application_errors:
        mapper: runtime/internal/platform/protocol/protobuf/error_envelope.go
        tests: runtime/internal/platform/protocol/protobuf/error_envelope_test.go
        maps_results:
          - app.ApplicationError -> protocolv1.Error
        message_kind: error
        retryability: non_retryable_by_default_until_catalog_driven_mapping_exists
      inventory:
        request_mapper: runtime/internal/platform/protocol/protobuf/inventory_bridge.go
        tests: runtime/internal/platform/protocol/protobuf/inventory_bridge_test.go
        test_fixture: runtime/internal/platform/protocol/protobuf/request_loop_fixture_test.go
        maps_requests:
          - GrantItemRequest -> inventory.GrantItemRequest
          - GetInventoryRequest -> inventory.GetInventoryRequest
        maps_results:
          - inventory.GrantItemResponse -> GrantItemResponse
          - inventory.GetInventoryResponse -> GetInventoryResponse
        maps_events:
          - inventory.ItemGrantedEvent -> ItemGranted
        boundary_rule: Domain and application packages must not import generated Protobuf packages.
  application_dispatch:
    owner: runtime/internal/app
    status: skeleton_created
    route_registration: explicit_handwritten_until_generator_exists
    dispatchable_message_kinds:
      - command
      - query
    non_dispatchable_message_kinds:
      - event
      - error
      - system
      - ack
      - heartbeat
      - input
      - state
    current_errors:
      - INVALID_ROUTE
      - UNSUPPORTED_MESSAGE_KIND
      - ROUTE_ALREADY_REGISTERED
      - ROUTE_NOT_FOUND
      - NIL_HANDLER
    current_boundaries:
      - Application dispatch must not import WebSocket transport dependencies.
      - Application dispatch must not import Protobuf runtime dependencies or generated Protobuf packages.
      - Application dispatch may import the platform transaction boundary package but not other platform adapters.
      - Application dispatch calls vibit-owned handler interfaces.
      - Domain business logic remains outside application dispatch.
      - TransactionalDispatcher opens a unit of work for command routes and passes query routes through by default.
      - Application dispatch owns the future session-validation handoff and request identity context boundary defined by docs/player-identity-session-boundary.md.
    check_rule: runtime.layer_boundary
    tests:
      - runtime/internal/app/dispatch_test.go
      - runtime/internal/app/transactional_dispatch_test.go
  protobuf_layout:
    source_root: proto
    envelope_source: proto/vibit/protocol/v1/envelope.proto
    module_source_pattern: proto/vibit/<module>/v1
    buf_config: buf.yaml
    buf_generation_config: buf.gen.yaml
    generated_go_output: runtime/internal/generated/proto
    generated_go_output_status: generated_proto_created
    generated_output_standard: docs/generated-output.md
    generated_output_decision: ADR-0017
    generated_output_check: node tools/vibit check generated
    generated_file_suffix: .pb.go
    generated_marker: Code generated by protoc-gen-go. DO NOT EDIT.
    source_trace_pattern: // source: <path>.proto
    source_root_status: envelope_inventory_and_player_sources_created
    registry_required_before_broad_generation: true
  boundaries:
    - Modules communicate through commands, queries, events, public module APIs, or generated clients.
    - Transport handlers do not adapt requests into commands or queries directly.
    - Protocol and application composition convert decoded envelopes into commands or queries.
    - Domain modules own state and invariants.
    - Platform code owns runtime concerns such as transport, storage adapters, event dispatch, and verification hooks.
    - Player identity and account lifecycle are planned player module concerns, not inventory, transport, or protocol concerns.
  deferred:
    - distributed_actor_runtime
    - multi_process_cluster
    - service_mesh_deployment
    - cloud_orchestration

