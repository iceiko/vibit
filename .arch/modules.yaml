      zh-CN: modules/storage/AGENTS.zh-CN.md
    boundary:
      standard: docs/storage-objects-repository-boundary.md
      decision: ADR-0112
      implementation_decision: ADR-0113
      runtime_behavior_gate_decision: ADR-0116
      runtime_behavior_implementation_decision: ADR-0117
      protocol_route_gate_decision: ADR-0118
