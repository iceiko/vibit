prototype_candidate_modules:
  - name: inventory
    category: domain
    reason: Proves item ownership, capacity invariants, and event-driven changes.
  - name: storage
    category: domain
    reason: Proves general player-owned small JSON game-state storage with optimistic version conflicts.
  - name: friends
    category: domain
    reason: Future owner candidate for Nakama-first friends relationship social graph vocabulary and storage-neutral repository behavior.
  - name: currency
    category: domain
    reason: Proves transactional balance changes and anti-duplication rules.
  - name: reward
    category: domain
    reason: Proves claim flows, eligibility checks, and cross-module events.
  - name: quest
    category: domain
    reason: Proves progress tracking and event subscriptions.
  - name: match
    category: domain
    reason: Proves session lifecycle and real-time coordination boundaries.

rules:
  - id: module_manifest_required
    level: required
    description: Every implementation module must have modules/<module>/module.yaml.
  - id: module_agent_guide_required
    level: required
    description: Every implementation module must have module-level AGENTS.md and AGENTS.zh-CN.md.
  - id: no_implicit_module_ownership
    level: required
    description: Data, commands, queries, events, and permissions must have explicit owning modules.
  - id: no_unregistered_public_contracts
    level: required
    description: Public commands, queries, events, errors, and permissions must be registered in manifests or schemas.
  - id: generated_files_declared
    level: required
    description: Generated files must be declared so agents know not to hand-edit them.
  - id: player_identity_not_transport_identity
    level: required
    description: Player identity, player account lifecycle, authentication, runtime sessions, transport connections, and request identity context must remain separate concerns as defined by docs/player-identity-session-boundary.md.

module_boundaries:
  - name: player
    status: repository_interface_and_postgres_adapter_implemented_no_handlers
    standard: docs/player-identity-session-boundary.md
    decision: ADR-0021
    manifest: modules/player/module.yaml
    runtime_repository_interface: runtime/internal/modules/player/repository.go
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    postgres_adapter_source_planned: runtime/internal/platform/persistence/postgres/player_account_repository.go
    postgres_adapter_test_planned: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    postgres_adapter_source: runtime/internal/platform/persistence/postgres/player_account_repository.go
    postgres_adapter_test: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    owns:
      - player_identity
      - player_account_lifecycle
    does_not_own:
      - websocket_connection_mechanics
      - inventory_state
      - token_format_before_authentication_decision
      - credential_storage_before_authentication_decision
      - runtime_session_storage_before_session_validation_decision
  - name: storage
    status: repository_interface_implemented_adapter_behavior_deferred
    standard: docs/storage-objects-repository-boundary.md
    decision: ADR-0112
    implementation_decision: ADR-0113
    manifest: modules/storage/module.yaml
    runtime_repository_interface: runtime/internal/modules/storage/repository.go
    runtime_repository_tests: runtime/internal/modules/storage/repository_test.go
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    postgres_adapter_source_planned: runtime/internal/platform/persistence/postgres/storage_object_repository.go
    postgres_adapter_test_planned: runtime/internal/platform/persistence/postgres/storage_object_repository_test.go
