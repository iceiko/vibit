schema_version: 0.1
project: vibit
status: draft
purpose: >
  Registry of first-class modules known to the architecture.
  Implementation modules are not created yet; this file defines the expected
  module registry shape for future prototypes.

module_manifest_standard: docs/module-manifest.md

module_categories:
  domain:
    description: Owns business state, invariants, commands, queries, events, and policies.
  platform:
    description: Provides shared infrastructure behind stable interfaces.
  integration:
    description: Connects external systems through explicit contracts.
  application:
    description: Orchestrates use cases without owning core domain data.

required_module_files:
  - module.yaml
  - AGENTS.md
  - AGENTS.zh-CN.md

expected_module_directories:
  - commands
  - queries
  - events
  - models
  - repositories
  - policies
  - services
  - tests

modules:
  - name: player
    category: domain
    status: draft
    manifest: modules/player/module.yaml
    agent_guides:
      en: modules/player/AGENTS.md
      zh-CN: modules/player/AGENTS.zh-CN.md
    boundary:
      standard: docs/player-identity-session-boundary.md
      decision: ADR-0021
      status: repository_interface_and_postgres_adapter_implemented_no_handlers
      runtime_repository_interface: runtime/internal/modules/player/repository.go
      postgres_adapter_owner: runtime/internal/platform/persistence/postgres
      postgres_adapter_source_planned: runtime/internal/platform/persistence/postgres/player_account_repository.go
      postgres_adapter_test_planned: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
      postgres_adapter_source: runtime/internal/platform/persistence/postgres/player_account_repository.go
      postgres_adapter_test: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    owns:
      - player_identity
      - player_account_lifecycle
    does_not_own:
      - authentication_scheme
      - token_format
      - credential_storage
      - runtime_session_storage
      - websocket_connection_mechanics
      - inventory_state
  - name: inventory
    category: domain
    status: draft
    manifest: modules/inventory/module.yaml
    agent_guides:
      en: modules/inventory/AGENTS.md
      zh-CN: modules/inventory/AGENTS.zh-CN.md
  - name: storage
    category: domain
    status: draft
    manifest: modules/storage/module.yaml
    agent_guides:
      en: modules/storage/AGENTS.md
      zh-CN: modules/storage/AGENTS.zh-CN.md
    boundary:
      standard: docs/storage-objects-repository-boundary.md
      decision: ADR-0112
      implementation_decision: ADR-0113
      runtime_behavior_gate_decision: ADR-0116
      runtime_behavior_implementation_decision: ADR-0117
      protocol_route_gate_decision: ADR-0118
      status: repository_interface_postgresql_adapter_runtime_behavior_protocol_route_implementation_and_local_proof_completed
      runtime_repository_interface: runtime/internal/modules/storage/repository.go
      runtime_repository_tests: runtime/internal/modules/storage/repository_test.go
      postgres_adapter_owner: runtime/internal/platform/persistence/postgres
      postgres_adapter_source: runtime/internal/platform/persistence/postgres/storage_object_repository.go
      postgres_adapter_test: runtime/internal/platform/persistence/postgres/storage_object_repository_test.go
      runtime_behavior_owner: runtime/internal/app/storage
      runtime_behavior_source: runtime/internal/app/storage/service.go
      runtime_behavior_test: runtime/internal/app/storage/service_test.go
      protocol_route_gate_standard: docs/storage-objects-protocol-route-gate.md
      protocol_route_gate_translation: docs/storage-objects-protocol-route-gate.zh-CN.md
      protocol_route_implementation_decision: ADR-0119
      protocol_route_implementation_check_rule: runtime.storage_objects_protocol_route_implementation
      protocol_route_local_proof_decision: ADR-0120
      protocol_route_local_proof_check_rule: runtime.storage_objects_protocol_route_local_proof
      storage_objects_protocol_route_local_proof_completed: true
      storage_objects_protocol_route_local_proof_check_rule: runtime.storage_objects_protocol_route_local_proof
      protocol_source: proto/vibit/storage/v1/storage.proto
      generated_go_output: runtime/internal/generated/proto/vibit/storage/v1/storage.pb.go
      protocol_bridge: runtime/internal/platform/protocol/protobuf/storage_bridge.go
      application_handler: runtime/internal/app/bootstrap/storage.go
      protocol_route_local_proof_test: runtime/internal/platform/protocol/protobuf/authenticated_gameplay_e2e_test.go
      protocol_route_local_proof_script: examples/local-alpha-request-loop.sh
      repository_next_work_item: W-0218
      repository_next_work_item_scope: realtime_protocol_websocket_outbound_delivery_implementation_slice
      realtime_messaging_owned_by_storage: false
    owns:
      - player_owned_small_json_storage_objects
      - storage_object_repository_interface_vocabulary
    does_not_own:
      - websocket_connection_mechanics
      - authentication_scheme
      - token_format
      - credential_storage
      - runtime_session_storage
      - large_object_blob_storage
      - s3_compatible_object_storage
      - direct_nakama_pitaya_api_compatibility

prototype_candidate_modules:
  - name: inventory
    category: domain
    reason: Proves item ownership, capacity invariants, and event-driven changes.
  - name: storage
    category: domain
    reason: Proves general player-owned small JSON game-state storage with optimistic version conflicts.
  - name: currency
    category: domain
    reason: Proves transactional balance changes and anti-duplication rules.
  - name: reward
    category: domain
    reason: Proves claim flows, eligibility checks, and cross-module events.
  - name: quest
    category: domain
    reason: Proves progress tracking and event subscriptions.
  - name: match
    category: domain
    reason: Proves session lifecycle and real-time coordination boundaries.

rules:
  - id: module_manifest_required
    level: required
    description: Every implementation module must have modules/<module>/module.yaml.
  - id: module_agent_guide_required
    level: required
    description: Every implementation module must have module-level AGENTS.md and AGENTS.zh-CN.md.
  - id: no_implicit_module_ownership
    level: required
    description: Data, commands, queries, events, and permissions must have explicit owning modules.
  - id: no_unregistered_public_contracts
    level: required
    description: Public commands, queries, events, errors, and permissions must be registered in manifests or schemas.
  - id: generated_files_declared
    level: required
    description: Generated files must be declared so agents know not to hand-edit them.
  - id: player_identity_not_transport_identity
    level: required
    description: Player identity, player account lifecycle, authentication, runtime sessions, transport connections, and request identity context must remain separate concerns as defined by docs/player-identity-session-boundary.md.

module_boundaries:
  - name: player
    status: repository_interface_and_postgres_adapter_implemented_no_handlers
    standard: docs/player-identity-session-boundary.md
    decision: ADR-0021
    manifest: modules/player/module.yaml
    runtime_repository_interface: runtime/internal/modules/player/repository.go
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    postgres_adapter_source_planned: runtime/internal/platform/persistence/postgres/player_account_repository.go
    postgres_adapter_test_planned: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    postgres_adapter_source: runtime/internal/platform/persistence/postgres/player_account_repository.go
    postgres_adapter_test: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    owns:
      - player_identity
      - player_account_lifecycle
    does_not_own:
      - websocket_connection_mechanics
      - inventory_state
      - token_format_before_authentication_decision
      - credential_storage_before_authentication_decision
      - runtime_session_storage_before_session_validation_decision
  - name: storage
    status: repository_interface_implemented_adapter_behavior_deferred
    standard: docs/storage-objects-repository-boundary.md
    decision: ADR-0112
    implementation_decision: ADR-0113
    manifest: modules/storage/module.yaml
    runtime_repository_interface: runtime/internal/modules/storage/repository.go
    runtime_repository_tests: runtime/internal/modules/storage/repository_test.go
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    postgres_adapter_source_planned: runtime/internal/platform/persistence/postgres/storage_object_repository.go
    postgres_adapter_test_planned: runtime/internal/platform/persistence/postgres/storage_object_repository_test.go
