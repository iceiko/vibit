schema_version: 0.1
project: vibit
status: draft
purpose: >
  Repository-level conventions for agent-native server architecture.

language:
  canonical_documentation: en
  translations:
    required:
      - zh-CN
    rule: Public-facing English documents should have Simplified Chinese human-readable translations.

naming:
  project_name: vibit
  category_name: Agent-Native Server Framework
  repository_description: An agent-native server framework for AI-maintainable backends.
  identifiers:
    default_language: en
    case_rules:
      modules: snake_case
      commands: PascalCase
      queries: PascalCase
      events: PascalCase
      permissions: snake_case
      errors: SCREAMING_SNAKE_CASE
      invariants: snake_case

documentation_pairs:
  constitution:
    canonical: CONSTITUTION.md
    zh-CN: CONSTITUTION.zh-CN.md
  repository_agent_guide:
    canonical: AGENTS.md
    zh-CN: AGENTS.zh-CN.md
  readme:
    canonical: README.md
    zh-CN: README.zh-CN.md
  architecture_readme:
    canonical: .arch/README.md
    zh-CN: .arch/README.zh-CN.md
  module_manifest_standard:
    canonical: docs/module-manifest.md
    zh-CN: docs/module-manifest.zh-CN.md
  change_spec_standard:
    canonical: docs/change-spec.md
    zh-CN: docs/change-spec.zh-CN.md
  changes_readme:
    canonical: changes/README.md
    zh-CN: changes/README.zh-CN.md
  conversation_log_standard:
    canonical: docs/conversation-log.md
    zh-CN: docs/conversation-log.zh-CN.md
  conversations_readme:
    canonical: conversations/README.md
    zh-CN: conversations/README.zh-CN.md
  agent_decision_record_standard:
    canonical: docs/agent-decision-record.md
    zh-CN: docs/agent-decision-record.zh-CN.md
  decisions_readme:
    canonical: decisions/README.md
    zh-CN: decisions/README.zh-CN.md
  schema_validation_standard:
    canonical: docs/schema-validation.md
    zh-CN: docs/schema-validation.zh-CN.md
  dependency_adoption_standard:
    canonical: docs/dependency-adoption.md
    zh-CN: docs/dependency-adoption.zh-CN.md
  game_protocol_standard:
    canonical: docs/game-protocol.md
    zh-CN: docs/game-protocol.zh-CN.md
  generated_output_standard:
    canonical: docs/generated-output.md
    zh-CN: docs/generated-output.zh-CN.md
  agent_tooling_standard:
    canonical: docs/agent-tooling.md
    zh-CN: docs/agent-tooling.zh-CN.md
  runtime_protocol_adapter_standard:
    canonical: docs/runtime-protocol-adapter.md
    zh-CN: docs/runtime-protocol-adapter.zh-CN.md
  reference_alignment_standard:
    canonical: docs/reference-game-server-alignment.md
    zh-CN: docs/reference-game-server-alignment.zh-CN.md
  player_identity_session_boundary_standard:
    canonical: docs/player-identity-session-boundary.md
    zh-CN: docs/player-identity-session-boundary.zh-CN.md
  authentication_token_session_validation_standard:
    canonical: docs/authentication-token-session-validation.md
    zh-CN: docs/authentication-token-session-validation.zh-CN.md
  postgresql_verification_environment_standard:
    canonical: docs/postgresql-verification-environment.md
    zh-CN: docs/postgresql-verification-environment.zh-CN.md

standard_directories:
  architecture: .arch
  contracts: contracts
  documentation: docs
  changes: changes
  conversations: conversations
  decisions: decisions
  modules: modules
  rules: rules
  schemas: schema
  tools: tools

templates:
  change_spec: changes/_template
  conversation_log: conversations/_template/session.md
  agent_decision_record: decisions/_template/adr-agent.md
  dependency_adoption: docs/_templates/dependency-adoption.md

  runtime_readiness:
  manifest: .arch/runtime.yaml
  decisions:
    superseded_language_decision: ADR-0003
    language_and_package_layout: ADR-0008
    server_instance_model: ADR-0004
    contract_and_generation_boundary: ADR-0005
    first_runtime_proof_slice: ADR-0006
    client_protocol_and_wire_format: ADR-0009
    dependency_adoption: ADR-0010
    persistence_direction: ADR-0011
    technical_decision_authority: ADR-0012
    first_go_runtime_dependencies: ADR-0013
    go_runtime_layout_and_boundaries: ADR-0014
    game_protocol_framework: ADR-0015
    protobuf_envelope_and_generation: ADR-0016
    generated_output_standard: ADR-0017
    runtime_protocol_adapter_boundary: ADR-0018
    player_identity_and_session_boundary: ADR-0021
    player_account_postgresql_schema_boundary: ADR-0022
    authentication_token_session_validation_design_boundary: ADR-0023

protocol_framework:
  manifest: .arch/protocol.yaml
  standard: docs/game-protocol.md
  translation: docs/game-protocol.zh-CN.md
  decision: ADR-0015
  envelope_decision: ADR-0016
  envelope_proto: proto/vibit/protocol/v1/envelope.proto
  first_endpoint: /v1/ws
  envelope_model: websocket_framed_protobuf_envelope
  routing_fields:
    - kind
    - module
    - name
  first_slice_scope: player
  authority_model: server_authoritative
  check_command: node tools/vibit check protocol

reference_alignment:
  manifest: .arch/reference.yaml
  standard: docs/reference-game-server-alignment.md
  translation: docs/reference-game-server-alignment.zh-CN.md
  decision: ADR-0019
  active_reference_baselines:
    - Nakama
    - Pitaya
  rule: >
    Nakama and Pitaya guide game server capability planning, but vibit's
    constitution, ADRs, manifests, generated boundaries, and verification
    commands remain authoritative.
  check_command: node tools/vibit check architecture

agent_tooling_standard:
  standard: docs/agent-tooling.md
  translation: docs/agent-tooling.zh-CN.md
  status: draft
  role: agent_facing_inspection_generation_and_verification_surface
  commands:
    inspect_next: node tools/vibit inspect next --json
    inspect_contracts: node tools/vibit inspect contracts --json
    inspect_generated: node tools/vibit inspect generated --json
    inspect_reference: node tools/vibit inspect reference --json
    generate_contract_shapes: node tools/vibit generate contract-shapes all
    check_agent_tooling: node tools/vibit check agent-tooling --json
  rule: >
    Prefer small JSON inspection and reproducible generation commands for
    agent intake. Tooling output does not grant permission to cross ask-first
    boundaries.
  path_rule: >
    Repository-relative paths in JSON tooling output use forward slashes in
    fields such as artifact, path, source, and output on every platform,
    including Windows.

player_identity_session_boundary:
  standard: docs/player-identity-session-boundary.md
  translation: docs/player-identity-session-boundary.zh-CN.md
  decision: ADR-0021
  planned_player_module: modules/player
  current_status: player_account_postgresql_adapter_implemented_without_authentication_or_runtime_handlers
  application_handoff:
    owner: runtime/internal/app
    request_identity_context: RequestIdentity
    session_validation_result: SessionValidationResult
    envelope_metadata_status: metadata_only
  rule: >
    Player identity, account lifecycle, authentication, runtime session,
    transport connection metadata, and request identity context are separate
    concerns. Client-supplied player_id and session_id metadata is not
    authenticated proof until session validation exists.
  ask_first_before:
    - authentication_scheme
    - token_format
    - credential_storage
    - websocket_handshake_authentication_contract
    - protobuf_envelope_change
  player_account_postgresql_schema:
    decision: ADR-0022
    standard: docs/postgresql-persistence-boundary.md
    status: schema_ratified_migration_source_added_repository_interface_and_adapter_implemented_handlers_deferred
    planned_tables:
      - player_accounts
      - player_account_events
    planned_migration_source: runtime/migrations/postgres/000002_create_player_account_state.sql
    migration_source: runtime/migrations/postgres/000002_create_player_account_state.sql
    migration_source_status: added
    repository_interface_source: runtime/internal/modules/player/repository.go
    implementation_status:
      repository_interface_added: true
      postgres_adapter_boundary_defined: true
      authentication_implemented: false
      token_behavior_implemented: false
      credential_storage_implemented: false
      session_persistence_implemented: false
      player_account_persistence_implemented: false

authentication_token_session_validation:
  standard: docs/authentication-token-session-validation.md
  translation: docs/authentication-token-session-validation.zh-CN.md
  decision: ADR-0023
  status: design_standard_boundary_checks_added_without_runtime_implementation
  milestone: M-011
  latest_completed_work_item: W-0058
  next_work_item: W-0059
  change: changes/2026-05-14-add-authentication-token-session-boundary-checks
  conversation: conversations/2026-05-14-authentication-token-session-validation-design-standard.md
  boundary_check_rule: runtime.authentication_token_session_boundary
  boundary_checks_added: true
  check_command: node tools/vibit check runtime
  rule: >
    Authentication proof, login methods, tokens, credentials, external identity
    links, runtime sessions, request identity, WebSocket handshake authentication,
    transport connection metadata, Protobuf envelope metadata, and player account
    lifecycle are separate concerns. Metadata-only player_id and session_id are
    not authenticated proof.
  trust_states:
    - anonymous
    - metadata_only
    - authentication_proven
    - session_validated
    - service_validated
  current_runtime_status:
    metadata_only_validator_exists: true
    production_authentication_implemented: false
    token_behavior_implemented: false
    credential_storage_implemented: false
    external_identity_linking_implemented: false
    session_persistence_implemented: false
    websocket_handshake_authentication_changed: false
    protobuf_envelope_changed: false
    runtime_player_handlers_added: false
    websocket_routes_added: false
  ask_first_before:
    - login_method_choice
    - token_format_or_refresh_behavior
    - credential_storage_or_auth_dependency
    - external_identity_linking
    - session_persistence
    - protobuf_envelope_auth_change
    - websocket_handshake_authentication
    - runtime_player_handlers_or_routes
    - metadata_only_identity_as_production_permission

server_runtime:
  first_reference_language: Go
  package_manager: go_modules
  package_layout_decision: ADR-0014
  go_module:
    root: runtime
    path: github.com/iceiko/vibit/runtime
    status: created
  package_roots:
    command: runtime/cmd/vibit-server
    app: runtime/internal/app
    platform: runtime/internal/platform
    modules: runtime/internal/modules
    generated_contracts: runtime/internal/generated/contracts
    generated_proto: runtime/internal/generated/proto
    postgres_migrations: runtime/migrations/postgres
    proto_sources: proto
  gameplay_client_protocol: websocket
  wire_message_format: protobuf
  protocol_framework_manifest: .arch/protocol.yaml
  protocol_framework_decision: ADR-0015
  runtime_protocol_adapter_standard: docs/runtime-protocol-adapter.md
  runtime_protocol_adapter_decision: ADR-0018
  gameplay_websocket_endpoint: /v1/ws
  accepted_websocket_library: github.com/coder/websocket
  accepted_protobuf_runtime: google.golang.org/protobuf
  accepted_protobuf_generator: google.golang.org/protobuf/cmd/protoc-gen-go
  accepted_protobuf_orchestrator: buf.build CLI
  tooling_cli_language: JavaScript
  tooling_cli_is_server_runtime: false

runtime_protocol_adapter:
  standard: docs/runtime-protocol-adapter.md
  translation: docs/runtime-protocol-adapter.zh-CN.md
  decision: ADR-0018
  check_command: node tools/vibit check runtime
  first_flow:
    - websocket_frame
    - transport_frame
    - protocol_envelope
    - route_request
    - application_dispatch
    - domain_command_or_query_handler
    - application_result
    - protocol_envelope
    - websocket_frame
  owners:
    transport: runtime/internal/platform/transport/ws
    protocol: runtime/internal/platform/protocol/protobuf
    application_dispatch: runtime/internal/app
    domain_modules: runtime/internal/modules/<module>
    generated_contracts: runtime/internal/generated/contracts
    generated_proto: runtime/internal/generated/proto

persistence:
  first_authoritative_store: PostgreSQL
  accepted_postgresql_driver: github.com/jackc/pgx/v5
  accepted_migration_tooling: github.com/pressly/goose/v3
  boundary_standard: docs/postgresql-persistence-boundary.md
  boundary_decision: ADR-0020
  migration_default: SQL-first migrations
  migration_root: runtime/migrations/postgres
  migration_check_command: node tools/vibit check migrations
  migration_root_status: first_inventory_migration_source_created_apply_status_runner_created_live_apply_verified
  migration_naming_pattern: 000001_create_inventory_state.sql
  migration_required_markers:
    - "-- +goose Up"
    - "-- +goose Down"
  transaction_boundary_owner: runtime/internal/platform/tx
  transaction_orchestrator: runtime/internal/app
  transaction_boundary_status: driver_neutral_boundary_created_with_postgresql_runner_adapter
  first_durable_module: inventory
  first_durable_migration_source: runtime/migrations/postgres/000001_create_inventory_state.sql
  first_durable_postgres_adapter: runtime/internal/platform/persistence/postgres/inventory_repository.go
  first_durable_postgres_adapter_status: wired_in_explicit_postgres_runtime_path
  first_durable_postgres_adapter_tests: runtime/internal/platform/persistence/postgres/inventory_repository_test.go
  postgresql_config: runtime/internal/platform/persistence/postgres/config.go
  postgresql_config_status: wired_for_explicit_postgres_runtime_path
  postgresql_config_environment:
    dsn: VIBIT_POSTGRES_DSN
    max_connections: VIBIT_POSTGRES_MAX_CONNS
    min_connections: VIBIT_POSTGRES_MIN_CONNS
  runtime_store_selector: VIBIT_RUNTIME_STORE
  runtime_store_default: memory
  runtime_store_postgres_value: postgres
  postgresql_transaction_runner: runtime/internal/platform/persistence/postgres/runner.go
  postgresql_transaction_runner_status: wired_for_explicit_postgres_runtime_path
  postgresql_transaction_runner_tests: runtime/internal/platform/persistence/postgres/runner_test.go
  postgresql_migration_runner: runtime/internal/platform/migrations/postgres.go
  postgresql_migration_runner_status: created_explicit_invocation_only_not_startup_wired
  postgresql_migration_runner_tests: runtime/internal/platform/migrations/postgres_test.go
  postgresql_migration_runner_rules:
    - caller_supplied_database_sql_handle
    - caller_supplied_migration_source_filesystem_or_directory
    - structured_status_and_apply_results
    - no_normal_startup_side_effects
    - no_caller_owned_database_handle_close
  first_durable_module_lock: GrantItem calls inventory.Repository.LockInventoryForMutation before capacity-sensitive reads and writes; PostgreSQL adapters implement it with an inventory account row lock by player_id.
  first_durable_grant_recording: GrantItemMutation carries event_id, occurred_at, and reason so PostgreSQL adapters can record inventory_item_grants in the same unit of work as quantity changes.
  player_account_schema:
    decision: ADR-0022
    status: schema_ratified_migration_source_added_repository_interface_and_adapter_implemented
    planned_migration_source: runtime/migrations/postgres/000002_create_player_account_state.sql
    migration_source: runtime/migrations/postgres/000002_create_player_account_state.sql
    repository_interface_source: runtime/internal/modules/player/repository.go
    repository_interface_added: true
    postgres_adapter_boundary_defined: true
    postgres_adapter_owner: runtime/internal/platform/persistence/postgres
    postgres_adapter_source_planned: runtime/internal/platform/persistence/postgres/player_account_repository.go
    postgres_adapter_test_planned: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    postgres_adapter_source: runtime/internal/platform/persistence/postgres/player_account_repository.go
    postgres_adapter_test: runtime/internal/platform/persistence/postgres/player_account_repository_test.go
    postgres_adapter_constructor_planned: NewPlayerAccountRepositoryForUnitOfWork
    postgres_adapter_constructor: NewPlayerAccountRepositoryForUnitOfWork
    postgres_unit_of_work_factory_planned: UnitOfWork.NewPlayerAccountRepository
    postgres_unit_of_work_factory: UnitOfWork.NewPlayerAccountRepository
    postgres_adapter_transaction_rule: caller_supplied_unit_of_work_executor_no_begin_commit_or_rollback
    postgres_adapter_sql_scope:
      - insert_player_accounts
      - insert_player_account_events_for_PlayerAccountCreated
      - read_player_accounts_current_lifecycle_row
    postgres_adapter_added: true
    planned_tables:
      - player_accounts
      - player_account_events
    forbidden_in_player_account_schema:
      - authentication_credentials
      - password_hashes
      - external_identity_links
      - access_tokens
      - refresh_tokens
      - runtime_sessions
      - websocket_connection_state
      - inventory_state
  postgresql_verification_environment:
    standard: docs/postgresql-verification-environment.md
    translation: docs/postgresql-verification-environment.zh-CN.md
    check_command: node tools/vibit check postgres-env
    status: opt_in_test_created_live_execution_verified
    opt_in_live_test: runtime/internal/platform/protocol/protobuf/postgres_request_loop_integration_test.go
    opt_in_live_command: cd runtime && VIBIT_POSTGRES_TEST_DSN='...' VIBIT_POSTGRES_TEST_ALLOW_DESTRUCTIVE=1 go test ./internal/platform/protocol/protobuf -run TestPostgresPersistentInventoryRequestLoop -v
    required_for_live_checks:
      dsn: VIBIT_POSTGRES_TEST_DSN
    optional_inputs:
      database: VIBIT_POSTGRES_TEST_DATABASE
      cleanup: VIBIT_POSTGRES_TEST_CLEANUP
      allow_destructive: VIBIT_POSTGRES_TEST_ALLOW_DESTRUCTIVE
    default_cleanup: drop_schema
    first_live_test_cleanup_mode: drop_schema
    allowed_cleanup_modes:
      - drop_schema
      - truncate
      - keep
    default_live_check_behavior: skip_when_test_dsn_unset
    mandatory_service_manager: none
    cloud_postgresql_assumption: false
  live_postgresql_integration_status: opt_in_test_created_live_execution_verified
  object_storage_interface: s3_compatible
  object_storage_candidate: MinIO
  object_storage_candidate_status: requires_dependency_adoption_before_required_runtime_dependency
  decision: ADR-0011
  module_dependency_rule: Domain modules use vibit-owned storage interfaces rather than PostgreSQL drivers, S3 SDKs, or MinIO clients directly.

contracts:
  registry: .arch/contracts.yaml
  source_root: contracts
  source_format: vibit_manifest_yaml
  source_format_decision: ADR-0007
  wire_schema_root: proto
  wire_schema_format: protobuf
  wire_schema_decision: ADR-0009
  wire_schema_generation:
    buf_config: buf.yaml
    buf_generation_config: buf.gen.yaml
    generated_go_output: runtime/internal/generated/proto
  protocol_alignment_check: node tools/vibit check protocol
  protocol_alignment_status: active_planned_missing_allowed
  source_of_truth:
    business_semantics: contracts
    wire_messages: proto
  contract_types:
    - commands
    - queries
    - events
    - errors
    - permissions

generated_file_policy:
  standard: docs/generated-output.md
  translation: docs/generated-output.zh-CN.md
  decision: ADR-0017
  immutable_to_non_system_agents: true
  override_permission: generated_file_override
  override_requires:
    - change_spec
    - agent_decision_record
  generated_roots:
    contracts: runtime/internal/generated/contracts
    protobuf: runtime/internal/generated/proto
  protobuf_output:
    source_root: proto
    configuration:
      - buf.yaml
      - buf.gen.yaml
    output_root: runtime/internal/generated/proto
    allowed_generated_suffix: .pb.go
    placeholder_file: .gitkeep
    required_marker: Code generated by protoc-gen-go. DO NOT EDIT.
    required_source_trace: // source: <path>.proto
    check_command: node tools/vibit check generated

schemas:
  module_manifest: schema/module-manifest.schema.json
  change_spec: schema/change-spec.schema.json
  agent_decision_record: schema/agent-decision-record.schema.json
  inspect_output: schema/inspect-output.schema.json
  rule_catalog: schema/rule-catalog.schema.json

rule_catalogs:
  check_rules: rules/check-rules.json

dependency_adoption:
  registry: .arch/dependencies.yaml
  standard: docs/dependency-adoption.md
  template: docs/_templates/dependency-adoption.md
  governing_decision: ADR-0010
  technical_decision_authority: ADR-0012
  first_runtime_adoption_record: ADR-0013

agent_decision_authority:
  delegated_technical_decisions: ADR-0012
  rule: Agents may professionally evaluate and decide technical sub-decisions after maintainer authorization, while ask-first categories remain maintainer-owned.

change_workflow:
  required_steps:
    - requirement
    - impact_analysis
    - plan
    - contract_update
    - generation
    - implementation
    - verification
    - documentation_update
  verification_record_values:
    - Verified
    - Not verified
    - Not applicable

agent_rules:
  always:
    - Read the constitution and repository AGENTS.md before non-trivial changes.
    - Keep edits bounded to the declared change.
    - Update English and Simplified Chinese public docs together.
    - Record verification status.
  ask_first:
    - Change constitutional principles.
    - Ratify or replace the project name.
    - Introduce a major architecture pattern.
    - Make breaking public contract changes.
    - Move data ownership between modules.
    - Accept licensing-risk, hosting, cost, operations, or vendor-lock-in commitments.
    - Change server runtime language, primary protocol direction, persistence direction, or core project thesis.
  never:
    - Claim verification was run when it was not.
    - Bypass module boundaries for convenience.
    - Add unregistered public events or permissions.
    - Hand-edit generated files without documenting why.
