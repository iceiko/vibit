    mandatory_service_manager: none
    cloud_postgresql_assumption: false
  live_postgresql_integration_status: opt_in_test_created_live_execution_verified
  object_storage_interface: s3_compatible
  object_storage_candidate: MinIO
  object_storage_candidate_status: requires_dependency_adoption_before_required_runtime_dependency
  decision: ADR-0011
  module_dependency_rule: Domain modules use vibit-owned storage interfaces rather than PostgreSQL drivers, S3 SDKs, or MinIO clients directly.

contracts:
  registry: .arch/contracts.yaml
  source_root: contracts
  source_format: vibit_manifest_yaml
  source_format_decision: ADR-0007
  wire_schema_root: proto
  wire_schema_format: protobuf
  wire_schema_decision: ADR-0009
  wire_schema_generation:
    buf_config: buf.yaml
    buf_generation_config: buf.gen.yaml
    generated_go_output: runtime/internal/generated/proto
  protocol_alignment_check: node tools/vibit check protocol
  protocol_alignment_status: active_planned_missing_allowed
  source_of_truth:
    business_semantics: contracts
    wire_messages: proto
  contract_types:
    - commands
    - queries
    - events
    - errors
    - permissions

generated_file_policy:
  standard: docs/generated-output.md
  translation: docs/generated-output.zh-CN.md
  decision: ADR-0017
  immutable_to_non_system_agents: true
  override_permission: generated_file_override
  override_requires:
    - change_spec
    - agent_decision_record
  generated_roots:
    contracts: runtime/internal/generated/contracts
    protobuf: runtime/internal/generated/proto
  protobuf_output:
    source_root: proto
    configuration:
      - buf.yaml
      - buf.gen.yaml
    output_root: runtime/internal/generated/proto
    allowed_generated_suffix: .pb.go
    placeholder_file: .gitkeep
    required_marker: Code generated by protoc-gen-go. DO NOT EDIT.
    required_source_trace: // source: <path>.proto
    check_command: node tools/vibit check generated

schemas:
  module_manifest: schema/module-manifest.schema.json
  change_spec: schema/change-spec.schema.json
  agent_decision_record: schema/agent-decision-record.schema.json
  inspect_output: schema/inspect-output.schema.json
  rule_catalog: schema/rule-catalog.schema.json

rule_catalogs:
  check_rules: rules/check-rules.json

dependency_adoption:
  registry: .arch/dependencies.yaml
  standard: docs/dependency-adoption.md
  template: docs/_templates/dependency-adoption.md
  governing_decision: ADR-0010
  technical_decision_authority: ADR-0012
  first_runtime_adoption_record: ADR-0013

agent_decision_authority:
  delegated_technical_decisions: ADR-0012
  rule: Agents may professionally evaluate and decide technical sub-decisions after maintainer authorization, while ask-first categories remain maintainer-owned.

change_workflow:
  required_steps:
    - requirement
    - impact_analysis
    - plan
    - contract_update
    - generation
    - implementation
    - verification
    - documentation_update
  verification_record_values:
    - Verified
    - Not verified
    - Not applicable

agent_rules:
  always:
    - Read the constitution and repository AGENTS.md before non-trivial changes.
    - Keep edits bounded to the declared change.
    - Update English and Simplified Chinese public docs together.
    - Record verification status.
  ask_first:
    - Change constitutional principles.
    - Ratify or replace the project name.
    - Introduce a major architecture pattern.
    - Make breaking public contract changes.
    - Move data ownership between modules.
    - Accept licensing-risk, hosting, cost, operations, or vendor-lock-in commitments.
    - Change server runtime language, primary protocol direction, persistence direction, or core project thesis.
  never:
    - Claim verification was run when it was not.
    - Bypass module boundaries for convenience.
    - Add unregistered public events or permissions.
    - Hand-edit generated files without documenting why.
