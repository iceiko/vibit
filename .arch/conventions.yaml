    opt_in_live_command: cd runtime && VIBIT_POSTGRES_TEST_DSN='...' VIBIT_POSTGRES_TEST_ALLOW_DESTRUCTIVE=1 go test ./internal/platform/protocol/protobuf -run TestPostgresPersistentInventoryRequestLoop -v
