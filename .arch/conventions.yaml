  decision: ADR-0024
  first_login_method_set_decision: ADR-0025
  first_token_format_proof_carrier_posture_decision: ADR-0026
  token_lifecycle_storage_implications_decision: ADR-0027
  authentication_contract_error_permission_surfaces_decision: ADR-0028
  credential_token_session_schema_gates_decision: ADR-0029
