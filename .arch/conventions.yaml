standard_directories:
  architecture: .arch
  contracts: contracts
  documentation: docs
  changes: changes
  conversations: conversations
  decisions: decisions
  modules: modules
  rules: rules
  schemas: schema
  tools: tools

templates:
  change_spec: changes/_template
  conversation_log: conversations/_template/session.md
  agent_decision_record: decisions/_template/adr-agent.md
  dependency_adoption: docs/_templates/dependency-adoption.md

  runtime_readiness:
  manifest: .arch/runtime.yaml
  decisions:
    superseded_language_decision: ADR-0003
    language_and_package_layout: ADR-0008
    server_instance_model: ADR-0004
    contract_and_generation_boundary: ADR-0005
    first_runtime_proof_slice: ADR-0006
    client_protocol_and_wire_format: ADR-0009
    dependency_adoption: ADR-0010
    persistence_direction: ADR-0011
    technical_decision_authority: ADR-0012
    first_go_runtime_dependencies: ADR-0013
    go_runtime_layout_and_boundaries: ADR-0014
    game_protocol_framework: ADR-0015
    protobuf_envelope_and_generation: ADR-0016
    generated_output_standard: ADR-0017
    runtime_protocol_adapter_boundary: ADR-0018
    player_identity_and_session_boundary: ADR-0021
    player_account_postgresql_schema_boundary: ADR-0022
    authentication_token_session_validation_design_boundary: ADR-0023
    login_method_token_format_ratification_boundary: ADR-0024
    first_token_format_proof_carrier_posture: ADR-0026

protocol_framework:
  manifest: .arch/protocol.yaml
  standard: docs/game-protocol.md
  translation: docs/game-protocol.zh-CN.md
  decision: ADR-0015
  envelope_decision: ADR-0016
  envelope_proto: proto/vibit/protocol/v1/envelope.proto
  first_endpoint: /v1/ws
  envelope_model: websocket_framed_protobuf_envelope
  routing_fields:
    - kind
    - module
    - name
  first_slice_scope: player
  authority_model: server_authoritative
  check_command: node tools/vibit check protocol

reference_alignment:
  manifest: .arch/reference.yaml
  standard: docs/reference-game-server-alignment.md
  translation: docs/reference-game-server-alignment.zh-CN.md
  decision: ADR-0019
  active_reference_baselines:
    - Nakama
    - Pitaya
  rule: >
    Nakama and Pitaya guide game server capability planning, but vibit's
    constitution, ADRs, manifests, generated boundaries, and verification
    commands remain authoritative.
  check_command: node tools/vibit check architecture

agent_tooling_standard:
  standard: docs/agent-tooling.md
  translation: docs/agent-tooling.zh-CN.md
  status: draft
  role: agent_facing_inspection_generation_and_verification_surface
  commands:
    inspect_next: node tools/vibit inspect next --json
    inspect_contracts: node tools/vibit inspect contracts --json
    inspect_generated: node tools/vibit inspect generated --json
    inspect_reference: node tools/vibit inspect reference --json
    generate_contract_shapes: node tools/vibit generate contract-shapes all
    check_agent_tooling: node tools/vibit check agent-tooling --json
  rule: >
    Prefer small JSON inspection and reproducible generation commands for
    agent intake. Tooling output does not grant permission to cross ask-first
    boundaries.
  path_rule: >
    Repository-relative paths in JSON tooling output use forward slashes in
    fields such as artifact, path, source, and output on every platform,
    including Windows.

player_identity_session_boundary:
  standard: docs/player-identity-session-boundary.md
  translation: docs/player-identity-session-boundary.zh-CN.md
  decision: ADR-0021
  planned_player_module: modules/player
  current_status: player_account_postgresql_adapter_implemented_without_authentication_or_runtime_handlers
  application_handoff:
    owner: runtime/internal/app
    request_identity_context: RequestIdentity
    session_validation_result: SessionValidationResult
    envelope_metadata_status: metadata_only
  rule: >
    Player identity, account lifecycle, authentication, runtime session,
    transport connection metadata, and request identity context are separate
    concerns. Client-supplied player_id and session_id metadata is not
    authenticated proof until session validation exists.
  ask_first_before:
    - authentication_scheme
    - token_format
    - credential_storage
    - websocket_handshake_authentication_contract
    - protobuf_envelope_change
  player_account_postgresql_schema:
    decision: ADR-0022
    standard: docs/postgresql-persistence-boundary.md
    status: schema_ratified_migration_source_added_repository_interface_and_adapter_implemented_handlers_deferred
    planned_tables:
      - player_accounts
      - player_account_events
    planned_migration_source: runtime/migrations/postgres/000002_create_player_account_state.sql
    migration_source: runtime/migrations/postgres/000002_create_player_account_state.sql
    migration_source_status: added
    repository_interface_source: runtime/internal/modules/player/repository.go
    implementation_status:
      repository_interface_added: true
      postgres_adapter_boundary_defined: true
      authentication_implemented: false
      token_behavior_implemented: false
      credential_storage_implemented: false
      session_persistence_implemented: false
      player_account_persistence_implemented: false

authentication_token_session_validation:
  standard: docs/authentication-token-session-validation.md
  translation: docs/authentication-token-session-validation.zh-CN.md
  contract_dimensions_standard: docs/authentication-proof-token-session-contract-dimensions.md
  contract_dimensions_translation: docs/authentication-proof-token-session-contract-dimensions.zh-CN.md
  credential_external_identity_boundaries_standard: docs/credential-storage-external-identity-linking-boundaries.md
  credential_external_identity_boundaries_translation: docs/credential-storage-external-identity-linking-boundaries.zh-CN.md
  session_persistence_websocket_handshake_decision_gates_standard: docs/session-persistence-websocket-handshake-decision-gates.md
  session_persistence_websocket_handshake_decision_gates_translation: docs/session-persistence-websocket-handshake-decision-gates.zh-CN.md
  decision: ADR-0023
  status: design_milestone_completed_runtime_implementation_deferred_confirmation_gate_active
  milestone: M-011
  latest_completed_work_item: W-0062
  completed_direction_gate: M-012
  selected_next_direction: login_method_and_token_format_ratification
  active_next_milestone: M-013
  next_work_item: W-0064
  change: changes/2026-05-14-define-session-persistence-websocket-handshake-decision-gates
  milestone_close_change: changes/2026-05-14-close-authentication-token-session-validation-design-milestone
  post_design_direction_change: changes/2026-05-14-confirm-next-direction-after-authentication-design
  contract_dimensions_change: changes/2026-05-14-ratify-authentication-proof-token-session-contract-dimensions
  credential_external_identity_boundaries_change: changes/2026-05-14-define-credential-storage-external-identity-linking-boundaries
  session_persistence_websocket_handshake_decision_gates_change: changes/2026-05-14-define-session-persistence-websocket-handshake-decision-gates
  conversation: conversations/2026-05-14-authentication-token-session-validation-design-standard.md
  boundary_check_rule: runtime.authentication_token_session_boundary
  boundary_checks_added: true
  check_command: node tools/vibit check runtime
  rule: >
    Authentication proof, login methods, tokens, credentials, external identity
    links, runtime sessions, request identity, WebSocket handshake authentication,
    transport connection metadata, Protobuf envelope metadata, and player account
    lifecycle are separate concerns. Metadata-only player_id and session_id are
    not authenticated proof.
  trust_states:
    - anonymous
    - metadata_only
    - authentication_proven
    - session_validated
    - service_validated
  contract_dimensions:
    actor_kinds:
      - unknown
      - anonymous
      - player
      - service
      - admin
    validation_statuses:
      - unknown
      - anonymous
      - metadata_only
      - authentication_proven
      - session_validated
      - service_validated
      - rejected
    proof_statuses:
      - not_present
      - present_unverified
      - proven
      - rejected
      - expired
      - revoked
      - unsupported
      - unavailable
    failure_classes:
      - missing_proof
      - malformed_proof
      - unsupported_proof
      - invalid_proof
      - expired_proof
      - revoked_proof
      - session_not_found
      - session_expired
      - session_revoked
      - actor_disabled
      - permission_denied
      - validator_unavailable
      - not_implemented
    request_identity_handoff_owner: runtime/internal/app
    metadata_only_is_production_permission_basis: false
  credential_external_identity_boundaries:
    credential_storage_boundary_defined: true
    external_identity_linking_boundary_defined: true
    credential_storage_implemented: false
    external_identity_linking_implemented: false
    credential_tables_added: false
    external_identity_tables_added: false
    login_methods_selected: false
    provider_dependencies_added: false
    player_account_lifecycle_tables_remain_credential_free: true
    player_account_lifecycle_tables_remain_provider_subject_free: true
    nakama_login_method_coverage: deferred_capability_families
    pitaya_session_binding_vocabulary: adopted_as_vocabulary_without_api_compatibility
  session_persistence_websocket_handshake_decision_gates:
    decision_gates_defined: true
    validation_model_selected: false
    request_level_validation_selected: false
    first_message_validation_selected: false
    handshake_level_validation_selected: false
    every_request_validation_selected: false
    hybrid_validation_selected: false
    session_store_selected: false
    session_tables_added: false
    token_session_carrier_selected: false
    reconnect_behavior_selected: false
    connection_epoch_behavior_selected: false
    websocket_handshake_authentication_implemented: false
    websocket_transport_remains_credential_neutral: true
    current_envelope_session_fields_remain_metadata_only: true
  current_runtime_status:
    metadata_only_validator_exists: true
    production_authentication_implemented: false
    token_behavior_implemented: false
    credential_storage_implemented: false
    external_identity_linking_implemented: false
    session_persistence_implemented: false
    websocket_handshake_authentication_changed: false
    protobuf_envelope_changed: false
    runtime_player_handlers_added: false
    websocket_routes_added: false
  ask_first_before:
    - login_method_choice
    - token_format_or_refresh_behavior
    - credential_storage_or_auth_dependency
    - external_identity_linking
    - session_persistence
    - protobuf_envelope_auth_change
    - websocket_handshake_authentication
    - runtime_player_handlers_or_routes
    - metadata_only_identity_as_production_permission

login_method_token_format_ratification:
  standard: docs/login-method-token-format-ratification.md
  translation: docs/login-method-token-format-ratification.zh-CN.md
  first_login_method_candidates_standard: docs/first-login-method-candidates.md
  first_login_method_candidates_translation: docs/first-login-method-candidates.zh-CN.md
  first_login_method_set_standard: docs/first-login-method-set.md
  first_login_method_set_translation: docs/first-login-method-set.zh-CN.md
  token_format_carrier_options_standard: docs/token-format-carrier-options.md
  token_format_carrier_options_translation: docs/token-format-carrier-options.zh-CN.md
  first_token_format_proof_carrier_posture_standard: docs/first-token-format-proof-carrier-posture.md
  first_token_format_proof_carrier_posture_translation: docs/first-token-format-proof-carrier-posture.zh-CN.md
  decision: ADR-0024
  first_login_method_set_decision: ADR-0025
  first_token_format_proof_carrier_posture_decision: ADR-0026
  status: first_token_format_proof_carrier_ratified_implementation_deferred
  milestone: M-013
  latest_completed_work_item: W-0068
  next_work_item: W-0069
  change: changes/2026-05-14-define-login-method-token-format-ratification-standard
  first_login_method_candidates_change: changes/2026-05-14-compare-first-login-method-candidates
  first_login_method_set_change: changes/2026-05-14-ratify-first-login-method-set
  token_format_carrier_options_change: changes/2026-05-14-compare-token-format-and-carrier-options
  first_token_format_proof_carrier_posture_change: changes/2026-05-14-ratify-first-token-format-and-proof-carrier-posture
  conversation: conversations/2026-05-14-login-method-token-format-ratification-standard.md
  first_login_method_candidates_conversation: conversations/2026-05-14-first-login-method-candidate-comparison.md
  first_login_method_set_conversation: conversations/2026-05-14-first-login-method-set-ratification.md
  token_format_carrier_options_conversation: conversations/2026-05-14-token-format-carrier-comparison.md
  first_token_format_proof_carrier_posture_conversation: conversations/2026-05-14-first-token-format-proof-carrier-ratification.md
  rule: >
    First login methods, token model, proof carrier posture, token lifecycle,
    storage implications, and implementation gates must be ratified before
    runtime authentication code, token parsing, credential storage, external
    identity linking, session persistence, Protobuf envelope changes,
    WebSocket handshake authentication, runtime player handlers, or WebSocket
    routes are added.
  reference_alignment:
    nakama:
      authentication_methods: capability_coverage_reference
      session_tokens_refresh_logout_expiration: token_lifecycle_reference
      direct_public_api_compatibility: rejected_for_now
    pitaya:
      session_binding: vocabulary_reference
      handler_session_context: vocabulary_reference
      direct_public_api_compatibility: rejected_for_now
  first_login_method_candidates:
    recommendation_status: recommended_not_ratified
    recommended_first_login_method_set:
      - device_credential_login
    deferred_login_method_families:
      - guest_anonymous_login
      - custom_id_login
      - email_password_login
      - external_provider_login
      - service_authentication
    recommended_first_carrier_posture: login_command_payload_before_normal_gameplay_routes
    nakama_mapping: device_style_low_friction_login_adapted_without_public_api_compatibility
    pitaya_mapping: session_binding_vocabulary_adapted_without_transport_authentication
    credential_posture: high_entropy_secret_proof_material_not_raw_os_device_id
    implementation_authorized: false
  first_login_method_set:
    status: ratified
    selected:
      - device_credential_login
    production_classification: production_capable_after_required_gates
    credential_posture: high_entropy_installation_secret_not_raw_device_id
    creates_player_account: allowed_after_account_creation_policy
    authenticates_existing_account: allowed_after_credential_lookup_policy
    links_existing_account: deferred
    recovers_account: deferred
    upgrades_anonymous_account: deferred
    rejected:
      - guest_anonymous_login
      - custom_id_login
      - email_password_login
      - external_provider_login
      - service_authentication
      - metadata_only_player_id_or_session_id
    implementation_authorized: false
  token_format_carrier_options:
    recommendation_status: recommended_not_ratified
    recommended_first_token_format: opaque_high_entropy_token
    recommended_token_issuance_carrier: login_command_response_token
    recommended_request_proof_carrier: explicit_request_proof_payload
    refresh_token: deferred
    session_token_vocabulary: deferred_until_session_persistence
    protobuf_envelope_change: false
    websocket_handshake_authentication_change: false
    current_session_metadata_as_proof: false
    rejected:
      - plain_session_id_as_secret
      - current_session_metadata_as_proof
    deferred:
      - signed_structured_token
      - external_provider_token
      - protobuf_envelope_extension
      - first_system_message_binding
      - websocket_handshake_carrier
    implementation_authorized: false
  first_token_format_proof_carrier_posture:
    status: ratified
    first_access_token_format: opaque_high_entropy_token
    token_issuance_carrier: login_command_response_token
    request_proof_carrier: explicit_request_proof_payload
    issuer: future_application_owned_authentication_boundary
    verifier: future_application_owned_token_validator_before_domain_dispatch
    subject: player_account_id_after_credential_and_account_policy_success
    audience: vibit_gameplay_runtime_requests
    expiration: required_finite_expiration_exact_policy_deferred_to_W_0069
    refresh_token: deferred
    revocation: required_capability_policy_deferred_to_W_0069
    rotation: required_for_new_issuance_policy_deferred_to_W_0069
    replay: bearer_token_risk_must_be_controlled_by_lifecycle_policy
    redaction: raw_token_secret_redacted_everywhere_except_client_presentation
    storage: lookup_safe_hash_or_equivalent_non_plaintext_verifier_required_before_implementation
    session_token_vocabulary: deferred_until_session_persistence
    protobuf_envelope_change: false
    websocket_handshake_authentication_change: false
    current_session_metadata_as_proof: false
    first_system_message_binding: deferred
    implementation_authorized: false
  implementation_status:
    login_methods_selected: true
    first_login_method_recommended: true
    first_login_method_set_ratified: true
    token_format_selected: true
    first_token_format_recommended: true
    first_token_format_ratified: true
    token_carrier_selected: true
    first_token_carrier_recommended: true
    first_token_carrier_ratified: true
    token_lifecycle_selected: false
    credential_storage_implemented: false
    external_identity_linking_implemented: false
    session_persistence_implemented: false
    protobuf_envelope_changed: false
    websocket_handshake_authentication_changed: false
    runtime_authentication_implemented: false
    runtime_player_handlers_added: false
    websocket_routes_added: false
  next_steps:
    - compare_first_login_method_candidates
    - ratify_first_login_method_set
    - compare_token_format_and_carrier_options
    - ratify_first_token_format_and_carrier_posture
    - define_token_lifecycle_and_storage_implications
    - define_authentication_contract_error_permission_surfaces
    - define_credential_token_session_schema_gates
    - add_selected_login_token_boundary_checks
    - close_login_token_ratification_milestone

server_runtime:
  first_reference_language: Go
  package_manager: go_modules
  package_layout_decision: ADR-0014
  go_module:
    root: runtime
    path: github.com/iceiko/vibit/runtime
    status: created
  package_roots:
    command: runtime/cmd/vibit-server
    app: runtime/internal/app
    platform: runtime/internal/platform
    modules: runtime/internal/modules
    generated_contracts: runtime/internal/generated/contracts
    generated_proto: runtime/internal/generated/proto
    postgres_migrations: runtime/migrations/postgres
    proto_sources: proto
  gameplay_client_protocol: websocket
  wire_message_format: protobuf
  protocol_framework_manifest: .arch/protocol.yaml
  protocol_framework_decision: ADR-0015
  runtime_protocol_adapter_standard: docs/runtime-protocol-adapter.md
  runtime_protocol_adapter_decision: ADR-0018
  gameplay_websocket_endpoint: /v1/ws
  accepted_websocket_library: github.com/coder/websocket
  accepted_protobuf_runtime: google.golang.org/protobuf
  accepted_protobuf_generator: google.golang.org/protobuf/cmd/protoc-gen-go
  accepted_protobuf_orchestrator: buf.build CLI
  tooling_cli_language: JavaScript
  tooling_cli_is_server_runtime: false

runtime_protocol_adapter:
  standard: docs/runtime-protocol-adapter.md
  translation: docs/runtime-protocol-adapter.zh-CN.md
  decision: ADR-0018
  check_command: node tools/vibit check runtime
  first_flow:
    - websocket_frame
    - transport_frame
    - protocol_envelope
    - route_request
    - application_dispatch
    - domain_command_or_query_handler
    - application_result
    - protocol_envelope
    - websocket_frame
  owners:
    transport: runtime/internal/platform/transport/ws
    protocol: runtime/internal/platform/protocol/protobuf
    application_dispatch: runtime/internal/app
    domain_modules: runtime/internal/modules/<module>
    generated_contracts: runtime/internal/generated/contracts
    generated_proto: runtime/internal/generated/proto

persistence:
  first_authoritative_store: PostgreSQL
  accepted_postgresql_driver: github.com/jackc/pgx/v5
  accepted_migration_tooling: github.com/pressly/goose/v3
  boundary_standard: docs/postgresql-persistence-boundary.md
  boundary_decision: ADR-0020
  migration_default: SQL-first migrations
  migration_root: runtime/migrations/postgres
  migration_check_command: node tools/vibit check migrations
  migration_root_status: first_inventory_migration_source_created_apply_status_runner_created_live_apply_verified
