schema_version: 0.1
project: vibit
status: draft
purpose: >
  Machine-readable reference alignment manifest for game server capability
  planning. This manifest records external reference projects that agents
  should consult when planning modules, runtime subsystems, and roadmap scope.

standard: docs/reference-game-server-alignment.md
translation: docs/reference-game-server-alignment.zh-CN.md
decision: ADR-0019
product_parity_roadmap:
  status: ratified
  standard: docs/nakama-pitaya-product-parity-roadmap.md
  translation: docs/nakama-pitaya-product-parity-roadmap.zh-CN.md
  decision: ADR-0078
  check_rule: runtime.reference_product_parity_roadmap
  completed_work_item: W-0168
  selected_direction: expand_core_game_backend_modules_after_nakama_pitaya_review
  parity_goal: nakama_pitaya_same_class_common_capability_coverage
  api_compatibility_goal: false
  direct_nakama_pitaya_api_compatibility_added: false
  implementation_authorized_by_this_standard: roadmap_only
  current_near_term_priority: protocol_logout_and_connection_lifecycle
  recommended_next_direction: define_protocol_logout_route_gate

parity_capability_families:
  - identity_authentication_sessions
  - connection_lifecycle_reconnect_logout
  - storage_objects_and_durable_game_state
  - presence_status_and_notifications
  - chat_streams_and_realtime_messaging
  - friends_groups_and_parties
  - leaderboards_tournaments_and_competitive_systems
  - economy_inventory_rewards_currencies_and_progression
  - matchmaking_match_listing_and_room_lifecycle
  - realtime_multiplayer_and_authoritative_match_runtime
  - server_runtime_hooks_rpc_and_custom_logic
  - admin_console_metrics_observability_and_operations
  - client_sdks_examples_and_developer_experience
  - distributed_runtime_frontend_backend_rpc_and_service_discovery

reference_projects:
  - name: Nakama
    role: broad_game_backend_capability_surface
    homepage: https://heroiclabs.com/nakama
    documentation: https://heroiclabs.com/docs/
    repository: https://github.com/heroiclabs/nakama
    use_for:
      - authentication_users_accounts_sessions
      - social_friends_groups_parties_chat
      - storage_objects_and_custom_server_logic
      - matchmaker_realtime_multiplayer_authoritative_matches
      - leaderboards_tournaments_competitive_systems
      - dashboard_metrics_operations
      - economy_rewards_currencies_liveops_capability_families
    not_governing:
      - public_api_shape
      - runtime_module_layout
      - generated_file_conventions
      - agent_workflow
  - name: Pitaya
    role: go_game_server_framework_architecture_vocabulary
    documentation: https://pitaya.readthedocs.io/
    repository: https://github.com/topfreegames/pitaya
    use_for:
      - websocket_tcp_acceptors
      - session_binding
      - route_handler_model
      - frontend_backend_server_roles
      - rpc_and_remote_calls
      - groups_rooms_broadcast
      - cluster_service_discovery_vocabulary
    not_governing:
      - first_runtime_instance_model
      - immediate_distributed_architecture
      - public_api_shape
      - agent_workflow

vibit_differentiators:
  - agent_native_maintainability
  - explicit_module_ownership
  - contract_first_public_behavior
  - generated_repeatable_structure
  - machine_readable_manifests
  - architecture_checks
  - durable_change_specs_conversation_logs_and_adrs

capability_families:
  foundational:
    - player_identity
    - authentication
    - sessions
    - permissions
    - durable_storage
  metagame:
    - inventory
    - currency_wallet
    - rewards_claims
    - quests_tasks
    - leaderboards
    - tournaments
  social_realtime:
    - friends
    - groups
    - parties
    - chat
    - presence
    - status
  multiplayer:
    - matchmaking
    - match_session_lifecycle
    - rooms
    - broadcast_groups
    - authoritative_match_runtime
    - reconnect_replay
  operations:
    - admin_dashboard
    - inspection
    - metrics
    - observability
    - migrations
  distributed_runtime:
    - frontend_backend_split
    - server_to_server_rpc
    - service_discovery
    - distributed_groups
    - cluster_safe_session_routing

