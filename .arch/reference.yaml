schema_version: 0.1
project: vibit
status: draft
purpose: >
  Machine-readable reference alignment manifest for game server capability
  planning. This manifest records external reference projects that agents
  should consult when planning modules, runtime subsystems, and roadmap scope.

standard: docs/reference-game-server-alignment.md
translation: docs/reference-game-server-alignment.zh-CN.md
decision: ADR-0019

reference_projects:
  - name: Nakama
    role: broad_game_backend_capability_surface
    homepage: https://heroiclabs.com/nakama
    documentation: https://heroiclabs.com/docs/
    repository: https://github.com/heroiclabs/nakama
    use_for:
      - authentication_users_accounts_sessions
      - social_friends_groups_parties_chat
      - storage_objects_and_custom_server_logic
      - matchmaker_realtime_multiplayer_authoritative_matches
      - leaderboards_tournaments_competitive_systems
      - dashboard_metrics_operations
      - economy_rewards_currencies_liveops_capability_families
    not_governing:
      - public_api_shape
      - runtime_module_layout
      - generated_file_conventions
      - agent_workflow
  - name: Pitaya
    role: go_game_server_framework_architecture_vocabulary
    documentation: https://pitaya.readthedocs.io/
    repository: https://github.com/topfreegames/pitaya
    use_for:
      - websocket_tcp_acceptors
      - session_binding
      - route_handler_model
      - frontend_backend_server_roles
      - rpc_and_remote_calls
      - groups_rooms_broadcast
      - cluster_service_discovery_vocabulary
    not_governing:
      - first_runtime_instance_model
      - immediate_distributed_architecture
      - public_api_shape
      - agent_workflow

vibit_differentiators:
  - agent_native_maintainability
  - explicit_module_ownership
  - contract_first_public_behavior
  - generated_repeatable_structure
  - machine_readable_manifests
  - architecture_checks
  - durable_change_specs_conversation_logs_and_adrs

capability_families:
  foundational:
    - player_identity
    - authentication
    - sessions
    - permissions
    - durable_storage
  metagame:
    - inventory
    - currency_wallet
    - rewards_claims
    - quests_tasks
    - leaderboards
    - tournaments
  social_realtime:
    - friends
    - groups
    - parties
    - chat
    - presence
    - status
  multiplayer:
    - matchmaking
    - match_session_lifecycle
    - rooms
    - broadcast_groups
    - authoritative_match_runtime
    - reconnect_replay
  operations:
    - admin_dashboard
    - inspection
    - metrics
    - observability
    - migrations
  distributed_runtime:
    - frontend_backend_split
    - server_to_server_rpc
    - service_discovery
    - distributed_groups
    - cluster_safe_session_routing

phase_plan:
  phase_0_agent_native_foundation:
    status: completed
    focus:
      - constitution_guides_change_specs_memory_adrs
      - architecture_manifests_and_checks
      - go_websocket_protobuf_postgresql_direction
      - runtime_handoff_protocol_adapter_dispatch_skeleton
      - inventory_contracts
  phase_1_first_vertical_backend_slice:
    status: completed
    focus:
      - inventory_handler_boundary
      - repository_policy_interfaces
      - postgresql_persistence_for_first_module_state
      - invariant_error_event_repository_tests
      - protocol_response_mapping
  phase_2_player_session_transport:
    status: authentication_token_session_validation_design_active
    focus:
      - player_identity_session_boundary_standard
      - player_account_session_contract_ratification
      - player_account_session_modules
      - websocket_transport_adapter
      - session_validation_connection_lifecycle
      - minimal_client_server_request_flow
    active_boundary_standard: docs/player-identity-session-boundary.md
    active_boundary_decision: ADR-0021
    completed_contract_milestone: M-005
    completed_contract_standard: docs/player-account-session-contracts.md
    completed_contract_standard_translation: docs/player-account-session-contracts.zh-CN.md
    latest_contract_work_item: W-0036
    completed_contract_direction: ratify_player_account_and_session_contracts
    next_direction_gate: M-006
    next_direction_work_item: W-0037
    selected_next_direction: improve_generators_and_contract_tooling_before_more_runtime_features
    active_tooling_milestone: M-007
    latest_completed_persistence_milestone: M-009
    completed_authentication_design_milestone: M-011
    latest_authentication_design_work_item: W-0062
    completed_next_direction_gate: M-012
    selected_post_authentication_design_direction: login_method_and_token_format_ratification
    active_login_token_ratification_milestone: M-013
    next_login_token_ratification_work_item: W-0064
    selected_authentication_direction: ratify_authentication_and_token_session_validation_design
    authentication_direction_change: changes/2026-05-14-confirm-next-direction-after-player-account-postgresql-persistence
    authentication_design_standard: docs/authentication-token-session-validation.md
    authentication_design_standard_translation: docs/authentication-token-session-validation.zh-CN.md
    authentication_contract_dimensions_standard: docs/authentication-proof-token-session-contract-dimensions.md
    authentication_contract_dimensions_standard_translation: docs/authentication-proof-token-session-contract-dimensions.zh-CN.md
    credential_external_identity_boundaries_standard: docs/credential-storage-external-identity-linking-boundaries.md
    credential_external_identity_boundaries_standard_translation: docs/credential-storage-external-identity-linking-boundaries.zh-CN.md
    session_persistence_websocket_handshake_decision_gates_standard: docs/session-persistence-websocket-handshake-decision-gates.md
    session_persistence_websocket_handshake_decision_gates_standard_translation: docs/session-persistence-websocket-handshake-decision-gates.zh-CN.md
    authentication_design_decision: ADR-0023
    authentication_design_change: changes/2026-05-14-define-authentication-token-session-validation-design-standard
    authentication_boundary_checks_change: changes/2026-05-14-add-authentication-token-session-boundary-checks
    authentication_contract_dimensions_change: changes/2026-05-14-ratify-authentication-proof-token-session-contract-dimensions
    credential_external_identity_boundaries_change: changes/2026-05-14-define-credential-storage-external-identity-linking-boundaries
    session_persistence_websocket_handshake_decision_gates_change: changes/2026-05-14-define-session-persistence-websocket-handshake-decision-gates
    authentication_design_close_change: changes/2026-05-14-close-authentication-token-session-validation-design-milestone
    authentication_boundary_check_rule: runtime.authentication_token_session_boundary
    next_direction_candidates:
      - login_method_and_token_format_ratification
      - runtime_player_account_handlers_and_websocket_routes
      - session_persistence_and_validation_model_selection
      - websocket_handshake_authentication_design
      - credential_storage_external_identity_linking_implementation_design
      - additional_game_backend_modules_after_nakama_pitaya_review
      - operations_observability_admin_tooling
      - multiplayer_presence_matchmaking_planning
    login_method_token_format_ratification_change: changes/2026-05-14-confirm-next-direction-after-authentication-design
    reference_pull:
      nakama:
        - account_user_authentication_session_capability_coverage
        - session_token_refresh_and_realtime_socket_relationship
        - token_refresh_expiration_revocation_vocabulary
        - realtime_socket_bound_to_authenticated_session_vocabulary
      pitaya:
        - session_binding
        - route_handler_vocabulary
        - frontend_backend_server_role_vocabulary
        - realtime_connection_session_context_vocabulary
    mapped_positions:
      nakama:
        account_user_as_first_class_capability: adopted
        multiple_authentication_methods: deferred
        login_method_families: deferred_capability_coverage
        credential_storage: separated_and_deferred
        external_identity_linking: separated_and_deferred
        session_token_concept: deferred
        refresh_token_concept: deferred
        realtime_socket_bound_to_authenticated_session: adapted
        validation_model_selection: deferred
        session_persistence: deferred
        websocket_handshake_authentication: deferred
        direct_public_api_compatibility: rejected_for_now
      pitaya:
        session_object_separate_from_acceptor: adopted
        handler_receives_session_context: adapted
        session_binding_vocabulary: adopted_as_vocabulary
        validation_model_selection: deferred
        websocket_handshake_authentication: deferred
        credential_and_provider_linking_ownership: outside_transport_session_context
        frontend_backend_split: deferred
        realtime_session_context: adapted
        direct_public_api_compatibility: rejected_for_now
    rule: Authentication and token/session validation design defines vibit-native, agent-readable boundaries before implementation; Nakama and Pitaya are references, not governing API shapes.
  phase_2b_agent_tooling_and_generator_hardening:
    status: active
    focus:
      - contract_index_inspection
      - generated_output_inspection
      - reproducible_generated_contract_shapes
      - agent_tooling_checks
      - continuation_intake_commands
    active_milestone: M-007
    rule: Strengthen agent intake, generation, and architecture checks before adding more runtime player, authentication, or broader game module behavior.
  phase_3_core_game_backend_modules:
    status: planned
    focus:
      - currency
      - rewards
      - friends_groups_parties
      - presence_status
      - chat
      - leaderboards
  phase_4_multiplayer_match_runtime:
    status: planned
    focus:
      - matchmaking
      - match_lifecycle
      - room_group_broadcast
      - authoritative_match_loop
      - reconnect_replay
  phase_5_distributed_runtime:
    status: deferred
    focus:
      - frontend_backend_roles
      - server_to_server_rpc
      - service_discovery
      - distributed_groups_rooms

rules:
  - id: references_are_planning_baselines_not_governing_standards
    level: required
    description: Nakama and Pitaya guide capability planning but do not override vibit's constitution, ADRs, manifests, or checks.
  - id: no_external_api_copy_without_adr
    level: required
    description: External API compatibility or copying requires a future explicit compatibility ADR.
  - id: agent_native_constraints_remain_primary
    level: required
    description: Feature parity must not weaken contract-first design, module ownership, generated boundaries, or verification.
  - id: distributed_runtime_deferred
    level: required
    description: Pitaya-style distributed clustering is deferred until single-process module, protocol, transaction, and verification boundaries are stable.
  - id: reference_before_new_capability
    level: recommended
    description: Agents should consult this manifest and docs/reference-game-server-alignment.md before adding a new game server capability family.
