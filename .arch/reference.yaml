rules:
  - id: references_are_planning_baselines_not_governing_standards
    level: required
    description: Nakama and Pitaya guide capability planning but do not override vibit's constitution, ADRs, manifests, or checks.
  - id: no_external_api_copy_without_adr
    level: required
    description: External API compatibility or copying requires a future explicit compatibility ADR.
  - id: agent_native_constraints_remain_primary
    level: required
    description: Feature parity must not weaken contract-first design, module ownership, generated boundaries, or verification.
  - id: distributed_runtime_deferred
    level: required
    description: Pitaya-style distributed clustering is deferred until single-process module, protocol, transaction, and verification boundaries are stable.
  - id: reference_before_new_capability
    level: recommended
    description: Agents should consult this manifest and docs/reference-game-server-alignment.md before adding a new game server capability family.
